-   kind: paradev_build_family
    identifier: pihc3-military-industrial-organization
    name: PIHC3 Military Industrial Organization Compiler
    desc: Registry-backed source slots and compiler hooks for military_industrial_organization.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: military-industrial-organizations
            title: Military Industrial Organizations
            group: military
            aliases:
            - mio
            title_key: modules.militaryIndustrialOrganizations.title
