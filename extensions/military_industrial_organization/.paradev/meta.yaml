    target:
        module: null
        qualname: PIHC3MilitaryIndustrialOrganization
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-military-industrial-organization
    name: PIHC3 Military Industrial Organization
    desc: PIHC3 military_industrial_organization module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-military-industrial-organization
        definition:
            identifier: pihc3-military-industrial-organization
            name: PIHC3 Military Industrial Organization
            version: 0.2.3
            desc: PIHC3 military_industrial_organization module persistence and authoring.
            required: false
            requires: []
