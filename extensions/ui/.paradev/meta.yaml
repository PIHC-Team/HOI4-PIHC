manifest_version: 2
coordinate: paradev-projects/pihc3/ui
version: 0.2.4
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-ui
items:
-   kind: entity
    identifier: pihc3-ui
    name: PIHC3 UI
    desc: One coherent PIHC3 user-interface resource set.
    source: path
    target:
        module: null
        qualname: PIHC3UI
    active: true
    meta:
        schema_version: 1
        version: 0.2.4
-   kind: extension
    identifier: pihc3-ui
    name: PIHC3 UI
    desc: PIHC3 interface persistence, resources, and compilation.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.4
        dependencies:
        - entity:pihc3-ui
        definition:
            identifier: pihc3-ui
            name: PIHC3 UI
            version: 0.2.4
            desc: PIHC3 interface persistence, resources, and compilation.
            required: false
            requires: []
            entities:
            - pihc3-ui
            meta:
                project: PIHC3
                family: ui
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-ui
    name: PIHC3 UI Compiler
    desc: Copies owned user-interface resources to exact game paths.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.4
        presentation:
            id: ui
            title: Interface Resources
            group: shared
        dependencies:
        - extension:pihc3-ui
-   kind: paradev_authoring_template
    identifier: pihc3-ui-basic
    name: PIHC3 Interface Resource Set
    desc: Create an editable HoI4 interface resource set.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.4
        dependencies:
        - paradev_build_family:pihc3-ui
        definition:
            template_id: pihc3:ui/basic
            declaration:
                title: PIHC3 Interface Resource Set
                family: ui
                directory: '{object_id} - {title}'
                args:
                    title:
                        required: true
                files:
                    interface/alerts.gui: 'guiTypes = {{

                        }}

                        '
