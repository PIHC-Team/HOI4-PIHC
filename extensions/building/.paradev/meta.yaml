manifest_version: 2
coordinate: paradev-projects/pihc3/building
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-building
items:
-   kind: entity
    identifier: pihc3-building-module
    name: PIHC3 Building Module
    desc: Project-owned building source module record.
    source: path
    target:
        module: null
        qualname: PIHC3BuildingModule
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-building
    name: PIHC3 Building
    desc: PIHC3 building module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-building-module
        definition:
            identifier: pihc3-building
            name: PIHC3 Building
            version: 0.2.3
            desc: PIHC3 building module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-building-module
            meta:
                project: PIHC3
                family: building
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-building
    name: PIHC3 Building Compiler
    desc: Registry-backed source slots and compiler hooks for building.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: buildings
            title: Buildings
            group: world
            title_key: modules.buildings.title
        dependencies:
        - extension:pihc3-building
-   kind: paradev_authoring_template
    identifier: pihc3-template-a9e4c3ed00f3798b
    name: PIHC3 Basic Building
    desc: PIHC3 authoring template pihc3:building/basic.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        definition:
            template_id: pihc3:building/basic
            declaration:
                title: PIHC3 Basic Building
                family: building
                args:
                    title:
                        required: true
                    description:
                        default: ''
                    base_cost:
                        default: '1000'
                    value:
                        default: '1'
                    infrastructure_construction_effect:
                        default: 'yes'
                    language:
                        default: en
                files:
                    def.txt: "buildings = {{\n\t{object_id} = {{\n\t\tbase_cost =\
                        \ {base_cost}\n\t\tvalue = {value}\n\t\tinfrastructure_construction_effect\
                        \ = {infrastructure_construction_effect}\n\t}}\n}}\n"
                    main.loc: '[{language}.{object_id}]

                        {title}


                        [{language}.{object_id}_desc]

                        {description}

                        '
                directory: '{object_id} - {title}'
