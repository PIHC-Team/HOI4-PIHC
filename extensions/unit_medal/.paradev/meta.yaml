manifest_version: 2
coordinate: paradev-projects/pihc3/unit_medal
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-unit-medal
items:
-   kind: entity
    identifier: pihc3-unit-medal-module
    name: PIHC3 Unit Medal Module
    desc: Project-owned unit_medal source module record.
    source: path
    target:
        module: null
        qualname: PIHC3UnitMedalModule
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-unit-medal
    name: PIHC3 Unit Medal
    desc: PIHC3 unit_medal module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-unit-medal-module
        definition:
            identifier: pihc3-unit-medal
            name: PIHC3 Unit Medal
            version: 0.2.3
            desc: PIHC3 unit_medal module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-unit-medal-module
            meta:
                project: PIHC3
                family: unit_medal
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-unit-medal
    name: PIHC3 Unit Medal Compiler
    desc: Registry-backed source slots and compiler hooks for unit_medal.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: unit-medals
            title: Unit Medals
            group: military
            title_key: modules.unitMedals.title
        dependencies:
        - extension:pihc3-unit-medal
-   kind: paradev_authoring_template
    identifier: pihc3-template-5e564b9fa8ef4158
    name: PIHC3 Basic Unit Medal
    desc: PIHC3 authoring template pihc3:unit_medal/basic.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        definition:
            template_id: pihc3:unit_medal/basic
            declaration:
                title: PIHC3 Basic Unit Medal
                family: unit_medal
                args:
                    title:
                        required: true
                    government:
                        default: democratic
                    frame:
                        default: '1'
                    icon:
                        default: GFX_medal_icon_democratic
                    cost:
                        default: '30'
                    modifier:
                        default: army_morale_factor
                    modifier_value:
                        default: '0.05'
                    one_time_xp:
                        default: '100'
                    language:
                        default: en
                files:
                    def.txt: "@cost = {cost}\nunit_medals = {{\n    {object_id} =\
                        \ {{\n        available = {{\n            has_government =\
                        \ {government}\n        }}\n\n        frame = {frame}\n  \
                        \      icon = {icon}\n        cost = @cost\n\n        unit_modifiers\
                        \ = {{\n            {modifier} = {modifier_value}\n      \
                        \  }}\n\n        one_time_effect = {{\n            add_divisional_commander_xp\
                        \ = {one_time_xp}\n        }}\n    }}\n}}\n"
                    main.loc: '[{language}.{object_id}]

                        {title}

                        '
                directory: '{object_id} - {title}'
