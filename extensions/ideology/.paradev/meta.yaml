manifest_version: 2
coordinate: paradev-projects/pihc3/ideology
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-ideology
items:
-   kind: entity
    identifier: pihc3-ideology-module
    name: PIHC3 Ideology Module
    desc: Project-owned ideology source module record.
    source: path
    target:
        module: null
        qualname: PIHC3IdeologyModule
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-ideology
    name: PIHC3 Ideology
    desc: PIHC3 ideology module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-ideology-module
        definition:
            identifier: pihc3-ideology
            name: PIHC3 Ideology
            version: 0.2.3
            desc: PIHC3 ideology module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-ideology-module
            meta:
                project: PIHC3
                family: ideology
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-ideology
    name: PIHC3 Ideology Compiler
    desc: Registry-backed source slots and compiler hooks for ideology.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: ideologies
            title: Ideologies
            group: country
            title_key: modules.ideologies.title
        dependencies:
        - extension:pihc3-ideology
-   kind: paradev_authoring_template
    identifier: pihc3-template-d65541a7441d07be
    name: PIHC3 Basic Ideology
    desc: PIHC3 authoring template pihc3:ideology/basic.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        definition:
            template_id: pihc3:ideology/basic
            declaration:
                title: PIHC3 Basic Ideology
                family: ideology
                args:
                    title:
                        required: true
                    description:
                        default: ''
                    subtype_id:
                        default: '{object_id}_type'
                    subtype_title:
                        default: '{title} Current'
                    color:
                        default: 120 150 220
                    can_force_government:
                        default: 'yes'
                    can_send_volunteers:
                        default: 'yes'
                    war_impact_on_world_tension:
                        default: '0.25'
                    faction_impact_on_world_tension:
                        default: '0.1'
                    language:
                        default: en
                files:
                    def.txt: "ideologies = {{\n\t{object_id} = {{\n\t\ttypes = {{\n\
                        \t\t\t{subtype_id} = {{\n\t\t\t}}\n\t\t}}\n\n\t\tcolor = {{\
                        \ {color} }}\n\n\t\trules = {{\n\t\t\tcan_force_government\
                        \ = {can_force_government}\n\t\t\tcan_send_volunteers = {can_send_volunteers}\n\
                        \t\t}}\n\n\t\twar_impact_on_world_tension = {war_impact_on_world_tension}\n\
                        \t\tfaction_impact_on_world_tension = {faction_impact_on_world_tension}\n\
                        \t}}\n}}\n"
                    main.loc: '[{language}.{object_id}]

                        {title}


                        [{language}.{object_id}_desc]

                        {description}


                        [{language}.{subtype_id}]

                        {subtype_title}


                        [{language}.{subtype_id}_desc]

                        {description}

                        '
                directory: '{object_id} - {title}'
