manifest_version: 2
coordinate: paradev-projects/pihc3/country_history
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-country-history
items:
-   kind: entity
    identifier: pihc3-country-history-module
    name: PIHC3 Country History Module
    desc: Project-owned country_history source module record.
    source: path
    target:
        module: null
        qualname: PIHC3CountryHistoryModule
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-country-history
    name: PIHC3 Country History
    desc: PIHC3 country_history module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-country-history-module
        definition:
            identifier: pihc3-country-history
            name: PIHC3 Country History
            version: 0.2.3
            desc: PIHC3 country_history module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-country-history-module
            meta:
                project: PIHC3
                family: country_history
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-country-history
    name: PIHC3 Country History Compiler
    desc: Registry-backed source slots and compiler hooks for country_history.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: country-history
            title: Country History
            group: country
        dependencies:
        - extension:pihc3-country-history
