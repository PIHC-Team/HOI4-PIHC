manifest_version: 2
coordinate: paradev-projects/pihc3/decision
version: 0.2.7
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-decision
items:
-   kind: paradev_build_family
    identifier: pihc3-decision
    name: PIHC3 Decision Compiler
    desc: Compiles decision modules, category collections, and owned artwork.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.7
        presentation:
            id: decisions
            title: Decisions
            group: country
            title_key: modules.decisions.title
-   kind: paradev_authoring_template
    identifier: pihc3-template-f5bd1d2a2a85d188
    name: PIHC3 Basic Decision
    desc: PIHC3 authoring template pihc3:decision/basic.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.7
        definition:
            template_id: pihc3:decision/basic
            declaration:
                title: PIHC3 Basic Decision
                family: decision
                args:
                    title:
                        required: true
                        description: Preferred-language decision name written to its
                            localization key.
                    description:
                        default: ''
                        type: text
                        description: Preferred-language decision tooltip written to
                            the `_desc` localization key.
                    category_id:
                        default: PIHC3_DECISIONS
                        description: Decision-category id that wraps this decision;
                            ParaDev also infers collection membership from this block.
                        reference:
                            kind: collection
                            family: decision
                    icon:
                        default: generic_political_reform
                        description: HoI4 decision icon identifier written after `icon
                            =`.
                    cost:
                        default: '25'
                        type: number
                        label: Political-power cost
                        description: Political-power cost paid when the decision is
                            taken.
                    language:
                        default: en
                        description: Localization language code for the generated name
                            and tooltip; PIHC3 commonly uses `zh` or `en`.
                files:
                    def.txt: "{category_id} = {{\n\t{object_id} = {{\n\t\ticon = {icon}\n\
                        \t\tallowed = {{\n\t\t\talways = yes\n\t\t}}\n\t\tvisible\
                        \ = {{\n\t\t\talways = yes\n\t\t}}\n\t\tcost = {cost}\n\t\
                        }}\n}}\n"
                    main.loc: '[{language}.{object_id}]

                        {title}


                        [{language}.{object_id}_desc]

                        {description}

                        '
                directory: '{object_id} - {title}'
-   kind: paradev_authoring_template
    identifier: pihc3-decision-category-basic
    name: PIHC3 Basic Decision Category
    desc: Create one independently editable PIHC3 decision-category collection.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.7
        dependencies:
        - paradev_build_family:pihc3-decision
        definition:
            template_id: pihc3:decision-category/basic
            declaration:
                kind: collection
                title: PIHC3 Basic Decision Category
                family: decision
                directory: '{object_id} - {title}'
                args:
                    title:
                        required: true
                        label: Decision-category name
                        description: Preferred-language category name used for the
                            readable folder and localization.
                    description:
                        default: ''
                        type: text
                        label: Description
                        description: Preferred-language decision-category tooltip.
                    icon:
                        default: generic_political_reform
                        label: Game icon
                        description: HoI4 decision-category icon identifier.
                    language:
                        default: en
                        description: Localization language code for the generated name
                            and tooltip; PIHC3 commonly uses `zh` or `en`.
                files:
                    def.txt: "{object_id} = {{\n\ticon = {icon}\n\tvisible = {{\n\t\talways = yes\n\t}}\n\tvisible_when_empty = yes\n}}\n"
                    main.loc: '[{language}.{object_id}]

                        {title}


                        [{language}.{object_id}_desc]

                        {description}

                        '
