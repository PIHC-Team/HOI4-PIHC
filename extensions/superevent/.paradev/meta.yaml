manifest_version: 2
coordinate: paradev-projects/pihc3/superevent
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-superevent
items:
-   kind: entity
    identifier: pihc3-superevent-module
    name: PIHC3 Superevent Module
    desc: Project-owned superevent source module record.
    source: path
    target:
        module: null
        qualname: PIHC3SupereventModule
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-superevent
    name: PIHC3 Superevent
    desc: PIHC3 superevent module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-superevent-module
        definition:
            identifier: pihc3-superevent
            name: PIHC3 Superevent
            version: 0.2.3
            desc: PIHC3 superevent module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-superevent-module
            meta:
                project: PIHC3
                family: superevent
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-superevent
    name: PIHC3 Superevent Compiler
    desc: Registry-backed source slots and compiler hooks for superevent.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: superevents
            title: Superevents
            group: events
            title_key: modules.superevents.title
        dependencies:
        - extension:pihc3-superevent
-   kind: paradev_authoring_template
    identifier: pihc3-template-c6ea374d99841c84
    name: PIHC3 Basic Super Event
    desc: PIHC3 authoring template pihc3:superevent/basic.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        definition:
            template_id: pihc3:superevent/basic
            declaration:
                title: PIHC3 Basic Super Event
                family: superevent
                args:
                    title:
                        required: true
                    description:
                        default: ''
                    mark:
                        default: '{title}'
                    news_title:
                        default: '{title}'
                    news_description:
                        default: '{description}'
                    news_option_title:
                        default: Continue
                    music:
                        default: superevent_music_{object_id}
                    language:
                        default: en
                files:
                    def.txt: "add_namespace = SUPER\nadd_namespace = SUPER_NEWS\n\n\
                        country_event = {{\n    id = SUPER.{object_id}\n    title\
                        \ = EVENT_SUPER_{object_id}_NAME\n    desc = EVENT_SUPER_{object_id}_DESC\n\
                        \    picture = GFX_EVENT_SUPER_{object_id}\n    is_triggered_only\
                        \ = yes\n    fire_only_once = yes\n    hidden = yes\n\n  \
                        \  immediate = {{\n        hidden_effect = {{\n          \
                        \  play_song = {music}\n            set_global_flag = PIHC_GLOBAL_FLAG_SUPEREVENT_{object_id}_ON\n\
                        \            set_global_flag = PIHC_GLOBAL_FLAG_SUPEREVENTS_VISIBLE\n\
                        \        }}\n    }}\n\n    option = {{\n        ai_chance\
                        \ = {{\n            factor = 100\n        }}\n        mark_focus_tree_layout_dirty\
                        \ = yes\n    }}\n}}\n\nnews_event = {{\n    id = SUPER_NEWS.{object_id}\n\
                        \    title = EVENT_SUPER_{object_id}_NEWS_NAME\n    desc =\
                        \ EVENT_SUPER_{object_id}_NEWS_DESC\n    picture = GFX_EVENT_SUPER_NEWS_{object_id}\n\
                        \    is_triggered_only = yes\n    major = yes\n\n    option\
                        \ = {{\n        ai_chance = {{\n            factor = 100\n\
                        \        }}\n        trigger = {{\n            is_ai = yes\n\
                        \        }}\n    }}\n\n    option = {{\n        ai_chance\
                        \ = {{\n            factor = 100\n        }}\n        trigger\
                        \ = {{\n            is_ai = no\n        }}\n        name =\
                        \ EVENT_SUPER_{object_id}_NEWS_o\n        hidden_effect =\
                        \ {{\n            set_global_flag = PIHC_GLOBAL_FLAG_SUPEREVENT_{object_id}_HAPPENED\n\
                        \            country_event = {{\n                id = SUPER.{object_id}\n\
                        \            }}\n        }}\n    }}\n}}\n"
                    main.loc: '[{language}.EVENT_SUPER_{object_id}_NAME]

                        {title}


                        [{language}.EVENT_SUPER_{object_id}_DESC]

                        {description}


                        [{language}.EVENT_SUPER_{object_id}_MARK]

                        {mark}


                        [{language}.EVENT_SUPER_{object_id}_NEWS_NAME]

                        {news_title}


                        [{language}.EVENT_SUPER_{object_id}_NEWS_DESC]

                        {news_description}


                        [{language}.EVENT_SUPER_{object_id}_NEWS_o]

                        {news_option_title}

                        '
                directory: '{object_id} - {title}'
