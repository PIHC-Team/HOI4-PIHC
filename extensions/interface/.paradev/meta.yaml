manifest_version: 2
coordinate: paradev-projects/pihc3/interface
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-interface
items:
-   kind: entity
    identifier: pihc3-interface-module
    name: PIHC3 Interface Module
    desc: Project-owned interface source module record.
    source: path
    target:
        module: null
        qualname: PIHC3InterfaceModule
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-interface
    name: PIHC3 Interface
    desc: PIHC3 interface module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-interface-module
        definition:
            identifier: pihc3-interface
            name: PIHC3 Interface
            version: 0.2.3
            desc: PIHC3 interface module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-interface-module
            meta:
                project: PIHC3
                family: interface
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-interface
    name: PIHC3 Interface Compiler
    desc: Registry-backed source slots and compiler hooks for interface.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: interface
            title: Interface
            group: shared
        dependencies:
        - extension:pihc3-interface
