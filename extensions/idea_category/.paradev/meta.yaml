manifest_version: 2
coordinate: paradev-projects/pihc3/idea_category
version: 0.2.3
compatibility:
    heavenbase:
        min: 0.1.2.1
        before: 0.1.3.0
bundle: pihc3-idea-category
items:
-   kind: entity
    identifier: pihc3-idea-category
    name: PIHC3 Idea Category Module
    desc: Project-owned idea_category source module record.
    source: path
    target:
        module: null
        qualname: PIHC3IdeaCategory
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
-   kind: extension
    identifier: pihc3-idea-category
    name: PIHC3 Idea Category
    desc: PIHC3 idea_category module persistence and authoring.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        dependencies:
        - entity:pihc3-idea-category
        definition:
            identifier: pihc3-idea-category
            name: PIHC3 Idea Category
            version: 0.2.3
            desc: PIHC3 idea_category module persistence and authoring.
            required: false
            requires: []
            entities:
            - pihc3-idea-category
            meta:
                project: PIHC3
                family: idea_category
            setup: null
            api: null
            api_name: null
-   kind: paradev_build_family
    identifier: pihc3-idea-category
    name: PIHC3 Idea Category Compiler
    desc: Registry-backed source slots and compiler hooks for idea_category.
    source: path
    target:
        module: null
        qualname: build_family
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        presentation:
            id: idea-categories
            title: Idea Categories
            group: country
            title_key: modules.ideaCategories.title
        dependencies:
        - extension:pihc3-idea-category
-   kind: paradev_authoring_template
    identifier: pihc3-template-414ec876c64c501f
    name: PIHC3 Basic Idea Category
    desc: PIHC3 authoring template pihc3:idea_category/basic.
    source: inline
    target: definition
    active: true
    meta:
        schema_version: 1
        version: 0.2.3
        definition:
            template_id: pihc3:idea_category/basic
            declaration:
                title: PIHC3 Basic Idea Category
                family: idea_category
                directory: '{object_id} - {title}'
                args:
                    title:
                        required: true
                    description:
                        default: ''
                    law:
                        default: 'yes'
                    use_list_view:
                        default: 'yes'
                    cost_factor_title:
                        default: '{title} Cost'
                    language:
                        default: en
                files:
                    def.txt: "ideas = {{\n    {object_id} = {{\n        law = {law}\n\
                        \        use_list_view = {use_list_view}\n    }}\n}}\n"
                    main.loc: '[{language}.{object_id}]

                        {title}


                        [{language}.{object_id}_desc]

                        {description}


                        [{language}.{object_id}__cost_factor]

                        {cost_factor_title}

                        '
