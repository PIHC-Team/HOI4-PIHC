	SETTINGS_ACCESSIBILITY_STT_SHORTCUT_INPUT:0 "多马游戏聊天语音转文字快捷键"
	form_siberia_category_desc:0 "西伯利亚从未有过统一的身份，无论是在文化上、种族上还是政治上；唯一的例外是，他们现在都成了“俄罗斯人”。然而正是因为被俄罗斯人逼入同一地域，西伯利亚人民从未像现在这样团结。如果一个国家想要统一西伯利亚，并驱逐俄罗斯帝国主义者，那么一定会有很多西伯利亚人愿意接受这个新国家。事实上，目前也有很多马渴望着这样一个国家的出现。"
	INVITE_CANTCONNECT_RESOLUTION:0 "现在不能处理邀请。你只能在主菜单或多马游戏页面接受邀请。"
	JOIN_CANTCONNECT_RESOLUTION:0 "现在不能处理加入请求。你只能在主菜单或多马游戏页面接受加入请求。"
	FRIENDS_VIEW_INVITE:0 "邀请至多马游戏"
	PLAYTHROUGH_OV_MP:0 "多马游戏中不会跟踪统计数据"
	PLAYTHROUGH_OV_MP_AWARDS:0 "多马游戏无法获得勋章和勋表"
	CAREER_PROFILE_AWARDS_NOT_AVAILABLE_IN_MULTIPLAYER:0 "荣誉记录在多马游戏中不可用"
	MATCHMAKING_TITLE:0 "多马游戏"
	FE_IRONMAN_MP_BLOCKED:0 "§R多马游戏无法使用铁人模式。§!"
	operation_infiltrate_armed_forces_army_desc:0 "§L[From.GetAdjective]陆军中有许多马员可以倒向我方，为未来的行动提供更多信息和支持。§!"
	TOUCHED_GAMESTATE_NO_MP:0 "如果你之前加入过一个房间，将不能开始多马游戏。在最终版本中我们将修复这个问题。请离开游戏并直接进入多马游戏"
	DIPLOMACY_REQUEST_FOREIGN_MANPOWER_REQUEST_DESC_MORE:0 "$COUNTRY|UY$请求我们为驻军补充更多马力。\n他们已经获得了我们的$NUMBER|H*$人力。"
	FOREIGN_MANPOWER_REASON_ALREADY_ENOUGH:0 "$COUNTRY|UY$不愿意支援我们更多马力："
	BALTIC_secure_military_support_desc:0 "军队中很多马都在尝试让自己的国家摆脱[Root.GetLeader]的领导，而我们要做的就是和他们展开接触。成为人民英雄的承诺将会吸引追求荣誉与名望的将军支持我们的事业。"
	SOCIAL_DSTATUS_IN_MP_LOBBY:0 "正在多马游戏大厅"
	support_republican_spain_desc:0 "西班牙内战被很多马视为其内部对当今世界意识形态的冲突。发送装备援助共和国，由此我们可以表明反对法西斯暴徒压制西班牙民众的立场。"
	support_nationalist_spain_desc:0 "西班牙内战被很多马视为其内部对当今世界意识形态的冲突。发送装备援助国民军，由此我们可以表明反对无政府主义者和赤色分子摧毁西班牙的立场。"
	governments_in_exile_ETH_desc:0 "[ROOT.GetLeader]已在[ROOT.GetLeader.GetHerHis]位于[?ETH.host_nation.GetNameDef]的基地建立了临时流亡政府。形势急转直下，但仍非毫无希望。一些战士设法逃脱了，且更多马有望在将来加入我们。另外，皇室已经安定下来，因此我们可以将资金转移到可以提高我们夺回[ETH.GetName]几率的行动中。\n\n   当前皇家财库余额：§Y[?ETH_treasury]§!£GFX_ETH_imperial_treasury"
	CAREER_PROFILE_DROPDOWN_MULTIPLAYER:0 "多马游戏"
	MULTIPLAYER_LOBBY:0 "多马游戏大厅"
	SERVER_LAUNCHING_MP:0 "*** 开始多马游戏 ***"
	spiritual_mobilization_idea_desc:0 "“骄奢淫逸是我们的敌人！” 随着节俭、卫生和努力工作被提升为国家美德，使得更多马力能够投入战争中。"
	LOGIN_DESCRIPTION_BOLD:0 "登录到你的Paradox账号来游玩多马游戏"
	CREATE_PARADOX_ACCOUNT_FEATURES:0 "创建一个Paradox账号以：\n\t-进行多马游戏\n\t-收集成就\n\t-将你的存档备份到云端\n\t-获权进入Paradox论坛\n\t-获得专属的折扣与优惠"
