l_simp_chinese:
	tac_bomber_equipment_0_desc:0 "许多马相信，下次战争中将通过将敌军炸成渣渣而大获全胜。我们有必要设计自己的轰炸机，能够在适当速度下携带重载荷飞行。"
	PLAYER_AI_PREFS_DISABLED:0 "只能在多马游戏中的选项。"
	PLAYER_AI_PREFS_DESC:0 "当你离开多马游戏在此窗口中可以切换你的国家的AI行为。\n该设置存储在保存文件，因此，如果其他玩家在没有你的情况下继续游戏，AI会根据这些设置控制你的国家。"
