	CAN_SH_battleship_2_desc:0 "狮II级战列舰的设计来自于在1944年对早期狮级战列舰的一个改进版本。由于汲取了战时的经验教训，这种设计变得越来越庞大与沉重。如果该舰完成了，它将会配备三或四个最新型的16英寸火炮，厚钢板装甲保护船只抵御从任何方向甚至空中敌马的进攻。但由于需要庞大的成本来建设这些船只，以及对航空母舰需求量的上升，导致该项目最终被放弃。"
	NZL_heavy_cruiser_3_desc:0 "海军上将级重巡洋舰（不要与海军上将级巡洋舰混淆）是皇家海军最后一次尝试建造装备有8英寸舰炮的巡洋舰。设计研究开始于1938年，终止于1941年。期间有各种各样的建议，最后的建议是装备新的三联装8英寸炮塔，重型的防空武器，厚重的装甲以及维持良好的航行速度。由于缺乏相应的敌马和这些船体导致的成本，使重心转变为了建设更多的轻巡洋舰。"
	NZL_heavy_cruiser_4_desc:0 "这些设计是由温斯顿·丘吉尔爵士于海军部所提出的，为在二战的早期阶段应对德国的德意志兰级战列巡洋舰。这些船只装备有9.2英寸舰炮，重型防空武器和强大的装甲。它们是为了有效地打击敌马的主力舰。这些设计最终由于高昂的成本和对新型重巡洋舰需求的缺乏而取消。"
	NZL_SH_battleship_2_desc:0 "狮II级战列舰的设计来自于在1944年对早期狮级战列舰的一个改进版本。由于汲取了战时的经验教训，这种设计变得越来越庞大与沉重。如果该舰完成了，它将会配备三或四个最新型的16英寸火炮，厚钢板装甲保护船只抵御从任何方向甚至空中敌马的进攻。但由于需要庞大的成本来建设这些船只，以及对航空母舰需求量的上升，导致该项目最终被放弃。"
	RAJ_heavy_cruiser_3_desc:0 "海军上将级重巡洋舰（不要与海军上将级巡洋舰混淆）是皇家海军最后一次尝试建造装备有8英寸舰炮的巡洋舰。设计研究开始于1938年，终止于1941年。期间有各种各样的建议，最后的建议是装备新的三联装8英寸炮塔，重型的防空武器，厚重的装甲以及维持良好的航行速度。由于缺乏相应的敌马和这些船体导致的成本，使重心转变为了建设更多的轻巡洋舰。"
