l_simp_chinese:
	STAT_ARMY_DEFENSE_DESC:0 "处于防御状态时一个单位能够试图躲避敌马攻击的次数，有效的使其坚守的时间延长。"
	STAT_ARMY_BREAKTHROUGH_DESC:0 "处于进攻状态时一个单位能够试图躲避敌马攻击的次数，有效的使其进攻的时间延长。"
	STAT_ARMY_SOFT_ATTACK_DESC:0 "这个单位对于敌马低装甲率部队的攻击次数。"
	STAT_ARMY_HARD_ATTACK_DESC:0 "这个单位对于敌马高装甲率部队的攻击次数。"
	STAT_ARMY_ENTRENCHMENT_DESC:0 "在敌马进攻前准备好对应的战壕的能力。"
	STAT_NAVY_MISSION_COVERAGE_DESC:0 "§T这艘船发现敌马的效率。舰队中每艘船的索敌效率相加。§!"
	STAT_NAVY_EVASION_DESC:0 "船只通过机动避开敌马开火的能力。计算目标规避打击机会时要考虑攻击者的规避能力，就是说如果你的规避高也会更容易打中规避高的敌马。"
	STAT_NAVY_SUB_ATTACK_DESC:0 "使用深水炸弹对敌马潜艇造成的伤害。"
	STAT_NAVY_ATTACK_DESC:0 "我们击穿敌马船体的能力。"
	STAT_NAVY_MAXIMUM_SPEED_DESC:0 "当试图从战斗中撤退时，速度更快的船更容易脱离追击者。它也不太可能被敌马的火力击中，在发现敌马时可以更容易地进行通信，并且在脱离战斗后移动得更快。"
	STAT_ARMY_EQUIPMENT_CAPTURE_FACTOR_DESC:0 "敌马被击败后可以缴获的装备的比例。"
	PIERCING_COMBAT_DESC:0 "伤害受到击穿敌马装甲厚度的比例影响："
	BM_RIVER_PENALTY_DESC:0 "渡河总是危险的行动，尤其当你处于敌马火力之下时。"
	LAND_COMBAT_CAS_INFO_TOOLTIP:0 "大约$NUM|Y$架支援机从$SIDE$起飞并参与了这场战斗。\n他们对敌马§Y组织度§!造成了$ORG|G0$伤害，目前敌马的§Y组织度§!是$ORG_MAX|G0$。\n他们对敌马§Y兵力§!造成了$STR|G0$伤害，目前敌马的§Y兵力§!是$STR_MAX|G0$。\n敌方部队的§Y对空§!击落了$KILL|R$架飞机，防止了$ORG_PREVENT|R0$§Y组织度§!损失与$STR_PREVENT|R0$§Y兵力§!损失。"
	EQUIPMENT_CAPTURED_BY_ENEMY_ENTRY:0 "敌马缴获了$NUM|Y0$。"
	BORDER_CONFLICT_FOR_ENEMY:0 "对于敌马（$COUNTRY|H$）："
	combat_stat_light_guns_info:0 "§H轻型舰炮§!\n\n轻型舰炮对付§Y屏卫舰§!更有效。你舰队中的轻型舰炮将会瞄准距离最近的敌马。"
	combat_stat_torpedoes_info:0 "§H鱼雷§!\n\n鱼雷能够无视装甲，对付§Y主力舰§!十分有效。对敌马发射并成功打击的鱼雷数量取决于对方的§Y屏卫效率§!。"
	POSITIONING_INFO:0 "§H阵位§!表示你的舰队相较于敌马有着怎样的有利阵型布置。其受舰队规模、天气以及将领技能影响。在战斗开始后舰队会有一个临时的阵位惩罚。\n\n若阵位数值低于100%，你的舰队将会受到作战惩罚。"
	relative_damage_ratio_to_enemy_health:0 "敌马受损程度：$NUM|%.1H$"
	total_damage_dealt:0 "造成的总伤害：$NUM|.0H$（敌马能够承受损伤的$RATIO|%.0H$）"
	SUBMARINE_BOX_TOOLTIP:0 "§Y潜艇狼群§!将在保持隐蔽的同时并试图用她的鱼雷收割正在逃离战斗的舰只。如果敌马缺乏专用反潜舰只的话潜艇将在未被发现的情况下轻易溜走。"
	CARRIER_PLANE_SCREEN_DESC:0 "我们的舰载机将限制敌马的行动自由，从而有助于掩护工作。"
	COMBAT_LOG_BATTLE_OVERRUN_WIN:0 "敌马的单位被我们§H击溃§!了。"
	COMBAT_LOG_BATTLE_OVERRUN_LOSS:0 "我们的单位被敌马§H击溃§!了。"
	COMBAT_LOG_OVERRUN_DESC:0 "§H击溃§!是指一个单位被完全摧毁。这发生在当一个单位向一个省份撤退时，该省份被敌马抢先占领。"
	upgrade_army_department_desc:0 "§L敌马的军事情报有无可比拟的重要性，因此建立军事情报部门是必要的。我国特工将受训渗透敌方军队，扮演上至将军下到士兵的角色并向我们回报他们在敌后刺探的机密。§!"
	upgrade_invisible_ink_desc:0 "§L隐形墨水所写书信在肉眼看来不过是白纸一张，但利用紫外线或氨等化学品则能显现书信内容。规定所有特工都使用隐形墨水将使信息在被敌马截获时也不至被曝光。§!"
	upgrade_interrogation_techniques_desc:0 "§L击垮敌方特工的精神而非身体往往更加高效。肢体暴力难以依靠，结果往往是吐出假消息；而真正技巧娴熟的审讯者仅凭巧舌如簧就能让敌方的意志轰然倒塌。当然，如果形势需要，我们有花样繁多的手段来撬开敌马的嘴...§!"
	upgrade_diplo_training_desc:0 "§L训练我方特工“公关”一批外国投资者与外交马员可能使他们感受我国恩泽并让他们背离我国的敌马。§!"
	OPERATIVE_INVALID_MISSION_REASON_CANNOT_TARGET_AN_ENEMY:0 "不能选定敌马"
	INTEL_NETWORK_STRENGTH_GROWTH_ENEMY_FACTOR:0 "敌马驻军法案：$VALUE|+%0$"
	CRYPTO_DEFENSE_LEVEL_DESC:0 "我国的§H密码学等级§!为$LEVEL|H$，并具有$STRENGTH|0H$£crypto_defense£§H密码强度§!。\n\n§H密码强度§!影响了敌马破译我国密码所需要的时间。"
	CRYPTO_FULLY_DECRYPTED_PASSIVE_MODIFIERS_DESC:0 "敌方密码已被完全破译。我们将获得以下针对敌马的被动加成："
	CRYPTO_CLICK_TO_ACTIVATE_ACTIVE_BONUSES_2:0 "我们将在被动加成的基础上，在$NUM|H$日内获得以下加成，但敌马会注意到我们的解密成果，并且随后会更换密码。"
	CRYPTO_ACTIVATE_ACTIVE_BONUSES_NOT_READY_YET:0 "敌方密码尚未被完全破译。当破译完成后，你可以在被动加成的基础上激活主动破译加成$NUM|H$日，但这样的话敌马会注意到我们的解密成果并随后更换密码。"
	CRYPTO_ENEMY_ACTIVATED_THEIR_CRYPTO_TITLE:0 "我国的密码已经被敌马§R破译§!"
	AIR_EXPERIENCE_DESC:0 "当你的飞机在任务中遭遇敌马或是进行§H空军演习§!时，你能够获得空军经验。这表示你可以通过§H飞机§!在战斗中直接交战或者§H租借§!武器装备给你的盟友参战来直接或间接获得空军经验。\n某些§H国策§!给予附加经验。某些§H部长§!能够增加获得的经验。\n\n空军经验用于为现有飞机开发更好的改进型号。"
	DIPLOMACY_JOINED_WAR_ENEMY:0 "$COUNTRY1|UY$加入了$COUNTRY2|Y$的$WAR|Y$，他们将是我们的§R敌马§!！"
	DIPLOMACY_CALLED_WAR_ENEMY:0 "$COUNTRY1|UY$召唤$COUNTRY2|Y$参加$WAR|Y$，他们将是我们的§R敌马§!！"
	DIPLOMACY_MERGED_WAR_DESC:0 "我们的$OUR_WAR|Y$已经与$NEW_WAR|Y$合并\n我们的阵营已经加入了这场战争：\n$ALLIES_LIST|Y$\n\n我们的敌马是：\n$ENEMIES_LIST|Y$"
	DIPLOMACY_SUPPORTING_ENEMY:0 "我们在支援他们的敌马：$ENEMIES|H$"
	DIPLOMACY_SUPPORT_ENEMIES:0 "我们在用志愿军和军事顾问支援他们的敌马们：$LIST$"
	DIPLOMACY_LEND_LEASE_REASON_ENEMY:0 "我们无法向敌马实行租借法案。"
	DIPLOMACY_INCOMING_LEND_LEASE_REASON_ENEMY:0 "我们不能从敌马那里租借。"
	DR_TOO_DANGEROUS:0 "§Y$THEM|U$§!与敌马有危险的国界线相邻。"
	SEND_VOL_SENT_VOL_TO_ENEMY:0 "我们已经向@$TAG$$WHO|H$的敌马派遣了志愿军或者已经得到该国空域的使用许可。"
	SEND_VOLUNTEERS_EAGER_AI:0 "§Y$THEM|U$§!会高兴地接受任何可以对抗我们共同敌马的帮助："
	POTENTIAL_ENEMIES:0 "潜在的敌马："
	ENEMIES:0 "§H敌马§!"
	DIPLOMACY_HOSTILE_STATUS:0 "我们现在是敌马"
	WARGOAL_COST_VOLUNTEERS_VALUE:0 "$COUNTRY|UY$向我们的敌马派遣了志愿军：$VALUE|G$"
	AI_MESSAGE_CAT3_MES4:0 "要不是P社故意把我的盟友的智商写的跟屎一样，把我的敌马写的可以预知所有战斗，我才不会输给$OTHER$！"
	DIPLOMACY_ASSUME_FACTION_LEADERSHIP_IN_ALL_WARS_PROGRESS:0 "你与阵营领导者的共同敌马马数为$CURRENT|R$，你们需要一同对抗$NEEDED|Y$位敌马才可。"
	GRE_strategic_enemy:0 "战略敌马"
	TUR_aiding_our_enemies:0 "帮助我们的敌马"
	BUL_old_enemies:0 "旧敌马"
	STRAT_RADAR_EFFICIENCY_DESC:0 "§H我方雷达效率§!\n本区域的§Y雷达效率§!越高则拦截机越容易发现敌马，空中巡逻更易接敌。在范围内建造更高等级的雷达站来提高雷达效率。"
	STRAT_RADAR_EFFICIENCY_ENEMY_DESC:0 "§H敌方雷达效率§!\n本区域的§Y雷达效率§!越高则拦截机越容易发现敌马，空中巡逻更易接敌。在范围内建造更高等级的雷达站来提高雷达效率。"
	AIRWING_MISSION_TYPE_NAVAL_MINE_PLANTING_DESC:0 "在这些地区投放水雷，敌马会受到的最大潜在惩罚是："
	LOGISTICS_DELETE_EQUIPMENT_CONFIRM_DESC:0 "确定要§R销毁§!$EQUIPMENT|Y$？\n\n这些装备会从库存中被移除，你将再也无法使用它们。这个指令是不可逆的。\n\n如果我国在$NUM_DAYS|Y$日内停止抵抗或者被吞并，敌马依然可以获得这些装备。"
	tank_close_support_gun_desc:0 "一种旨在向敌马的野战防御工事发射高爆炮弹，以帮助步兵进行攻坚作战的小型火炮。虽然这种火炮可以承担一定的轻型反坦克任务，但它的短炮管导致的低初速和其有限的弹药使其无法对付更强大的敌方坦克。"
	light_tank_destroyer_chassis_desc:0 "一款小巧紧凑的战车，携带着强大的火炮以摧毁敌马的装甲。"
	light_tank_aa_chassis_desc:0 "一款小巧紧凑的战车，携带着防空炮以抵御敌马的飞机。"
	medium_tank_destroyer_chassis_desc:0 "一款平衡良好的战车，携带着强大的火炮以摧毁敌马的装甲。"
	medium_tank_aa_chassis_desc:0 "一款平衡良好的战车，携带着防空炮以抵御敌马的飞机。"
	improved_heavy_tank_chassis_desc:0 "虽然战争的性质发生了变化，但具有厚重装甲的重型战车仍然有机会突破敌马的防线，或者用于加强防御以抵御敌马的攻击。"
	heavy_tank_destroyer_chassis_desc:0 "一款重型战车，携带着强大的火炮以摧毁敌马的装甲。"
	heavy_tank_aa_chassis_desc:0 "一款重型战车，携带着防空炮以抵御敌马的飞机。"
	armor_tech_1_desc:0 "一战期间的坦克只需要与敌马的轻武器抗衡。因此，他们使用了相当薄的装甲。但新一代的反坦克武器让战场成为对来说坦克更危险的地方，所以其需要更重的装甲。"
	tank_rocket_launcher_2_desc:0 "虽然进行了准确性的升级，但是这种火箭发射器最主要的改进还是可以携带更多的弹药，以向敌马施加更加致命的打击。"
	CUSTOM_EFFECT_CREATE_FAKE_ARMIES:0 "将会布下多支疑兵部队，可用于欺骗你的敌马。"
	CUSTOM_EFFECT_CREATE_FAKE_ARMIES_RESULT:0 "布下[?num_to_create|.0H]支疑兵，这可用来对抗你的敌马。"
	grand_assault_desc:0 "一旦准备好庞大军队并明确其目标，敌马在强大攻势面前唯有坐以待毙。"
	tech_engineers2_desc:0 "拥有了现代化装备和高爆炸药后，我方工兵将走出传统角色，在陆上与海洋利用创造力打敌马措手不及。"
	dispersed_industry_desc:0 "通过分散工业，我方能确保敌马在战时将难以瞄准它。"
	BASE_STRIKE_DESC:0 "大幅侧重于航母与其支援，无论在海洋或是陆地都没有我方触及不到的敌马。"
	smoke_generator_desc:0 "对轻中型船舰的引擎和烟囱进行一些小改造，使它们能够制造大量能遮蔽敌马视野的烟雾。"
	basic_cruiser_armor_scheme_desc:0 "这种装甲设计方案仿照了主力舰上分离舷侧和甲板的装甲的做法，并能提供一定程度上对弹片与小口径火炮的防御。\n\n在§Y巡洋舰§!上安装这个模块可以提高它们§Y抵御敌马伤害§!的能力，但也会§R降低§!它们的§Y速度§!。"
	improved_cruiser_armor_scheme_desc:0 "将水线装甲依照一定的角度摆放，能够使得与之前相同重量与厚度的装甲更难被穿透。\n\n在§Y巡洋舰§!上安装这个模块可以提高它们§Y抵御敌马伤害§!的能力，但也会§R降低§!它们的§Y速度§!。"
	advanced_cruiser_armor_scheme_desc:0 "该方案只注重保护船舶上最重要的部分，而忽略了不重要的部分。\n\n在§Y巡洋舰§!上安装这个模块可以提高它们§Y抵御敌马伤害§!的能力，但也会§R降低§!它们的§Y速度§!。"
	basic_heavy_armor_scheme_desc:0 "将水线装甲依照一定的角度摆放，能够使得与之前相同重量与厚度的装甲更难被穿透。\n\n在§Y重型舰艇§!上安装这个模块可以提高他们§Y抵御敌马伤害§!的能力。§Y战列舰§!和§Y战列巡洋舰§!由它们不同的§Y装甲方案§!来决定。"
	improved_heavy_armor_scheme_desc:0 "该方案只注重保护船舶上最重要的部分，而忽略了不重要的部分。\n\n在§Y重型舰艇§!上安装这个模块可以提高他们§Y抵御敌马伤害§!的能力。§Y战列舰§!和§Y战列巡洋舰§!由它们不同的§Y装甲方案§!来决定。"
	TRIGGER_HAS_FLANKED_OPPONENT:0 "侧翼包抄敌马。"
	TRIGGER_HAS_NOT_FLANKED_OPPONENT:0 "没有侧翼包抄敌马。"
	espionage_idea_desc:0 "对敌马和我们周围的世界的了解是制定全部政策的基石。"
	tank_buster_2_desc:0 "现役的重型坦克需要更大型的炮来击毁。这门武器虽极为沉重和笨拙，但的确是攻击敌马坦克部队的利器。"
	large_plane_airframe_1_desc:0 "这种机身是为测试一架真正意义上的战略轰炸机的潜能而设计，它需要有能力袭击敌马领土深处的工业目标，并将乘员活着带回来。"
	large_plane_airframe_3_desc:0 "为超远程和超高海拔飞行而优化，这种机身能够深入敌方领土，并将相当数量的炸弹投放到敌马的核心地带。"
	large_plane_maritime_patrol_plane_airframe_0_desc:0 "舰队依赖长程飞机来搜寻远在海上的敌马。虽然有些过时，但是这种机身可以提供搜寻广阔的海洋所需的高航程。"
	photo_reconnaisance_desc:0 "飞机最早的军事应用就是搜寻敌马，并将其方位报告给地面上的将军们。时至今日，这仍然是军事航空最常见的任务之一。"
	GER_jet_strat_bomber_equipment_1_desc:0 "根据经验设计的飞翼是隐形轰炸机的未来。结合洲际航程，此种轰炸机甚至可在敌马反应前打击最远的敌马。"
	operation_capture_cipher_desc:0 "§L夺取敌马的密码本，或通过其他手段拿到手，我们的密码破译马员将获得决定性优势§!"
	infiltration_submarine_desc:0 "特工将通过潜艇从海岸开始渗透。我们已经侦查了可能的登陆地点和敌马巡逻的时间，以避免被发现。"
	infiltration_diplomatic_desc:0 "特工将使用外交护照入境并活动。我们预料到敌马的反间谍机构会设法跟踪他们，但这可以通过充分的训练来避免。"
	exfiltration_air_pickup_desc:0 "一架飞机将在夜间进入敌马领土，找到标记区域，并将我们的特工接走。"
	operation_steal_tech_airforce_desc:0 "§L一些非常令马担忧的报告认为，敌马在飞机设计的数个领域都领先于我们。若真如此，我们可以尝试深入了解他们到底领先了多少，并利用这些发现推进我们自己的研究。§!"
	targeted_sabotage_destroy_bridge_desc:0 "当地的抵抗组织决定突袭一座桥梁，那是敌马在该地区运输补给的关键。我们的特工将会配合行动，用几磅的烈性炸药将其炸毁。"
	operation_targeted_sabotage_industry_desc:0 "§L敌马占领区中的抵抗组织请求我们援助，以摧毁当地一座工厂。§!"
	operation_targeted_sabotage_resources_desc:0 "§L敌占区的抵抗运动使我们了解到敌马企图开采该地区的资源。如果对这些计划进行适当的调整，就可以避免发生这种情况。§!"
	operation_rescue_operative_desc:0 "§L我们的一个线马被敌马俘虏了。我们必须解救他，而且要快，以免敌马将他杀害。§!"
	free_operative_free_in_transit_desc:0 "敌马用汽车将我们的特工从监狱和审问地点间来回运输。我们已经得知了路线，将派遣一支小分队设下埋伏，击杀卫兵，解救特工。"
	operation_collaboration_government_desc:0 "§L成立一个友好的政府来管理[From.GetNameDef]，可以让我们集中精力对付其他敌马，并释放军队去征讨其他目标。§!"
	fake_intel_decoy_tanks_desc:0 "我们创造了从远处看像坦克的廉价诱饵。我们将把它们放在容易被发现的位置，并确保敌马有足够的时间注意到它们。"
	fake_intel_radio_deception_desc:0 "我们将成立一个无线电专家小分队，伪装成一个更大编队的信号分遣队。他们还将使用我们的旧版本密码，让敌马更容易读取他们的信息。"
	fake_intel_deliberate_leaks_desc:0 "我们在外国的一些特工将确保他们在合适的马员面前轻率行事，从而确保敌马通过“可靠的”来源获得所需的信息。"
	fake_intel_press_releases_desc:0 "我们将邀请记者就我们希望敌马了解的一些事情写非常详细的报道。"
	fake_intel_utilize_double_agents_desc:0 "我们已经把敌马情报部门的一些初级线马调来了。他们将被鼓励向对方提供正确的信息。"
	fake_intel_plant_evidence_desc:0 "我们将在敌马控制的但我们目前不感兴趣的地方展开一次小规模行动，并确保我们留下大量证据。"
	bruneval_raid_desc:0 "§L在雷达发展方面，敌马似乎走在我们前面。我们已经在一个易受攻击的地方发现了一个敌马的雷达装置，我们相信这可能是一支小规模部队为获取更多情报而进行的足够果断的攻击。§!"
	capture_tito_exfiltration_desc:0 "如若两只突击部队成功汇合，他们就会巩固现有区域并扫荡幸存的敌马。"
	infiltration_diplomatic_outcome:0 "这只队伍顺利地潜伏进了这个国家，并巧妙避开了敌马反间谍机构的追踪。"
	exfiltration_border_outcome:0 "我们的特工会趁着夜色越过边境逃脱。本地向导已经处于待命状态，随时准备帮助特工越过边境上的敌马防军。"
	fake_intel_decoy_tanks_outcome:0 "敌马在该地区进行了几次侦查，不确定他们是否发现了我们留下的错误信息，并因此而被诱导。我们正等待消息看他们是否上当。"
	fake_intel_radio_deception_outcome:0 "我们的无线电操作员伪造了大量通信。敌马是否监听到了这些内容还很难说。"
	fake_intel_deliberate_leaks_outcome:0 "我们向敌方特工提供了一些虚假的“泄露“信息。敌马是否真的相信还未可知。"
	fake_intel_utilize_double_agents_outcome:0 "我们的双面间谍向敌方提供了大量信息——其中甚至包含了些真的，以确保敌马继续信任他们。"
	fake_intel_plant_evidence_outcome:0 "我们的突袭完全成功，敌马发现了我们留下的大量证据。早期报告显示，敌马已经因此进行了一系列部队调动。"
	steal_blueprints_middle_manager_outcome:0 "我们的特工在小公司的管理上花费的时间大大加深了我们对敌马经济的理解。我们仍在调查有关我们的特工在那里工作时生产率提高的报告。"
	capture_cyphers_reverse_engineer_outcome:0 "我们的特工成功的获取了敌马密码机原型。尽管那不如军用版本强大，但也足以使我们对他们的行动进行更深入的了解。"
	bruneval_raid_outcome_tt:0 "我们将试图获取敌马雷达的关键技术，以帮助我们在这方面的研究。"
	coordinated_strike_scout_target_outcome:0 "该小队仅在攻击开始前几个小时就提供了关于敌马总部和其他重要地点的准确信息。"
	coordinated_strike_sabotage_communications_desc:0 "我们小分队将在关键的前几个小时切断电话线，伏击通讯员，以中断敌马的通信。"
	coordinated_strike_sabotage_communications_outcome:0 "我们的小队成功地中断了敌马的通讯，使他们对我们的进攻反应迟缓。"
	coordinated_strike_direct_units_outcome:0 "我们的小分队非常成功地指挥了我们的部队，从而对敌马造成更多的伤害。"
	coordinated_strike_occupy_bridges_desc:0 "我们的队伍将确保该地区的桥梁，以阻止敌马的破坏，并迎接可能的敌马反击。"
	coordinated_strike_tt:0 "我们将会通过一次毁灭性的突袭对§Y[From.GetNameDef]§!宣战。一旦启动，目标区域内所有准备好的空袭港口和战略轰炸任务将执行多次，而不被敌马防空所拦截。"
	exfiltration_submarine_pickup_outcome_fail:0 "§R潜艇在指定地点等待了数个小时，但并未获得任何我们的队伍已经准备好撤离的消息。船员们报告说，那段时间沿岸敌马的巡逻明显密集了起来。§!"
	organise_cells_outcome:0 "几只革命分队已经组织起来并开始在敌马后方展开活动。"
	operation_warsaw_uprising_desc:0 "勇敢的波兰抵抗战士渴望把华沙从敌马手中解放出来。只要一个信号，波兰就会再次复活!"
	NAVAL_MISSION_NAME_PATROL_DESC:0 "命令舰艇在指定海域巡逻。\n\n一支舰队只能同时在一片海域巡逻\n特遣舰队将在巡逻海域试图找出敌舰队，雷达和制空优势将会帮助更快锁定敌马。\n\n注意敌马可能会抢先一步发现我方舰队并与其交战。"
	NAVAL_MISSION_NAME_SEARCH_AND_DESTROY_DESC:0 "命令特遣舰队在指定海域主动搜索与敌马交战。"
	NAVAL_MISSION_NAME_CONVOY_ESCORT_DESC:0 "命令特遣舰队在指定海域护卫运输船以对抗敌马的袭击。"
	SHIP_ENGAGEMENT_BUTTON_FIRE_AT_WILL_DESC:0 "特遣舰队总是与敌马交战。穿过已经发现敌马或正在交战的省份将使特遣舰队进入战斗。"
	SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE_DESC:0 "特遣舰队将避免与敌马交战，这样就可以穿越正在有敌马存在或是正在发生战斗的省份。\n除非...我们被发现了而且敌马率先开火。"
	NAVAL_FORMATION_SPREAD_DESC:0 "这支舰队阵型展开的程度。一支展开更广的舰队能覆盖更大的区域，便于发现敌马，但在需要进行更大的战斗时会花费更多的时间来集中。展开程度主要受到你选择的任务的影响。"
	PROVINCE_UNIT_ATTACK_FROM_NEUTRAL:0 "§R军队不能从中立国攻击敌马。§!"
	PROVINCE_UNIT_SAFE_STRATEGIC_REDEPLOYMENT:0 "军队§R不能§!在战转模式下移动到敌马领土。"
	NAVY_FORMATION_SPREAD_DESC:0 "阵型展开度是舰队在任务区域的分散程度。舰队越分散，发现敌马的机会越高，但同时进入战斗的战舰越少。"
	NAVAL_MISSION_NAME_MINES_PLANTING_DESC:0 "命令特遣舰队在指定海域布置水雷。敌马会受到的最大潜在惩罚是："
	SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_1_DESC:0 "特遣舰队绝不会试图与已发现的敌马交战。§H巡逻舰船§!会继续执行其当前的目标，而§H打击舰队§!会留在其基地。"
	SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_2_DESC:0 "特遣舰队在与敌马交战时会非常谨慎，且会与弱小得多的舰队交战。"
	SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_3_DESC:0 "特遣舰队与敌马交战时会承担较高风险，且会与实力相当的舰队交战。"
	SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_4_DESC:0 "特遣舰队与敌马交战时会承担非常高的风险，且会与实力相当的舰队交战。"
	SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_5_DESC:0 "特遣舰队一旦发现敌马就会与之交战。"
	SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_GENERAL_DESC:0 "--------------\n§G点击§!或§G右键点击§!切换不同的侵略性设置。更高的侵略性设置会使你的特遣舰队与更强的敌马交战。"
	NAVAL_SPOTTING_LEVEL_LOW_DESC:0 "我们发现了敌马，并粗略地估计了他们的兵力。"
	NAVAL_SPOTTING_LEVEL_MEDIUM_DESC:0 "我们发现了敌马，并清楚地估计了他们的兵力。"
	NAVAL_SPOTTING_LEVEL_DETAILED_UNITS_DESC:0 "我们认清了敌马，并能准确估计他们的兵力。"
	NAVAL_SPOTTING_SEARCHED_BY:0 "敌马正在被$NAME|H$定位。"
	NAVAL_MINES_IN_REGION_BY_ENEMIES:0 "我国的§R敌马§!已布置$COUNT|R0$颗水雷，击伤了 $COUNT_DAMAGED|R0$ 艘，并击沉了 $COUNT_SUNK|R0$ 艘舰船。"
	NAVAL_MINES_PENALTIES_FROM_ENEMY:0 "§H敌马的水雷带来的惩罚：§!"
	NAVAL_ACCIDENTS_MINES:0 "因§H敌马的水雷§!导致的事故：$NUM$"
	NAVAL_ACCIDENTS_ENEMY:0 "因§H水雷§!导致敌马的事故：$NUM$"
	SHIP_REFIT_CONFIRM_DESCRIPTION:0 "§H将选中的舰艇（$COUNT$）改装为$VARIANT_NAME|H$设计。§!\n\n这些船将会回到最近的§H海军基地§!并且在完成之前无法做任何事情。如果分配了最大需求的§H海军船坞§!的话，改装将于$DAYS|H$日后完成。\n\n所在的§H海军基地§!如果被轰炸，改装进度会被减少。如果被占领，则舰艇会被敌马捕获。\n\n你确定要进行改装？"
	NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION_DESC:0 "这支特遣舰队发现潜在的敌马的速度会很慢。请考虑为其添加拥有§Y雷达§!或者§Y飞机弹射器§!的舰艇。"
	NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY_DESC:0 "这支特遣舰队可见度过高，太容易被敌马发现而被攻击或回避。请考虑使用更小更轻的低水面可见度舰艇。"
	NAVAL_STRIKE_FORCE_STATUS_NOT_ENOUGH_INTEL:0 "未知敌马强度"
	SUPPLYMODE_TOOLTIP_DISCONNECTED_DESC:0 "可能因为没有有效补给线路或者补给线路的一部分是最近新从敌马手中获得的。"
	RAILWAY_IN_COOLDOWN:0 "§R这条线路上的部分铁路段最近被敌马占领过，所以需要先进行转化才能运送补给。\n\n剩余天数：$DAYS$§!"
	recon_desc:0 "在主力行进前派出小股斥候以获得敌马位置和数目的情报。"
	skirmisher_desc:0 "§L这位指挥官精通于使用侦查攻击来窥探敌军虚实并损耗敌马。§!"
	has_flanked:0 "正在侧翼包抄敌马或是被敌马侧翼包抄"
	inshore_fighter_desc:0 "§L此马是在近海地区作战的专家，他深谙如何躲藏在岛屿之后和峡湾之中，并对敌马倾泻火力打击。§!"
	gentlemanly_desc:0 "§L这位军官无论是对自己的下属还是敌马都一视同仁地报以尊重。§!"
	destroyer_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌马交火的机会。"
	ENG_light_cruiser_1_desc:0 "C级轻巡洋舰是第一次世界大战期间为适应北海的恶劣条件所建造的。它们被证明是坚固耐用的，尽管其船体很小而且很狭窄，但它的武器还是令马满意的。因为它携带有6英寸火炮来打击敌水面目标，并装备有重型鱼雷来击沉敌马的护航船只。它们被广泛的应用于第一次世界大战中，并参与了很多行动。"
	ENG_heavy_cruiser_3_desc:0 "海军上将级重巡洋舰（不要与海军上将级巡洋舰混淆）是皇家海军最后一次尝试建造装备有8英寸舰炮的巡洋舰。设计研究开始于1938年，终止于1941年。期间有各种各样的建议，最后的建议是装备新的三联装8英寸炮塔，重型的防空武器，厚重的装甲以及维持良好的航行速度。由于缺乏相应的敌马和这些船体导致的成本，使重心转变为了建设更多的轻巡洋舰。"
	ENG_heavy_cruiser_4_desc:0 "这些设计是由温斯顿·丘吉尔爵士于海军部所提出的，为在二战的早期阶段应对德国的德意志兰级战列巡洋舰。这些船只装备有9.2英寸舰炮，重型防空武器和强大的装甲。它们是为了有效地打击敌马的主力舰。这些设计最终由于高昂的成本和对新型重巡洋舰需求的缺乏而取消。"
	ENG_SH_battleship_2_desc:0 "狮II级战列舰的设计来自于在1944年对早期狮级战列舰的一个改进版本。由于汲取了战时的经验教训，这种设计变得越来越庞大与沉重。如果该舰完成了，它将会配备三或四个最新型的16英寸火炮，厚钢板装甲保护船只抵御从任何方向甚至空中敌马的进攻。但由于需要庞大的成本来建设这些船只，以及对航空母舰需求量的上升，导致该项目最终被放弃。"
	SOV_heavy_cruiser_3_desc:0 "22工程级重巡于二十世纪三十年代中期设计用于对抗邻国的相似舰船。它的设计需要大型排水量在15,500至17,000吨之间的船体。它们装备了4台3重240毫米口径的加农炮用以击退敌对巡洋舰，重型对空武器用以自卫和一支大型侦察机部队用以搜寻目标。它们的主要任务是搜寻敌马军队和护舰队的狩猎。由于该舰船费用以及资源分配用来满足其他需求，这个舰船计划被迫取消。"
	AST_heavy_cruiser_3_desc:0 "海军上将级重巡洋舰（不要与海军上将级巡洋舰混淆）是皇家海军最后一次尝试建造装备有8英寸舰炮的巡洋舰。设计研究开始于1938年，终止于1941年。期间有各种各样的建议，最后的建议是装备新的三联装8英寸炮塔，重型的防空武器，厚重的装甲以及维持良好的航行速度。由于缺乏相应的敌马和这些船体导致的成本，使重心转变为了建设更多的轻巡洋舰。"
	AST_heavy_cruiser_4_desc:0 "这些设计是由温斯顿·丘吉尔爵士于海军部所提出的，为在二战的早期阶段应对德国的德意志兰级战列巡洋舰。这些船只装备有9.2英寸舰炮，重型防空武器和强大的装甲。它们是为了有效地打击敌马的主力舰。这些设计最终由于高昂的成本和对新型重巡洋舰需求的缺乏而取消。"
	AST_SH_battleship_2_desc:0 "狮II级战列舰的设计来自于在1944年对早期狮级战列舰的一个改进版本。由于汲取了战时的经验教训，这种设计变得越来越庞大与沉重。如果该舰完成了，它将会配备三或四个最新型的16英寸火炮，厚钢板装甲保护船只抵御从任何方向甚至空中敌马的进攻。但由于需要庞大的成本来建设这些船只，以及对航空母舰需求量的上升，导致该项目最终被放弃。"
