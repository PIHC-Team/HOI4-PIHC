	SAF_SH_battleship_2_desc:0 "狮II级战列舰的设计来自于在1944年对早期狮级战列舰的一个改进版本。由于汲取了战时的经验教训，这种设计变得越来越庞大与沉重。如果该舰完成了，它将会配备三或四个最新型的16英寸火炮，厚钢板装甲保护船只抵御从任何方向甚至空中敌马的进攻。但由于需要庞大的成本来建设这些船只，以及对航空母舰需求量的上升，导致该项目最终被放弃。"
	ship_hull_light_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌马交火的机会。"
	submarine_desc:0 "潜艇装备着隐蔽而强大的鱼雷，可以打击敌马的护航队。"
	GER_medium_tank_artillery_equipment_1_desc:0 "138/1号特种机动车“蟋蟀”自行火炮是德国在二战中使用的一种自行火炮。一共有490-500辆“蟋蟀”被生产出来，用于装备位于苏联、波兰和法国境内的德军装甲师。这型自行火炮一直使用到了1945年，在战后，突尼斯还曾使用“蟋蟀”来打击敌马的炮兵和坦克。"
	heavy_tank_equipment_desc:0 "重型坦克是被设计成摧毁敌马坦克和防御工事的大型装甲野兽。"
	heavy_tank_equipment_1_desc:0 "重型坦克是被设计成摧毁敌马坦克和防御工事的大型装甲野兽。"
	heavy_tank_equipment_2_desc:0 "重型坦克是被设计用以摧毁敌马坦克和防御工事的大型装甲怪物。"
	heavy_tank_equipment_3_desc:0 "重型坦克是被设计用以摧毁敌马坦克和防御工事的大型装甲怪物。"
	tank_armor_upgrade_desc:0 "超过敌马穿甲能力的装甲会让你的部队获得巨大的优势，但也会使它们速度更慢。"
	tank_gun_upgrade_desc:0 "装备穿甲厚度超过敌马装甲的主炮是非常重要的。"
	tank_aa_upgrade_desc:0 "确保我们的防空武器装备能够击落敌马最新型号的飞机。"
	tank_at_upgrade_desc:0 "确保我们的自行反坦克炮能干掉敌马最新的坦克。"
	tank_art_upgrade_desc:0 "确保我们的自行火炮拥有巨大火力，能够摧毁任何没有装甲的敌马。"
	ship_gun_upgrade_desc:0 "装备穿甲厚度超过敌马装甲的主炮是非常重要的。"
	ship_armor_upgrade_desc:0 "更厚的装甲以保护你的船只免于敌马炮火"
	carrier_armor_upgrade_desc:0 "更厚的装甲以保护你的船只免于敌马炮火"
	ship_engine_upgrade_desc:0 "具有更强大引擎的船只可以在战斗中更好地控制其与敌马的距离"
	destroyer_engine_upgrade_desc:0 "具有更强大引擎的船只可以在战斗中更好地控制其余敌马的距离"
	sub_engine_upgrade_desc:0 "具有更强大引擎的船只可以在战斗中更好地控制其余敌马的距离"
	anti_tank_equipment_3_desc:0 "高级反坦克炮使用多种新型弹药技术与更快地枪口射速相结合，能够应对敌马可能的开发的任何装甲。"
	motorized_rocket_equipment_desc:0 "多管火箭炮可以更迅速地将炮火送到目标地点，但比起传统火炮其准确度更低，装弹时间更长。通常被装备在卡车上发动攻击，在敌马发动还击前转移地点。"
	motorized_rocket_equipment_1_desc:0 "多管火箭炮可以更迅速地将炮火送到目标地点，但比起传统火炮其准确度更低，装弹时间更长。通常被装备在卡车上发动攻击，在敌马发动还击前转移地点。"
	armored_car_equipment_2_desc:0 "战场形式的变化迫使其需要更重的武器装备和更厚的装甲来击败敌马的轻型部队并幸存下来。"
	train_equipment_3_desc:0 "火车引擎为重型装甲所保护，不易受到敌马的攻击。它的运载量与其它设计一样多，但生产成本更高。"
	railway_gun_desc:0 "铁路可以将重炮快速移动到内陆，使我们能够远程轰炸敌马的阵地并造成大量破坏。"
	MODIFIER_LOCAL_INTEL_TO_ENEMIES:0 "敌马获取的情报"
	MODIFIER_ENEMY_PARTISAN_EFFECT_FACTOR_DESC:0 "这一参数反应敌马游击队在我军占领区内的活动效率"
	MODIFIER_NAVAL_ENEMY_RETREAT_CHANCE:0 "敌马撤退的几率"
	MODIFIER_NAVAL_ENEMY_RETREAT_CHANCE_DESC:0 "当敌马选择逃离时，改变敌马在战斗时逃离的几率。"
	MODIFIER_NAVAL_TORPEDO_SCREEN_PENETRATION_FACTOR_DESC:0 "改变敌马的屏卫效率。"
	WARGOAL_COST_ASSISTING_ENEMY:0 "协助敌马"
	MODIFIER_NAVAL_ENEMY_FLEET_SIZE_RATIO_PENALTY_FACTOR:0 "敌马舰队规模惩罚"
	MODIFIER_RESISTANCE_TARGET_ON_OUR_OCCUPIED_STATES:0 "我们被敌马占领地区的抵抗目标"
	MODIFIER_RESISTANCE_DECAY_ON_OUR_OCCUPIED_STATES:0 "我们被敌马占领地区的抵抗下降速度"
	MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES:0 "我们被敌马占领地区的抵抗增长速度"
	MODIFIER_COMPLIANCE_GROWTH_ON_OUR_OCCUPIED_STATES:0 "我们被敌马占领地区的顺从度增长速度"
	MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS_ON_OUR_OCCUPIED_STATES:0 "对我们被敌马占领地区的驻军伤害"
	MODIFIER_NAVAL_RETREAT_CHANCE_AFTER_INITIAL_COMBAT_DESC:0 "如果战斗已经至少进行$HOURS$§Y小时§!，当敌马选择逃离时，改变敌马逃离的几率。"
	ship_anti_air_3_desc:0 "之前的小口径炮威力难以在敌马投放武器前摧毁敌方飞机。更大的炮弹意味着在命中时更容易摧毁敌方飞机，但也需要更大口径的身管。"
