l_english:
	fascism:0 "Nationalism"
	fascism_noun:0 "Nationalism"
	fascism_drift:0 "Nationalism drift"
	fascism_acceptance:0 "Nationalism acceptance"
	fascism_wiki_tooltip:0 "The concept of the nation has never been so important in the history of Equestria; while the issue of species has been around for a long time in Equestria. As the world situation spirals into chaos, uniting under a shared concept of a nation or a species, some ponies or creatures can often erupt with unprecedented power.\nHowever, most of the time this power is not used for constructive affairs, leading to the birth of many extreme ideologies and systems. Maintaining harmony is difficult, while falling into darkness is extremely easy: once nationalism is born, the raging fire it brings will not stop, and once you taste the sweetness of one marshmallow, you can’t resist tasting the second one.\n\n'''Ideologies under Nationalism Ethos:'''"
	fascism_republic:0 "Nationalism"
	fascism_republic_desc:0 "Nationalism:\nWhat is Equestria? Some believe it represents the entire world, some believe it refers to a continent from Sire’s Hollow in the west to Manehattan in the east, and from a national perspective, the territory ruled by the two sisters’ Equestria Kingdom is usually considered the most rigorous Equestria range. However, after the fall of the Equestria Kingdom, this concept has been challenged: Cozy Glow claims that her Equestria Empire has the legitimate inheritance of the entire Equestria, but her claim is obviously questioned. Defining Equestria has become a problem.\nNationalists point out that all the areas where ponies live are part of Equestria. Even if ponies have disputes over who is the legitimate Equestria, this should not affect the ponies’ national identity: all ponies are part of Equestria, they should all unite and work together to defend the interests of Equestria, which should be above all. Similarly, changelings have also tried to use nationalism to explain the concept of Changelinia, but as the Chrysalis restored a unified Changeling Empire, these nationalists who were suddenly considered “moderate” gradually withdrew from the changeling political stage."
	fascism_democracy:0 "Ochlocracy"
	fascism_democracy_desc:0 "Ochlocracy:\nEven during Pax-Celestia, ponies often quarreled because of their opinions, and sometimes even forced the Harmonist leader Celestia to make concessions. In turbulent times, ochlocracy is often more rampant, to the point of completely alienating a former democratic country. An Ochlocratic system often reach unanimous “democratic” decisions on topics like starting a foreign war or building a temporary (often not) central regime to cope with external threats. Along with the rise of the Ochlocratic regime, the country will often see a rise in nationalism, militarism, racism, and xenophobia. Eventually, under the leadership of a strong figure, it will move towards an extreme ideologies. But sometimes, such a strong leader never appears, because they sometimes become the victims of the Ochlocratic regime and are devoured by it even before they were able to seize power."
	fascism_monarchy:0 "Imperialism"
	fascism_monarchy_desc:0 "Imperialism:\nTraditonal imperialism in Equestria always tie to a imperium and an emperor/empress, but as time goes on, the concept of imperialism has been changed. In the modern Equestria, imperialism is more about the expansion of the country’s territory and the control of other countries under the name of the imperium, without necssarily having a monarch. The imperialist country will use various means to expand its territory, including military conquest, economic control, and cultural influence. The rulers of these countries are often nobles or business tycoons, the ordinary residents of the country will benefit from the expansion of the empire but not much, while the foreign residents will be seen as tools or even slaves.\nHowever, at the same time the special feature of the Equestrian regime is that an empire often relies heavily on the autocratic leader: his/her leadership and magical power often determine the rise and fall of the empire, which in turn means that even modern Equestrian imperialist countries cannot escape the tradition of imperialism. For example, the Storm Empire under the rule of the Storm King is a typical imperialist country, but after the fall of the Storm King, the empire quickly declined. Grubber and some Storm creatures tried to maintain the rule of the empirem but even though they still controlled advanced giant airships and cannons, they no longer had the ability to order the various colonies to bow down."
	fascism_oligarchy:0 "Military Junta"
	fascism_oligarchy_desc:0 "Military Junta:\nRunning military without centralized power by the supreme commander is a very dangerous act: if there are multiple supreme commanders in the military who are not subordinate to each other, then a civil war is likely to break out. Unless —— in the military forming a myriad of warlord factions at the same time, an effective negotiation mechanism is miraculously established. Here, a warlord group controls the country, there may be differences or even small-scale frictions among them, but a common interest hanging over the country binds it together, preventing it from falling into civil war. This common interest is an external war: as long as all forces can still get a share of the spoils in the plunder, they will not easily give up this country.\nIn the history of Equestria, the system of military junta is not common, but in some turbulent times, this system has also appeared in some remote areas of Equestria. At the last moment of the Storm Empire, Grubber and many of the Storm King’s deputies, as well as the former deputy Strife, briefly experienced this system. But as deputies, they were born with weak characters and therefore failed to win anything from external war, eventually leading to the collapse of the Storm Empire. A more stable example is perhaps the changeling country before Queen Chrysalis ever took power, but because this is too ancient, there is no very clear record."
	fascism_tribe:0 "Clan Tribe"
	fascism_tribe_desc:0 "Clan Tribe:\nUnlike normal chiefdom tribes, clan tribes have a stronger focus on bloodlines. Therefore, the leaders of clan tribes are often elders of the family, rather than chiefs elected by the tribe. More importantly, clan tribes have a paranoid fanaticism for the purity of the tribe’s bloodline. They refuse to intermarry, cohabit, or ally with outsiders, and will severely strike against forces that try to intervene in their tribes. United under the leadership of the purest bloodline, clan tribes do not mind conquering and enslaving other tribes, and sometimes even plundering neighboring civilized countries or city-states. In the history of Equestria, there have been clan tribes, but with the progress of the times, most of them have entered the ranks of city-states, republics, and even empires. However, in some uncivilized remote areas, clan tribes still exist."
	fascism_freestate:0 "Xenophobe City-state"
	fascism_freestate_desc:0 "Xenophobe City-state:\nThe affairs of the city-state must be handled exclusively by citizens of the citysate. Outsiders and non-citizens are not allowed to interfere in the affairs of the city-state. If necessary, the city-state should also actively eliminate “potential external threats”. Xenophobe city-states are not uncommon in the history of Equestria. Long before the Three Tribes Covenant, the pegasi, yet to develop into the Pegasi Empire, established a xenophobe city-state in ancient Cloudsdale. As the city-state expanded into a republic, they still maintained severe discrimination against the earth ponies and unicorns, until the Windigo destroyed the Pegasi Empire.\nAlthough today, more and more ponies have realized the importance of harmony among the three tribes, more discrimination and xenophobia still occur in various regions: this is due to the inaction of the Equestria Empire on racial issues, and also due to the conflicts between creatures around the world: changelings, griffons, yaks, dragons and other creatures are not within the traditional framework of the Three Tribes Covenant, which means that xenophobia still has the possibility of resurgence."
	fascism_organization:0 "Authoritarian Corporatism"
	fascism_organization_desc:0 "Authoritarian Corporatism:\nCorporatists believe that different classes can resolve their differences through representative negotiations and together contribute to the great country and nation. If they cannot reach an agreement decently, then we will help them to get decency. Authoritarian corporatists do not mind using violence to control various classes, forcing them to make concessions, reach consensus, and maintain the interests of the country. Similarly, they do not mind using violence against the enemies of the country. In practice, authoritarian corporatism is often mixed with racism: only the class that is able to sit at the negotiating table has the rights, while the foreign species have no possibility of participating in such national-level negotiations."
	fascism_duchy:0 "Governorate"
	fascism_duchy_desc:0 "Governorate:\nGovernorate, usually also known as puppet state, vassal state, satellite state, or even colony, is the most direct political system of a conquered country. In this area, the suzerain empire will control all aspects of politics, economy, culture, etc., and the nominal leader of the region is often appointed by the empire or tightly controlled by the empire. More importantly, the economy and agriculture of this region will be gradually emptied to meet the needs of the suzerain empire, and eventually become a missile base, military factory, or a huge barracks, used to support the suzerain empire’s foreign wars. On the one hoof, the major affairs of the governorate are almost entirely decided by the empire; on the other hoof, the bureaucratic body of the governorate is often the local species residents, to reduce the resistance of the locals.\nThe most typical governorate countries almost always appear in the conquered areas of the Changeling Empire in history. In contrast, other species often only establish a normal suzerain system or a tribute system after winning the war."
	fascism_authoritarianism:0 "Chrysalism"
	fascism_authoritarianism_desc:0 "Chrysalism:\nThe reign of Queen Chrysalis is an undeniable part of the history of the changelings. Her rule is a typical authoritarianism, but different from ordinary authoritarianism: Queen Chrysalis emphasizes the concept of changeling racism. “Changelings Master Race!” Whether during her reign or in exile, her ideology has never changed. Rather than the glory and wealth of leader herself, Queen Chrysalis seems to genuinely believe that her subjects should all become slave masters, with her forever as their leader.\nMany Chrysalists, or authoritarian racists, authoritarian nationalists, admire Queen Chrysalis for her charm and style of rule, but many outsiders do not believe that changelings should be the subject of her slogan. Some cheap imitators may also try to propose slogans such as “Ponies are the only superior race!” or “Pegasi are the greatest!” but these slogans often only enrage the orthodox Chrysalists."
	fascism_totalitarianism:0 "Changelingiaism"
	fascism_totalitarianism_desc:0 "Changelingiaism:\nFor some changelings, even the authoritarian nationalist policies adopted by Queen Chrysalis are too weak: in their eyes the citizens should not be the purpose of the state, but should only be a tool. For the Changelingiaists, the only thing that is higher than everything is the great concept of “Changelinia” itself, which includes neither the land nor the subjects on this land. A pure Changelinia spiritual world cannot tolerate the pollution of material carriers, and all the subjects of the material world should give up everything to pursue the perfection of the great “Changelinia”. For example, the ultimate dream of Queen Chrysalis is to make all changelings become superior citizens and enjoy endless love. But the Changelingiaists believe that this goal is too low-level and insignificant: hunger may affect the support rate of Queen Chrysalis, but for the Changelingiaists, this is just a small problem. The changeling race will become stronger, purer, and closer to the ideal of “Changelinia” under the natural selection of hunger.\nIt must be said that most of the changelings cannot understand the concept of the Changelingiaism. They think this concept is evil, even crazy. However, the Changelingiaists do not care about these evaluations, they do not even care about their own thoughts, they will only continue to pursue their ideals until the last moment."
	fascism_utopia:0 "Perfect War Machine"
	fascism_utopia_desc:0 "Perfect War Machine:\nThe residents here not only cannot hold dissenting opinions against the country, but more importantly, they do not want to. Completely united under the banner of the country and the nation, every citizen spontaneously dedicates everything to the foreign war. Regardless of whether the war is going well or not, they only know that their country is the greatest, their leader is the greatest, and their nation is the greatest. If you try to wake up some of them by accusing this great country of violating individual rights and freedoms, they will only treat you as a madpony.\nThe war will never end, their lives have no contradictions, no pain, no questions, only war, only the pursuit of victory as greedy as a fruit bat for an apple."
	fascism_dystopia:0 "Leviathan"
	fascism_dystopia_desc:0 "Leviathan:\nA lingering haze always shrouds this country: why are we fighting for? No one can remember the reasons for the start of the war, no one can remember the decision makers of the past. Even the current leader has no power to stop this war: no citizen dares to raise even a little doubt about the war that is currently being waged, whether it is a commoner or a marshal. The country is like a huge monster, devouring everything, destroying everything, but no pony knows where this monster is going. All citizens are destined to have only one life goal, to serve the war from the day they were born. The war will never end, their lives have no escape, no endpoint, no meaning, only war, only the pursuit of victory as greedy as a fruit bat for an apple."
	fascism_theocracy:0 "Cult Theocracy"
	fascism_theocracy_desc:0 "Cult Theocracy:\nWhy would some creature choose to worship a devil? This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible. This is because the power of the devil is irresistible."
	fascism_technocracy:0 "Purificationism"
	fascism_technocracy_desc:0 "Purificationism:\nIn the construction and expansion of the national state, racism is often criticized for its violation of the idea of harmony and its cruel behavior. However, when racists gain legitimacy for “purification” through advanced scientific and technological means, they no longer have any scruples. After “rigorous” scientific research, the advantages and disadvantages of various species in Equestria are determined in black and white by experimental data. When biologists tell you that your neighbor is lower than you on the evolutionary tree, when sociologists tell you that eliminating your colleagues can promote social harmony and stability, when epidemiologists tell you that your elderly parents are the source of certain infectious diseases, when some great socerers accuse the disappearance of friendship magic is due to those alien species, most residents will no longer make a sound. Until one day, they found themselves being assessed as “genetic defects to be cleansed” by authoritative medical journals just because their cutie marks contained certain specific elements or their horn length could be divided by an evil number."
	fascism_militarism:0 "Militarism"
	fascism_militarism_desc:0 "Militarism:\nSometimes they come from a long-oppressed and invaded species that over-defends, sometimes they come from an arrogant species that is indifferent to other countries, sometimes they come from a political inertia left by a strong military leader, sometimes they come from the desperate middle class controlled by international debt, sometimes they come from a long-standing martial culture, sometimes they come from the out-of-control emotions in a democratic society, sometimes they come from a military coup orchestrated by minority usurpers. In any case, militarists believe that war can benefit a country and improve their quality of life. Sometimes they will suffer from the condemnation of conscience, sometimes they will try to justify the behavior of their country, and more often they will just celebrate in the tavern after hearing the news of the victory of the war, using alcohol to numb everything. There may be children or parents in their families who have joined the army, and there may be propaganda against the enemy country everywhere in their lives. They only know that the army controls this country. It is their pride, and is also their shackle."
	fascism_dogmatism:0 "Militant Isolationism"
	fascism_dogmatism_desc:0 "Militant Isolationism:\nA militarily isolationist country often comes from the bitter victor of a fierce war. They fear the next war, but they also fear peace at the same time - peace will make them weak. Following the teachings of their ancestors, they choose to arm themselves to the teeth, independent of the world, and be vigilant about everything around them, to prevent the arrival of the next war. Usually, they will also delineate their sphere of influence outside their own territory. If other forces try to touch their protected area, they will soon feel the power of this seemingly peaceful country.\nIn history, the Griffon Kingdom won the Arimaspi War at a great cost of losing their Idol of Boreas. The once great and powerful kingdom fell into a long period of declination and adopted a policy of militant isolationism until the Idol was found by M6. With the Ultimate Battle, the griffons tasted once again the bitterness of war, but this time, they no longer have the ability to restore militant isolationism, perhaps. Will they regret it?"
	fascism_federal:0 "Axis Group"
	fascism_federal_desc:0 "Axis Group:\nMany ponies find it hard to understand why nationalists have a sense of mutual sympathy: obviously the great “nation” or “species”  in their ideologies are completely different, earth ponies, pegasi, unicorns, alicorns, changelings, griffons, dragons, kirins, storm beasts... How can the right-wing forces of these species become friends? However, in a few cases, we will indeed see this happen: when they have a common enemy, or when the bully group finds a common victim.\nFor example, the dragons and yaks, two completely unrelated and warlike species, still maintain traditional friendship, even though they have had many wars in the past. Although the aggressiveness of the dragons and yaks has greatly weakened today, in the past, the Axis Group they formed did cause a lot of trouble for Equestria."
	fascism_spirit:0 "Ferocious Creatures"
	fascism_spirit_desc:0 "Ferocious Creatures:\nSome creatures live in environments far away from civilization all year round. On the one hoof, this avoids conflicts with civilized villages, city-states, or countries, and on the other hoof, it prevents them from communicating with civilized creatures. Whether living alone or in groups, they are averse to external creatures entering their territory. If you want to pass by, then be prepared to leave something behind, a sandwich, a barrel of cider, a cart of apples, or even some body parts."
	fascism_pegasi:0 "Pegasi Supremacy"
	fascism_pegasi_desc:0 "Pegasi Supremacy:\nA pony nationalist may believe that ponies are the only supreme species of Equestria. Lightning Dust agrees with this view to a third, or perhaps less. Even a normal pony who takes pride in his or her pegasus identity could one day found himself or herself expelled from the pegasus race by Lightning Dust: such as those wimps in the Wonderbolts. For Lightning Dust, “pegasi” is not only a species, but also a spirit. Only those pegasi who pursue the purest extremes regardless of everything can become true pegasi. As for those impure pegasi, or those ponies who do not even have wings and cannot fly, Lightning Dust has nothing to say. She is not interested in locking those creatures in concentration camps, but she will not think for a second before knocking them away at the speed of a Sonic Rainboom."
