l_english:
	despotic:0 "Despotism"
	despotic_noun:0 "Despotism"
	despotic_desc:0 "Despotism"
	despotic_drift:0 "Despotic drift"
	despotic_acceptance:0 "Despotic acceptance"
	despotic_wiki_tooltip:0 "In a considerable period of time, the Alicorns were the undisputed rulers of ponies, and those individuals with extraordinary magic were born to be responsible for leading everything. Their rule has also withstood the test of time, maintaining harmony and stability in Equestria and even the world for a considerable period of time — until the entire system collapsed. Even outside of Equestria, individuals with extraordinary abilities often firmly grasp the highest power, some of the wise kings make the country prosperous, and some of the tyrants make disasters and tragedies frequent.\nEven so, whether it is ponies or other creatures, the historical inertia of relying on a strong leader still exists: with a strong leader to lead everypony, ordinary citizens do not have to worry about politics, isn’t this a happy thing for everypony?\nOf course, dissenters do exist, but their voices are always drowned out — even eliminated.\n\n'''Ideologies under Despotism Ethos:'''"
	despotic_republic:0 "Principate"
	despotic_republic_desc:0 "Principate:\nIt turns out that you can be a princess/prince/queen/king/emperor/empress and a supporter of the republic at the same time. All you need is to change your name to: president, princeps, chairpony, prime minister, chancellor, steward, archon, leader... You don’t even need to hold an election to satisfy the public. So this is how liberty dies, with thunderous applause."
	despotic_democracy:0 "Dual System"
	despotic_democracy_desc:0 "Dual System:\nA dual system country has two power structures: a government appointed by the monarch and a parliament elected by the public, with the monarch government having more power. Generally speaking, most constitutional monarchies often limit royal power and grant more power to the parliament. Over time, royal power will be weakened, and actual power will be transferred to the parliament. However, in a dual constitutional monarchy (who often claim to be true constitutional monarchies), the monarch’s power is still quite reserved, and they can exert a great influence on the country’s politics, while the parliament can actually do very little, far from achieving the goal of truly constraining royal power.\nThis abnormal system generally comes from the compromise between democratic forces and despotic forces, such as the Grand Equestria Pony Summit: cities eager for democracy, but they had no objection to the wise rule of Princess Celestia, so they didn’t mind letting the parliament be a decoration. A more typical example comes from the Crystal Empire. Here, the democratic forces have never had the ability to overthrow the royal family. After the defeat of the Crystal Empire, Empress Cozy Glow and Queen Chrysalis forcibly established a council in this country, allowing “foreign forces” to disguise themselves as “democratic forces”. At first, relying on the support of the Equestria Empire and the Changeling Empire, as well as the “Ceasefire”, the council had great power, and the Crystal Empire could almost be said to have become a constitutional monarchy, only colonized. As Flurry Heart grew up, the proportion of royal supporters in the cabinet gradually increased, and the power of the council was gradually weakened... The Crystal Empire began to become a typical representative of a dual system constitutional monarchy."
	despotic_monarchy:0 "Absolute Monarchy"
	despotic_monarchy_desc:0 "Absolute Monarchy:\nAs its name suggests, in absolute monarchy the monarch controls all the powers of the country and has the right to make decisions on all domestic matters. For the central continent and other regions of Equestria, the monarchy can be said to be one of the oldest and most enduring forms of government. For the past thousand years, the vast majority of countries in the world have adopted a monarchy. However, as time goes by, more and more problems exposed by the monarchy. For some species, like ponies, the powerful magic and scarcity of Alicorns naturally become their legitimacy as monarchs, but this scarcity also becomes an unstable factor in the era of power transfer, such as now. And more monarchs of other species come from bloodlines, cultures, institutional traditions, or some inexplicable talents such as being able to perceive ore veins.\nWith the gradual development of technology, in the rapid colonization and industrialization process of Equestria, the original monarchs, due to their scarcity or traditional restrictions, cannot effectively manage these emerging fields in a timely manner, which has led to the incubation of countless local organizations and emerging social classes. In the struggle between these emerging forces and conservative nobles, the power of the monarch is gradually eroded. The traditional monarchy system has encountered great challenges, and whether the monarchies can withstand the test of time has become an increasingly bothering and urgent issue."
	despotic_oligarchy:0 "Oligarchy"
	despotic_oligarchy_desc:0 "Oligarchy:\nThe characteristic of an oligarchic society is that power is highly concentrated in a small number of elites. The reasons for the formation of oligarchs may be wealth, bloodlines, or powerful magic, but they are all high up for various reasons. A few oligarchic countries may be under the guise of democracy, but more simply legalize their power through culture or law. Although the oligarchs may fight among themselves, the ruling oligarchs may fall, but the ones who replace them are often just new oligarchs.\nOligarchic countries may have many forms of expression, but they almost invariably implement similar policies — deliberately creating poverty, forcibly controlling the public, controlling speech and assembly, and even using violence to forcibly suppress all situations that may threaten their rule. In an oligarchic country system, rising is a luxury, and ordinary ones have little hope of getting ahead."
	despotic_tribe:0 "Chiefdom"
	despotic_tribe_desc:0 "Chiefdom:\nChiefdom is a primitive political system that usually only appears in tribal societies. In a chiefdom tribe, the chief is the leader of the tribe, and their power is usually inherited from bloodlines, a few from some primitive beliefs, and even fewer from abdication or drawing lots. Although the despotic power of the chief may not be much different from the leader of a despotic city-state or a principate country, what evil deeds can they do in a primitive tribe?"
	despotic_freestate:0 "Despotic City-state"
	despotic_freestate_desc:0 "Despotic City-state:\nThe mayor of a despotic city-state may not be much different from a leader of a principate country, but the scope of their power sets them apart. Greater power means greater risk: the absolute power obtained in a small city is often more powerful than a country’s leader, but it is also often easier to be overthrown by a small matter. In the era of Twilight Sparkle, Trixie Lulamoon once became the leader of Ponyville - although her rule only lasted for an afternoon. Besides, dictators in city-states are often easily overthrown by external forces: in ancient Anugypt, before Anubis and Cleopatrot’s offspring expanded into an empire, they were a group of despotic city-states; and when these leaders disappeared, their city-states often disappeared with them."
	despotic_organization:0 "Usurpers Group"
	despotic_organization_desc:0 "Usurpers Group:\nPerhaps this country has just been established; perhaps this country is in the midst of disaster and turmoil; perhaps democracy in this country is on the verge of extinction. In any case, a small group of usurpers has just gained power, what is their goal? Is it to establish a new despotic regime, or to promote their ideology, or to seek benefits for the forces behind them? Or do they just want a higher-paying job? In any case, their actions will have a profound impact on the future of this country."
	despotic_duchy:0 "Duchy"
	despotic_duchy_desc:0 "Duchy:\nThe duchy is a new political system that has never appeared in the history of Equestria’s land. This is because in history, whether it is the Three Tribes, the Alicorn Regime, or other species such as the Griffon Kingdom, there is no need to enfeoff a regional lord. After the Ultimate Battle, Empress Cozy Glow gained power, and the Royal Committee of Equestria was unable to control various rebellious regions. This novel “enfeoffment system” was invented by Empress Cozy Glow: they enfeoffed some regions to some loyal dukes/duchesses, allowing them to have absolute power in these regions. The advantage of this system is that, on the one hoof, a duke/duchess can help Empress Cozy Glow suppress rebellions in the region, and can be directly abandoned when necessary, thereby avoiding leaving a bad reputation for Empress Cozy Glow; on the other hoof, if these dukes/duchesses are more likable than Empress Cozy Glow, it will also reduce the resistance of the region. The central government does not need to provide solutions to regional problems, and the region needs to support Empress Cozy Glow. However, the disadvantages of this system are also obvious: if the duke/duchess is unpopular, then that duke/duchess is not very useful; and if the duke/duchess is too popular, once the duke/duchess betrays, the region will fall into chaos and quickly leave the empire. Therefore, Empress Cozy Glow only regards the duchy as a temporary measure, not a long-term political system."
	despotic_authoritarianism:0 "Authoritarianism"
	despotic_authoritarianism_desc:0 "Authoritarianism:\nUnder an authoritarian rule, the leader’s authority was absolute, with little room for dissent or opposition. Compared to Principate or Absolute Monarchy, the power in an authoritarian regime is even more concentrated on the central government and the dictator itself.\nSome may say such system once existed in the Dragon Land, as the former Dragon Lord Torch managed to held his absolute power for hundreds of years. However, as Ember took the throne, the Dragon Land began to move towards a more mild system, reverting back to a normal monarchy system as it was before Torch’s reign."
	despotic_totalitarianism:0 "Totalitarianism"
	despotic_totalitarianism_desc:0 "Totalitarianism:\nTotalitarianism is an upgraded version of authoritarianism, where the state’s control over citizens can penetrate into every corner of life. The government usually controls citizens’ thoughts through propaganda, education, religion, culture, etc., and establishes individual worship of the leader.\nHowever, pure totalitarianism is very rare in Equestria, not because Equestria lacks usurpers and dictators, but because dictators often do not settle for being an ordinary tyrant after entering totalitarianism: either they will become a conqueror, expanding their country and promoting their ideology worldwide; or they will pursue absolute strength to secure throne, eventually find the secret of transcendence and even become a deity."
	despotic_utopia:0 "Ideal State"
	despotic_utopia_desc:0 "Ideal State:\nHere, individual worship of the leader is no longer false propaganda, and the wise and gentle leader has done everything he promised and promoted. Such an ideal state previously only existed in the imagination of some monarchists, as even the most peaceful and prosperous Equestria under Princess Celestia’s rule, has not yet reached the standard of an ideal state. However, if you deny the existence of an ideal state just because of this, you are making a claim too hastily. If there is anything to learn from Equestria’s history, it is that: everything is possible. Every leader, whether an usurper or a selfless saint, has the possibility to realize his dream."
	despotic_dystopia:0 "Dystopia"
	despotic_dystopia_desc:0 "Dystopia:\nMany freedom fighters subconsciously mistakenly believe that a despotic regime serves the interests of a small group of interests at the expense of the most. But at least for a dystopia, this is a complete misunderstanding. Because here, a despotic regime can serve the interests of nopony at the expense of all. The continuation of power itself has overwhelmed everything, whether it is the public, grassroots officials, senior officials, or the dictator, they are all irrelevant and can be discarded at any time like a pawn. We are all chained by the same chain, and both the upper and lower classes are equally exhausted."
	despotic_theocracy:0 "Theocracy"
	despotic_theocracy_desc:0 "Theocracy:\nIn a theocratic country, the leader is either a real deity, a self-proclaimed representative of a deity, or a commoner who is inexplicably placed on the altar of a god. Religious beliefs are not a new concept in the world of Equestria, from the Thestrals that worship the Nightmare Moon, to the Shadow Disciples following King Sombra, to the M6 followers who erupted internal disputes just because of a few friendship journals... Ponies’ brains are so simple and naive that sometimes forgetting all logic and arguments and simply following an ideal leader or deity in their hearts may be the best choice for them. If thinking is too difficult, then why not give up thinking and believe in the blessing of the deity and the arrangement of fate?"
	despotic_technocracy:0 "Technocracy"
	despotic_technocracy_desc:0 "Technocracy:\nMagic is disappearing, and the Windigo is devouring our homeland that we rely on to survive. Whether it is the liberals, the despots, the equatists, or any other -ists, they cannot overcome this difficulty. The harmonists claimed that “friendship is magic”, but it is obvious that they have not been able to fulfill their mission. Ideological differences can no longer solve real-world problems, and to make up for the decline in productivity caused by the loss of magic, the only choice for ordinary ponies or muggle creatures is to turn to technology.\nIn this situation, technocracy becomes the only choice: only those leaders and pioneers who truly understand the future can lead us out of the predicament. Fair distribution of power and interests? It’s just a farce, only steam engines and generators are the real saviors of ponies."
	despotic_militarism:0 "Stratocracy"
	despotic_militarism_desc:0 "Stratocracy:\nAs the ponies and changelings look back at their country falling apart, some blame the former monarchs who did nothing, some blame the usurpers who rose in the war, and some blame the silent public. However, some ponies believe: this must be because we do not pay enough attention to national defense. Even before the Ultimate Battle, the Royal Guard of Equestria was already an empty shell; the metamorphosed Changeling Kingdom also lost almost all of their military power; the Crystal Empire was trapped in its dream of peace for too long; the griffons also lacked warriors and martial spirit... So, all these mistakes come from the absence of the military, only a strong military can end everything and defend the millennium of peace.\nThe problem is, just like apple pie can be eaten as well as thrown at your enemy, who should the ultimate controller of the military be is an important issue. For a military government, this question no longer needs to be answered. “Government by the soldiers, of the soldiers, for soldiers”, this is the entire philosophy of a military government."
	despotic_dogmatism:0 "Civilian Dictatorship"
	despotic_dogmatism_desc:0 "Civilian Dictatorship:\nIt must be admitted that all the creatures, regardless of which country or which species they come from, have been disgusted with chaos and strife. Since the Ultimate Battle, the riots seem to have never stopped. Law and order, this is our only hope.\nBut who will be the enforcer of order? Ponies do not want to see military dictators, nor do they want to see religious figures or usurpers, they only want to see a mediocre government that can maintain law and order. For this reason, they are willing to embrace bureaucracy: only those who can strictly abide by the rules can become leaders. No matter who is the maker of the rules, the system that has been running for thousands of years will never go wrong, right? Mediocre, bloated, inefficient, but stable, stable, stable, and last but not least, stable."
	despotic_federal:0 "Monarchy Confederation"
	despotic_federal_desc:0 "Monarchy Confederation:\nOut of racial or historical reasons, some countries may have multiple monarchs, such as Princess Celestia who rules the day and Princess Luna who rules the night; sometimes multiple countries may have the same monarch, such as Equestria and the Thestrals during the Nightmare Moon period; sometimes a monarchial country may form an alliance with other countries, such as the rule of Queen Novo of Seaquestria who also reigns over Hippogriffia. In short, a monarchy confederation formed in different forms is one of the more common political systems in Equestria’s history. However, such a federation often does not exist stably for a long time. When Princess Luna were sent to the moon, Princess Celestia took over the entire Equestria, and the Thestrals also became independent; and the alternation of rule between Hippogriffia and Seaquestria in the confederation also made them not always live in a monarchy."
	despotic_equatism:0 "Cadencism"
	despotic_equatism_desc:0 "Cadencism:\nAs the monarch responsible for “love”, Cadence advocates the concept of equality, believing that every Crystal Empire pony should receive equal love. Whether during her life in Equestria, her reign in the Crystal Empire, or her current retirement, Princess Cadence is warmly welcomed by the ponies. Even though Empress Cozy Glow has already classified Princess Cadence and Shining Armor as “war criminals of the Crystal Empire”, foreign forces still dare not openly defame Princess Cadence within the Crystal Empire. It is Princess Cadence’s spirit of universal love that has won her the loyal support of the Crystal Empire ponies, and has allowed her and Shining Armor to avoid the fate of being executed by the Equestria and Changeling Empires."
	despotic_harmonicism:0 "Enlightened Despotism"
	despotic_harmonicism_desc:0 "Enlightened Despotism:\nBenevolent despotism argues that if a leader can bring prosperity and harmony to the country, then his/her despotic rule is justified. Many supporters of Princess Celestia regard her as a model of enlightened monarchs, but using her as a defense of the monarchy has not gained market: Celestiaists hope to draw a clear line with these enlightened monarchists. One of their main disagreements is: for Celestiaists, the Harmonic ideology is the foundation of Equestria, and the reason why Princess Celestia is an excellent leader is because she follows the Harmonic ideology; while for enlightened monarchists, the Harmonic ideology is just a tool, as long as it can bring harmony and prosperity, it can be changed at will, and it is because Princess Celestia is an excellent leader that ponies will praise her Harmonic ideology. This disagreement did not erupt under Princess Celestia’s rule, but if you ask whether other monarchs can be considered “enlightened” or “benevolent”, even the most orthodox enlightened monarchists will immediately burst into a fierce argument."
	despotic_neoharmonicism:0 "Neo-Harmonism"
	despotic_neoharmonicism_desc:0 "Neo-Harmonism:\nAlthough Cozy Glow has gained control of Equestria, she still does not have the support of the public. The way she gained power is completely illegal, and her actions are also “slightly different” from traditional Harmonism. Therefore, from nobles to beggars, every pony is just superficially obedient, having their own thoughts behind their backs, mocking the so-called “Empress of the Empire”.\nTo change all this, it is necessary to start from tossing the ponies’ thoughts. Every pony’s mind is more or less contaminated by the remnants of the former dynasty, and their outdated Harmonic ideology interferes with the normal governance of the empire and provides legal grounds for rebels. Therefore, Cozy Glow has formulated her own “Neo-Harmonism” focusing on individual worshipping. As long as you respect the Empress and assume the Empress is absolutely correct, then the specific definition of harmony is no longer important. Empress Cozy Glow once said that the six elements of harmony are five turtlenecks and a cheese grater, then she is right. Although this idea is still not accepted by most ponies, Cozy Glow has ordered the rewriting of textbooks, the control of publishing and gatherings, and continuous propaganda nationwide. She is trying to erase all traces of the old Harmonic ideology. As long as the policy continues, in time, the five turtlenecks and a cheese grater will be deeply imprinted in the minds of every generation of ponies in the name of the Empress."
