	OPERATIVE_MISSION_DIPLOMATIC_PRESSURE_DESC:0 "§L影响由AI控制的国家更亲近你的阵营并签订互不侵犯条约。玩家的国家在加入其它阵营时将受到更严苛的条件限制。§!\n§H每日外交施压：$BASE_ACCEPTANCE$§!\n 基础：$BASE_ACCEPTANCE|G$\n§H每日不和谐度要求：-$BASE_TENSION|%$§!\n 基础：§G-§!$BASE_TENSION|%G$"
