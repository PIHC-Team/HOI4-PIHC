	RULE_ALLOW_WARGOALS_FREE_25_DESC:0 "在不和谐度低于25%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于意识形态规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_WARGOALS_FREE_50_DESC:0 "在不和谐度低于50%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于意识形态规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_WARGOALS_FREE_75_DESC:0 "在不和谐度低于75%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于意识形态规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_WARGOALS_FREE_100_DESC:0 "在不和谐度低于100%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于意识形态规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_LEND_LEASE_FREE_DESC:0 "无论不和谐度如何，各国都可以给任意国家提供租借法案。"
