	tut_12_text_1:0 "埃塞俄比亚投降了！你赢了！\n你可以通过§Y和平谈判§!来下达要求。我们建议你选择§Y夺取所有地区§!。\n\n每个要求将会或多或少的增加£world_tension_icon §Y不和谐度§!。§Y不和谐度§!越高，你离一场世界大战就越近。\n\n一些国家的特定§Y外交选项§!会被封锁，直到不和谐度增长到一定数值。越多下方的提示来了解更多。"
	BUTTON_WIKI_WORLD_TENSION:0 "在HOI4维基上阅读关于§H不和谐度§!的条目！"
	BUTTON_HINT_WORLD_TENSION:0 "阅读§H不和谐度§!上的提示"
	HINT_WORLD_TENSION:0 "提示：不和谐度"
	HINT_WORLD_TENSION_TEXT:0 "这是£world_tension_icon  §Y不和谐度§!界面。所有引起不和谐度变化的事件都会在这里列出。\n\n不和谐度是一个用来描述这场游戏热度的度量。一些国家的§Y外交行动§!在不和谐度没有到达一定程度前无法执行。\n\n一般而言，轴心国家希望不和谐度保持低点来阻止民主国家干涉，而民主国家则希望不和谐度升高以便于干涉。\n\n宣战，正当化宣称，吞并领土，完成某些§Y国策§!都能升高不和谐度。\n\n不和谐度越高，你离一场世界大战就越近。"
	HINT_WORLD_TENSION_TEXT_2:0 "£world_tension_icon  §Y不和谐度§!是一个用来描述这场游戏热度的度量。一些国家的§Y外交行动§!在不和谐度没有到达一定程度前无法执行。\n\n一般而言，法西斯和共产主义势力希望不和谐度保持低点来阻止民主国家干涉，而民主国家则希望不和谐度升高以便于干涉。\n\n宣战，正当化宣称，吞并领土，完成某些§Y国策§!都能升高不和谐度。\n\n不和谐度越高，你离一场世界大战就越近。"
