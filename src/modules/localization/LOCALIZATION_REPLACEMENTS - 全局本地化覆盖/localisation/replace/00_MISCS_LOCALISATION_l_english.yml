l_english:
	PIHC_WS_OPEN_TT:0 "Open the §YWelcome Screen§! for §Y[Root.GetName]§!"
	PIHC_NAME:0 "The Pony In The High Castle"
	PIHC_DESC:0 "§g“We once had magic, and friendship, but now, we don’t have either.”§!\n\nWhat if Cozy Glow, Queen Chrysalis and Lord Tirek had won the final battle... What kind of world would it be?\nIn this alternate timeline scenario, the events diverged from MLP Season 9 Episode 24..."
	PIHC_WS_HEADER:0 "The Pony In The High Castle"
	PIHC_WS_TAB_1:0 "Background"
	PIHC_WS_TAB_1_HEADER:0 "The Pony In The High Castle World"
	PIHC_WS_TAB_1_TXT:0 "§g“We once had magic, and friendship, but now, we don’t have either.”§!\n\nWhat if Cozy Glow, Queen Chrysalis and Lord Tirek had won the final battle... What kind of world would it be?\nIn this alternate timeline scenario, the events diverged from MLP Season 9 Episode 24, where without help from ponies and other races from across Equestria, the M6 were defeated in the Ultimate Battle that determined the fate of Equestria. In the year 999, the “Big Three” villain alliance of Cozy Glow, Queen Chrysalis and Lord Tirek achieved victory in the final battle.\nIn the year 1001, the “Big Three” signed a treaty in Canterlot to divide Equestria:\nCozy Glow became the legitimate ruler of Equestria, self-proclaimed as the “Empress of Friendship”, using the absolute power of the alicorn and her seductive rhetoric to establish a loose feudal state on the ruins of Equestria.\nAfter conquering the Changeling Empire by force, Queen Chrysalis cleared all opposition and restored her unquestionable, supreme leadership, turning the entire Changeling race back to their original unhatched state.\nLord Tirek was not obsessed with power, but more obsessed with strength - he used the Grogar’s Bell to take away half of Equestria’s magic, returned to his homeland of the centaurs, and enslaved all the creatures around his homeland.\nThe M6 and the two former Princesses were imprisoned in Tartarus - the same place that once held Tirek and Cozy. Different now, the M6 and princesses were separately imprisoned.\nWhile ponies like Starlight Glimmer or Discord lost their magic, they escaped the chaos of the final battle and united disgruntled ponies across Equestria to organize resistance forces; however, most creatures had accepted their failure and their tragic fate..."
	PIHC_WS_TAB_2:0 "Country Introduction ([Root.GetNameWithFlag])"
	PIHC_WS_TAB_2_HEADER:0 "[Root.GetNameWithFlag]"
	PIHC_WS_TAB_2_TXT:0 "[Root.GetCountryIntro]"
	PIHC_WS_TAB_3:0 "Mod Information"
	PIHC_WS_TAB_3_HEADER:0 "The Pony In The High Castle Mod Introduction"
	PIHC_WS_TAB_3_TXT:0 "1. The PIHC mod is story-oriented, thus the game only allows diplomacy through national focus, events, and decisions, and does not allow war goals and some alliance behaviors. Story-oriented diplomacy through national focus is an important part of the game. However, players can choose to declare war through the use of the console or the war criminal decision.\n2. The PIHC mod has completely redone the weapon technology tree. In the mod, the development of technology is very rapid (two or three years of technology can produce a huge difference), and it is also slow (the scientific research speed of all countries has been slowed down), which means that scientific research is more efficient through events, national focus, and decisions.\n3. The mod mainly focuses on the central continent of Equestria (Equestria), followed by the continent of the Changelings (Changelinia), with less focus on the continent of the Griffons (Griffonica) and the continent of the Kirins (Kirinthal).\n4. The PIHC mod has made minor adjustments to the price of buildings; the types, distribution, and usage of resources have been greatly adjusted compared to the base game of HoI4. Players can learn about the usage of various resources by viewing the description of the resources.\n5. Integrated landlord mod: at the top right of the state view, you can expand the menu, pay political power to obtain a core of a state. It is not allowed to create claims.\n6. On the right side of the screen, you can open the country’s inventory, which may contain items, equipment, story texts, key props, etc. that can be used."
	PIHC_WS_TAB_4:0 "Version Information"
	PIHC_WS_TAB_4_HEADER:0 "Current Version §Yv0.2.3§!"
	PIHC_WS_TAB_4_TXT:0 "0. The current version is a test version, and there may be a large number of bugs and incomplete content. Feedback is welcome. The mod will be actively updated.\n1. The version development process is tested on MackBook Pro M1 macOS Monterey, using the latest game base. In other game environments, incompatibility may occur.\n2. Remember to check the balance of power."
