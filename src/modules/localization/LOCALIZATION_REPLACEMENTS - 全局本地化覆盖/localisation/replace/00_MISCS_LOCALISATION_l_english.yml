	PIHC_BOOKMARK_ALT_C23:0 "§RWarning§!\n\nThis country is in the development stage and currently has no meaningful playable content. We strongly recommend that you play other more complete factions for a better gaming experience. As for this region, some new content will be launched in the future. Stay tuned.\n\nExpected content updates in future versions:\n§O1. The content of the three years of the setting sun, and an election that will determine the future. §!\n§R2. The Anugypt War §!\n§g3. Dealing with the extreme forces of the Storm Empire §!"
