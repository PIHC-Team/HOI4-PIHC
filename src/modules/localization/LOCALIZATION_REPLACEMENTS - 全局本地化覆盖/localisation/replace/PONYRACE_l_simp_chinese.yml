	RULE_ALLOW_COUPS_AI_ONLY_DESC:0 "各国只能对非马类玩家的国家准备并执行政变。"
	RULE_ALLOW_PARTY_BOOSTING_AI_ONLY_DESC:0 "各国只能对非马类玩家的国家提升政党支持率。"
	RULE_ALLOW_PARTY_BOOSTING_PLAYER_ONLY_DESC:0 "各国只能对马类玩家的国家提升政党支持率。"
	RULE_COUP_AI_ONLY_TT:0 "游戏规则：§R各国只能对非马类玩家的国家准备和执行政变。§!"
	RULE_BOOST_PARTY_PLAYER_ONLY_TT:0 "游戏规则：§R各国只能对马类玩家的国家提升政党支持率。§!"
	RULE_BOOST_PARTY_AI_ONLY_TT:0 "游戏规则：§R各国只能对非马类玩家的国家提升政党支持率。§!"
	DR_PLAYER_ASKING_FACTION:0 "§Y$THEM|U$§!是马类玩家："
	HUMAN_PLAYER_RESPONSE:0 "这个国家是被马类玩家控制的，将会根据他们的选择做出回应。"
	CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_QUOTE:0 "“从前，马类无法回避个体的死亡；此后，马类无法回避物种的灭亡。”\n\n——亚瑟·库斯勒"
	PEACE_COUNTRY_THIS_IS_HUMAN:0 "该国家由马类玩家操控（$PLAYERNAME|H$）"
	TUR_athenian_balkan_academy_desc:0 "南欧最聪明的马汇聚在一起，促进了巴尔干半岛和整个马类的利益。"
	battleship_1_desc:0 "虽然有些马认为战列舰是属于过去的海战的古董，但是另一些马认为它们是马类有史以来最令马印象深刻的舰船。没有马会否认这些战列舰竞赛的遗物是马们建造过的火力最强大、装甲最坚实的军舰。"
	JAP_SH_battleship_1_desc:0 "大和级是马类历史上造出过的最大的战列舰，排水量72,000吨。根据和平女神计划建造（译者注：大和级的建造计划实际是“第三次海军军备补充计划”，其中提到日本计划在1946拥有11艘51cm主炮改装的大和级战舰，“这些太平洋上的和平女神们”将足矣震慑美国海军让它不敢与日本开战，疑似是P社错误地将其当作计划名了），是日本海军的骄傲、力量的象征。每条船上都装备有九门46cm主炮——这是海军历史上军舰装备过的最大口径的火炮。"
	ship_hull_heavy_1_desc:0 "虽然有些马认为战列舰是属于过去的海战的古董，但是另一些马认为它们是马类有史以来最令马印象深刻的舰船。没有马会否认这些战列舰竞赛的遗物是马们建造过的火力最强大、装甲最坚实的军舰。"
