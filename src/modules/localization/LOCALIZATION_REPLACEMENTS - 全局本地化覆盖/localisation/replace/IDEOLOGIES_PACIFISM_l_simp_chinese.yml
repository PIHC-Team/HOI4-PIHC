l_simp_chinese:
	peacism:0 "和平思潮"
	peacism_noun:0 "和平思潮"
	peacism_desc:0 "和平思潮"
	peacism_drift:0 "和平思潮倾向"
	peacism_acceptance:0 "和平思潮外交接纳度"
	peacism_wiki_tooltip:0 "战争对于小马利亚的生物们来说是非常可怕的东西。\n所以无论是谐律主义支持者，还是平等主义激进支持者；无论你想要成为野心家掌控天下，亦或者领导革命还政于民；无论你想要通过战争攫取利益，还是单纯就像看着这个世界熊熊燃烧——我们都建议你三思。\n''战争，战争永远不会改变。''\n\n'''和平思潮下的意识形态：'''"
	peacism_republic:0 "中立主义"
	peacism_republic_desc:0 "中立主义：\n“我不明白这关我屁事。” 中立主义者相信，如果每只小马都只管好自己的事情，那这个世界自然就会获得和平。不仅仅在个体角度，在国家角度，他们坚决拒绝被牵涉进任何战争。不幸的是，这种态度往往会让他们成为战争的牺牲品。中立主义者并不畏惧战争，面对必要的战争时他们也会勇敢地站出来，只不过当他们尝试询问“谁与我一起？”时，他们会发现周围的国家更愿意回复：“我不明白这关我屁事。”"
	peacism_democracy:0 "亲外主义"
	peacism_democracy_desc:0 "亲外主义：\n一个亲外主义国家往往会对外国的文化、政治制度、甚至是外国的物种抱有好奇心和友好态度，以至于他们的选民会主动投票支持对外国的援助与更加紧密的合作。也许他们依靠旅游业赚取外汇，也许他们依靠外国的技术支持发展自己的经济，也许他们只是单纯地喜欢外国的食物。不管怎样，亲外主义国家的民众总是乐于接受外国的文化与定居者，这种态度也使得他们在外交上更加容易获得他国的支持。只是，在两个外国发生冲突，而这个亲外主义国家又恰好是两方同时的盟友时，他们往往会陷入比较尴尬的境地。"
	peacism_monarchy:0 "威慑主义"
	peacism_monarchy_desc:0 "威慑主义：\n一些有趣的和平主义国家会选择一位强大的战争领袖来统治他们，就像温柔的塞拉斯蒂娅可以使用和谐之元的强大力量，抑或是变成恐怖的破灭之阳一样。威慑主义者相信，如果你有足够强大的力量，你就可以避免战争。他们从不主动发起战争，但他们时时刻刻准备好了战争。这就像是一场勇敢者的游戏：最讨厌战争的一方必须要拿出最大的决心为战争准备，唯有这样才能保证和平的长久。"
	peacism_oligarchy:0 "金融中立主义"
	peacism_oligarchy_desc:0 "金融中立主义：\n成为世界银行，让全世界的所有国家成为保镖，让世界经济成为人质，这就是依靠金融地位实现中立主义的方式。更有趣的是，金融中立主义不仅会带来和平，还会带来繁荣。他们将从那些战争国家中获取存款，从存款中获取高额的保管费。不过，当金融中立主义国家失去他们的金融中心地位，又或者是他们临近一个打算破罐子破摔的战争国家时，他们往往会陷入比较尴尬的境地。除此之外，这些屯满黄金的金库最大的威胁并非海盗或是掠夺者，而是通货膨胀、金融危机以及发展债券、魔法信用点、稀有水晶矿等新的金融工具的崛起。"
	peacism_tribe:0 "和平主义部落"
	peacism_tribe_desc:0 "和平主义部落：\n多数部落有着好战和尚武的传统，但和平主义部落并非如此。许多这样的部落有着来自于三族盟约时期的先祖，他们可能与天马、陆马、独角兽大部队走散了，又或者他们根本不是小马。在孤立无援的寒冷中，他们周围绝大部分好战的部落都灭亡了，而他们却奇迹般地存活下来，并且幸运（或者是不幸地）保持着远离文明，直到如今。和平主义部落的成员们通常会对外族保持警惕，但他们并不会主动发起攻击，如果矛盾不可避免，他们宁愿举族搬迁。这种对和平的极端渴望并非来自善良或懦弱，而是来自对风之魔刻在骨头里的恐惧。"
	peacism_freestate:0 "和平社群"
	peacism_freestate_desc:0 "和平社群：\n麒麟是为数不多发展成现代国家的和平社群，多数和平社群会在文明发展过程中逐渐放弃和平主义理念，亦或者放弃社群形态变为一个中立主义或者亲外主义国家。但麒麟有着自己的特殊之处 —— 他们无法进行战争，或者只能进行小规模的。因为战争带来愤怒，愤怒带来逆麟，逆麟带来毁灭，随后一切就会在烈焰中化为乌有。因此，麒麟的和平主义理念是他们被迫接受而无法摆脱的诅咒，影响着他们社会结构设计和外交政策的方方面面。而这份诅咒也是一份祝福，让他们在数千年来安然无恙，无论外部世界混乱或是稳定，无论麒麟内部混乱或是稳定，对于他们来说都只是黄粱一梦。"
	peacism_duchy:0 "非军事化区"
	peacism_duchy_desc:0 "非军事化区：\n在被控制后，宗主国选择将这里化作一个永久的非军事区：可能因为宗主国自身就信奉和平主义理念，更可能是宗主国想要彻底摧毁这个地区重新崛起寻求复仇的可能。还有一些国家选择主动放弃军事力量，依附于一个强国来保证自己的安全。\n不管怎样，这个地区的居民都会在宗主国的控制下，享受到和平主义的好处，但也会失去一些自由，并且将永远乞求自己的宗主国能够保护他们。"
	peacism_theocracy:0 "和平教皇国"
	peacism_theocracy_desc:0 "和平教皇国：\n如果一个国家本身并不参与任何政治、经济活动，而是单纯安安心心做一个巨大的教会呢？没有谁会主动去攻打一个既没有财富、也没有工业、也没有劳动力，但却有着数量庞大的狂热信徒的教会。当然，教皇国并非不会树立敌对者：通常他们会努力传播他们的宗教，毕竟越多的信徒意味着越多的保护和越多的贡奉。在这个过程中，异教徒和无神论国家往往会受到触犯。"
	peacism_technocracy:0 "创新和平主义"
	peacism_technocracy_desc:0 "创新和平主义：\n一个国家遭到入侵有时是因为仇恨或是文化，更多时候是因为资源、财富、工业、地理位置。而如果一个国家唯一的财富是这个国家中的头脑，那么这个国家就会变得无比珍贵。创新和平主义者相信，只要他们的科技领先并持续向世界输出足以改善一切的科技创新与文化创意，那么他们就可以避免战争。他们从不担忧被军事进攻的条件，他们只消除被军事进攻的动机。"
	peacism_militarism:0 "积极和平主义"
	peacism_militarism_desc:0 "积极和平主义：\n“只要所有的战争风险都从这个世界上消失的话，和平就可以实现了。” 积极和平主义者这个名字充满欺骗性：不仅欺骗他们的敌国，还有他们自己。他们会主动发起战争，但他们却坚信自己所做的一切都是为了和平。通过升级局势来稳定局势是积极和平主义者的惯用策略，而被一个和平主义国家击败的国家往往会被无情地嘲笑。唯一能对得起他们的名字的，就是在积极和平主义者赢得战争后，他们几乎不会剥削战败国家的资源，而是会尽可能地帮助他们恢复，除军队之外的一切。"
	peacism_dogmatism:0 "绝对和平主义"
	peacism_dogmatism_desc:0 "绝对和平主义：\n绝对和平主义者反对任何形式的战争，“当别的小马无缘无故踹了你的脸一脚，一个绝对和平主义者会将另半边脸也递上去。”，他们宁愿放弃自己的领土甚至生命，也拒绝拿起武器。他们的和平主义理念是他们的信仰，是他们的生活，是他们的一切。但他们并非悲惨的受害者，而是这个世界的幸运儿：他们最幸运的事情就是，他们依然还活着。"
	peacism_federal:0 "联合威慑主义"
	peacism_federal_desc:0 "联合威慑主义：\n避免战争的基础是战争的威慑。联合威慑主义者相信，当多个和平主义国家抱团结盟时，他们巨大的体量就足够帮助他们避免战争。但威慑主义者的敌人从来不是那些侵略者，而是那些处于和平联盟中的懦弱者。那些亲外主义者与绝对和平主义者会在真正的战争到来时，选择逃避，这将削弱整个联盟的威慑力。这就像是一场勇敢者的游戏：最讨厌战争的一方必须要拿出最大的决心为战争准备，唯有这样才能保证和平的长久。而多方的勇敢者游戏，是这个博弈中最难玩的一种。"
	peacism_spirit:0 "和平精灵"
	peacism_spirit_desc:0 "和平精灵：\n这是一群精灵组成的社会，他们不需要政治结构，只需要生活在一起，共同维护和平的理念即可。他们有着对和平最原始的认知，最纯净无污染，比那些原始部落中的生物更加接近和平的本质。"
