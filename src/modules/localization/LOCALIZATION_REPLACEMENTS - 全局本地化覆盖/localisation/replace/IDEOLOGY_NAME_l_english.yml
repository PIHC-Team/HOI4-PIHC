	BALTIC_forest_brother_resistance_cat_desc:0 "Socialism has not entirely been embraced by everyone in our nation, and none are so vocal and active in their distaste for the new [Root.GetNonEthosName] than the Forest Brothers. Staunch supporters of [Root.GetAdjective] nationalism, the Forest Brothers reject all foreign influence in [Root.GetNonEthosName] and seek to remove the communist party from power in favour of a more nationalistic government."
