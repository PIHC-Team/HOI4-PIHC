	COUP_STRENGTH_TOOLTIP:0 "§HCoup strength§! is determined by the popularity of the supported ethos in the target country. \n\nA coup attempt will be stronger the lower the £stability_texticon §YStability§! of the target is, and weaker if you fail to send all the equipment required."
	COUP_SMALL_TOOLTIP:0 "In a small country a coup will automatically succeed without triggering a civil war, as long as the ethos has at least $POPULARITY|%1H$ support. With less than this the coup will fail. Current support is $CURRENT$"
	DIPLOMACY_BOOST_PARTY_POPULARITY:0 "Boosting ethos"
	DYPLOMACY_FILTER_IDEOLOGIES:0 "Ethoses"
	DIPLOMACY_RELATION_IMPROVEMENT_DEFAULT_DESC:0 "This will also require a daily cost of £pol_power $VALUE|1H$\nBecause @$TAG1$$COUNTRY1|H$ and @$TAG2$$COUNTRY2|H$ have different ethos groups, the cost to Improve Relations is higher."
	RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC:0 "Unrestricted for any ethos at any World Tension."
	RULE_ALLOW_WARGOALS_LIMITED_DESC:0 "Wargoal Generation is limited by ethoses and World Tension limits."
	RULE_ALLOW_WARGOALS_FREE_25_DESC:0 "Wargoal generation is disabled below 25% World Tension, but available for all nations afterwards. This overrides any ethos restrictions, but still allows gaining wargoals through focuses."
	RULE_ALLOW_WARGOALS_FREE_50_DESC:0 "Wargoal generation is disabled below 50% World Tension, but available for all nations afterwards. This overrides any ethos restrictions, but still allows gaining wargoals through focuses."
	RULE_ALLOW_WARGOALS_FREE_75_DESC:0 "Wargoal generation is disabled below 75% World Tension, but available for all nations afterwards. This overrides any ethos restrictions, but still allows gaining wargoals through focuses."
	RULE_ALLOW_WARGOALS_FREE_100_DESC:0 "Wargoal generation is disabled below 100% World Tension, but available for all nations afterwards. This overrides any ethos restrictions, but still allows gaining wargoals through focuses."
	RULE_OPTION_SAME_IDEOLOGY:0 "Same Ethos Only"
	RULE_ALLOW_ACCESS_SAME_IDEOLOGY_DESC:0 "Countries can gain military access and docking rights from countries that share the same ruling ethos."
	RULE_ALLOW_LICENSING_SAME_IDEOLOGY_DESC:0 "Countries may only acquire production licenses from countries that share the same ruling ethos."
