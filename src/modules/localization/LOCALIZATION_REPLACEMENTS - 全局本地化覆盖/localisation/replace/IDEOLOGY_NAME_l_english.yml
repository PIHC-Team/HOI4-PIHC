	RULE_ALLOW_VOLUNTEERS_LIMITED_DESC:0 "Sending Volunteers is restricted by World Tension and ethos rules."
	RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC:0 "Countries may only send Volunteers to countries that share the same ruling ethos."
	RULE_ALLOW_GUARANTEES_LIMITED_DESC:0 "Issuing a Guarantee of Independence is restricted by World Tension and ethos."
	RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC:0 "Countries can only Guarantee countries that share their ruling ethos."
	RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_TOOLTIP:0 "Game Rule: §RCountries can only Guarantee countries that share their ruling ethos.§!"
	RULE_ALLOW_MILITARY_ACCESS_SAME_IDEOLOGY_TT:0 "Game Rule: §RCountries can gain military access and docking rights from countries that share the same ruling ethos.§!"
