	DIPLOMACY_STAGE_COUP_ACTION_DESC:0 "Try to stage a coup on behalf of a political party in this country. \nCoup strength is determined by ethos support in the target nation."
	DIPLOMACY_FAILED_COUP_REASON_POPULARITY:0 "It failed due to the low political support for our ethos"
