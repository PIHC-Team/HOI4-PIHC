	RULE_ALLOW_LICENSING_SAME_IDEOLOGY_TT:0 "Game Rule: §RCountries may only acquire production licenses from countries that share the same ruling ethos.§!"
	RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0 "Franco will take control of the Nationalist front and merge the Falangist and Carlist ethoses in a new and unified Spain, attempting to stay neutral in the World War unless attacked."
	RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0 "The POUM and their Anarchist allies will cast off the Stalinist yoke and seek their own independent communist ethos after the Civil War."
	RULE_COMMUNIST_ARG_AI_DESC:0 "The AI will attempt to turn the country communist and will join the Comintern to focus on spreading their ethos in South America."
	steel_wings_steel_hearts_spirit_desc:0 "It takes a certain type of courage to wage war at 10,000 feet.\n\n§GThis spirit is available due to our ethos.§!"
	best_of_the_best_naval_academy_spirit_desc:0 "Tough competition and strict selection breeds the captains we want.\n\n§GThis spirit is available due to our ethos.§!"
	academy_scholarships_spirit_desc:0 "No one should be prevented from serving their nation due to a simple lack of money.\n\n§GThis spirit is available due to our ethos.§!"
	political_loyalty_spirit_desc:0 "An unreliable military is a threat to the state it is meant to protect.\n\n§GThis spirit is available due to our ethos.§!"
	relief_of_command_spirit_desc:0 "The army does not exist to feed the ego of its Generals.\n\n§GThis spirit is available due to our ethos.§!"
	ideological_loyalty_spirit_desc:0 "Someone who does not have the correct ethos can not be expected to achieve the correct result in battle.\n\n§GThis spirit is available due to our ethos.§!"
	state_serves_the_military_spirit_desc:0 "The purpose of the state is to wage war against other states. Anything else is either in support of that or a useless distraction.\n\n§GThis spirit is available due to our ethos.§!"
	BALTIC_rejoin_the_railways_desc:0 "The Russians and the Germans who occupied us have seen us as nothing more than a rural backwater, but no more. [ROOT.GetNonEthosName] shall be industrialized to its maximum potential starting with an upgrade of our railways and infrastructure."
	BALTIC_axis_investments_desc_ger:0 "Germany’s trade ports exist all along the Baltic, and although we were enemies once, it is undeniable that Axis trade and investments would strengthen the [ROOT.GetNonEthosAdjective] economy immeasurably."
	BALTIC_axis_investments_desc_fasc_eur:0 "Fascism has a strong presence in Europe, and although there’s some understandable reservations, it is undeniable that Fascist trade and investments would strengthen the [ROOT.GetNonEthosAdjective] economy immeasurably."
	BALTIC_axis_investments_desc_fasc_int:0 "Fascism has a strong presence around the world, and although there’s some understandable reservations, it is undeniable that Fascist trade and investments would strengthen the [ROOT.GetNonEthosAdjective] economy immeasurably."
	BALTIC_axis_investments_desc_jap:0 "[JAP.GetName] has proven their economic and military might, and although they're not exactly neighbors, it is undeniable that [JAP.GetAdjective] trade and investments would strengthen the [ROOT.GetNonEthosAdjective] economy immeasurably."
	BALTIC_autobahn_desc:0 "It matters little how well industrialized [Root.GetNonEthosName] is if her infrastructure does not facilitate a rapid and continuous influx of labour. By modelling our infrastructure sector after that of the Reich, we may achieve the efficiency they have."
	BALTIC_german_tank_licences_desc_default:0 "German tanks have proven themselves capable of leaving their enemies scattered and confused as they blitz through their target. [Root.GetNonEthosName] would benefit greatly by emulating these tactics in the oncoming wars to the East."
	BALTIC_german_tank_licences_desc_alt:0 "The tanks of our fascist benefactors have proven themselves capable of leaving their enemies scattered and confused as they blitz through their target. [Root.GetNonEthosName] would benefit greatly by emulating these tactics in the oncoming wars to the East."
	BALTIC_german_baltic_industry_desc_default:0 "Our nation now is rich in German investment. The private sectors of Germany and [Root.GetNonEthosName] are almost indistinguishable, with many of the same corporations providing work to [Root.GetNonEthosAdjective]s and Germans alike."
	BALTIC_german_baltic_industry_desc_alt:0 "Our nation now is rich in foreign fascist investment. The private sectors of other our fascist benefactors and [Root.GetNonEthosName] are almost indistinguishable, with many of the same corporations providing work to [Root.GetNonEthosAdjective]s and their people alike."
	BALTIC_crossley_motors_desc:0 "With foreign investment now rife within our nation and production of automobiles in reasonable efficiency, we may be able to collaborate with the Crossley Motor Company to create original designs for use within the [Root.GetNonEthosAdjective] army!"
	BALTIC_british_designers_desc:0 "We have studied British designs thoroughly, and with [Root.Capital.GetName]-Crossley Motors proving to be a successful endeavour, we would do well to extend formal invitations for British designers to join the [Root.GetNonEthosAdjective] Engineering Company."
	BALTIC_technology_sharing_desc:0 "We produce many of our partner’s equipment already, but perhaps by studying their designs we shall be able to significantly improve native [Root.GetNonEthosAdjective] designs."
	BALTIC_allied_shipments_desc:0 "Since 1918, the [Root.GetNonEthosAdjective] army has been equipped with shipments sent to us from Great Britain and we should make efforts to make the Allies understand that unless shipments are drastically increased, [Root.GetNonEthosName] may become subject to another Soviet puppet government."
	BALTIC_baltic_fleet_desc:0 "While the [Root.GetNonEthosAdjective] fleet is scarcely the envy of the world, with proper investment it may yet prove to be able to defend [Root.GetNonEthosName] from any attempted invasions on the sea."
	BALTIC_attract_workers_to_capital_desc:0 "The workers of [Root.GetNonEthosName] are spread disparately across the countryside, often working in the outdated agricultural sector. If we want to industrialize our nation for war, we must attract workers to the factories of [Root.Capital.GetName]!"
	BALTIC_arm_the_nation_desc:0 "All across [Root.GetNonEthosName] there are men ready to face the oncoming threat of a Soviet invasion but lack the equipment to do so. We must ready our arms industry for the rapid production of infantry equipment."
	BALTIC_unchain_education_desc:0 "The [Root.GetNonEthosAdjective] educational system has long been restricted by our disparate population centres, but now with rural folk moving closer to the cities, we shall be more capable of efficiently educating the [Root.GetNonEthosAdjective] youth."
	BALTIC_defence_of_our_nation_desc:0 "Civilian industry is of equal importance to our defence as the arms industry. The steady hum of machinery will drone throughout all of [Root.GetNonEthosName] as its patriotic people do their duty to industrialize our nation."
	BALTIC_modernize_industry_desc:0 "For too long, [Root.GetNonEthosName]’s output has been defined by agriculture but no more. We must concentrate our industry around the major city centers in each state if we are to turn [Root.GetNonEthosName] into a modern economy."
	BALTIC_domestic_motors_desc:0 "Foreign designs are fine, but we cannot rely on them in perpetuity. [Root.GetNonEthosName] is a proud nation, and we must show the world that our designers and thinkers are just as adequate as those from the West."
	BALTIC_original_designs_desc:0 "From our nation’s birth in 1918 to the present day, [Root.GetNonEthosName] has equipped its armies with arms from the Brits, but no more. We cannot rely on the Brits any longer, we must look forward and begin manufacturing weaponry of [Root.GetNonEthosAdjective] origin."
	BALTIC_trade_with_neighbors_desc:0 "Each time we invest trade into the Germans or the Soviets, we are contributing to our own doom. We cannot allow enemy troops to invade [Root.GetNonEthosName] with Lithuanian grain in their rations and Estonian oil in their tanks made from Latvian steel. We must instead aid each other to defeat our common enemy."
	BALTIC_invest_in_baltic_trade_desc:0 "The Baltic Sea is rich with trade from Scandinavia, Germany, and Russia and our ports can scarcely contain them all. We must open up new trade lines with our friends who share this sea with us for a brighter and more prosperous [Root.GetNonEthosName]!"
	BALTIC_revolutionary_cabinet_desc:0 "Now that we have returned to our rightful place as the stalwart sentinels of the lower-class, we may once again assemble a cabinet of ministers aligned with the ethos of our new state."
	BALTIC_purge_of_our_own_desc:0 "Even through our best efforts to squash all resistance, there are still those organizing in the shadows, conspiring against the proletariat to restore a capitalist dictatorship in [Root.GetNonEthosName]. We must conduct a popular purge; rooting out any members of the old government and any who support them."
	BALTIC_crush_forest_brothers_desc:0 "The Forest Brothers have been a blight on our nation since our takeover; sabotaging our industries, railroads, and disrupting official government demonstrations. We must venture into the forests of [Root.GetNonEthosName] and root out these misguided individuals."
	BALTIC_belarus_ssr:0 "[Root.GetNonEthosName]-Belarus SSR"
	foreign_influence_desc:0 "The countries we have taken under our protection deserve only the best and most equitable governance. Destabilizing influences from alien ethoses must be curtailed."
	propping_up_gustavo_ross_tt:0 "When §YGustavo Ross§! becomes the President of Chile, gain §G+75§! Political Power, §G+5%§! Stability and give him the trait §YPopular Among the People§! that grants: §G+2%§! Compliance Growth Speed Factor, §G+25%§! Ethos Drift Defense and §G+10%§! Stability."
	marxism_desc:0 "Encompassing a broad spectrum of economic and historical views, Marxist politics seek to apply the theories of Karl Marx to political practice. Class struggle and the need for transition to a society based on common ownership of the means of production characterize these ethoses."
	leninism_desc:0 "A political ethos based in Marxist thought, Leninism seeks to establish a socialist state by a vanguard party leading a revolution overthrowing capitalist society. Once in power, the party rules through a system whereby policies are open for internal debate until a decision has been made."
	anti_revisionism_desc:0 "A reaction to the many ethoses claiming to be successors to Marxism, Anti-Revisionism advocates retaining key elements of original revolutionary theory. Mainly opposing incorporation of capitalist economic elements into socialist states, the ethos is defined as much by what it isn’t as what it is."
	falangism_desc:0 "An authoritarian ethos with traits of fascism and conservatism, Falangism values national and Catholic identity."
	indoctrination_focus_desc:0 "Having established our ethos as based on the truth, it may be taught as truth. Education and media must reflect this lesson."
	internationalism_focus_desc:0 "Ethos knows no borders. Another nation may call itself sovereign, but our convictions are above such claims."
	upgrade_psycho_warfare_desc:0 "§LPropaganda has been an effective tool in securing our ideological interests within our own state, but no tool has been quite as effective as spreading fear of the enemy regimes and what they may bring to the country. By allying our agents with anti-ideological movements within foreign nations, we shall become far more effective in spreading our ethos worldwide...§!"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_TITLE:0 "Boost Ethos"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_ACTION:0 "Boosting ethos"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_ASSIGNMENT_DESC:0 "§GClick§! to highlight suitable target countries. Then §GClick§! on a country to select the ethos to boost."
	OPERATIVE_MISSION_BOOST_IDEOLOGY_DESC:0 "§LBoost the support of a local political party.§!\n§YDaily Ethos Support gain: $BASE|1=$§!\n  Base: $BASE|1G$"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_VALID_TARGET:0 "§GClick§! to select an ethos and assign $CODENAME|H$ to £operative_mission_icons_small|5£ Boost Ethos in $STATE|H$"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_INVALID_TARGET:0 "Cannot assign operatives to Boost Ethos in $STATE|H$\n\n$REASON|R$"
	OPERATIVE_INVALID_MISSION_REASON_NO_IDEOLOGY_TO_BOOST:0 "No suitable ethoses to boost"
	internationalism_desc:0 "We strongly believe that ethos span across national borders and do not feel limited in crossing those borders ourselves."
