l_simp_chinese:
	COLONIAL_FORCES_GENERAL_DESCRIPTION:0 "§G点击查看附属国和流亡政府的编制§!\n\n殖民地的自治度越低，用殖民地编制创建的单位可以使用的殖民地马力就越多。"
