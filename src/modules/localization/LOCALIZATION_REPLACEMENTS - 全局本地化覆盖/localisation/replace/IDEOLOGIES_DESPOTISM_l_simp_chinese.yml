l_simp_chinese:
	despotic:0 "秩序思潮"
	despotic_noun:0 "秩序思潮"
	despotic_desc:0 "秩序思潮"
	despotic_drift:0 "秩序思潮倾向"
	despotic_acceptance:0 "秩序思潮外交接纳度"
	despotic_wiki_tooltip:0 "在相当长的一段时间里，天角兽是小马们毫无争议的统治者，那些拥有超常魔力的个体生来就是负责统领一切。他们的统治也经受住了时间的考验，在相当长的时间里维护着小马利亚乃至全世界的和谐与安定 —— 直到整个体系轰然倒塌。而在小马利亚之外，超常个体也往往牢牢把握着最高权力，有的明君令国家繁荣昌盛，也有的暴君令灾难与惨剧频发。\n即使是这样，无论是小马还是其他生物对于一个强力领导者的依赖依旧保持着历史惯性：有一个强势的领导者来带领大家，普通的公民们便不用为政治发愁，难道这不是一件令大家幸福的事情吗？\n当然，异议者固然存在，但他们的声音总是会被淹没 —— 甚至毁灭。\n\n'''秩序思潮下的意识形态：'''"
	despotic_republic:0 "元首制"
	despotic_republic_desc:0 "元首制：\n事实证明，你可以同时做一位公主/王子/女王/国王/皇帝/女皇，以及一个共和国支持者。你所需要的仅仅是为自己改一个名字：总统、元首、主席、首相、统领、管家、执政、领袖... 你甚至并不需要举行选举，就可以让你的民众满意。这就是自由如何灭亡的，伴随着雷鸣般的喝彩。"
	despotic_democracy:0 "二元君主立宪制"
	despotic_democracy_desc:0 "二元君主立宪制：\n二元君主立宪制家同时存在两个权力机构：君主任命的政府与民选的议会，其中，君主政府拥有更大的权力。一般而言，大部分君主立宪制国家往往会限制王权，将更多权力授予议会。随着时间推移，王权将被削弱，实际权力转移到了议会上。但是，在二元君主立宪制国家（他们往往标榜自己是真正的君主立宪国家），君主的权力依然得到了相当的保留，他们能对国家的政治施加巨大的影响，而议会所能做的实际上非常有限，远不能达到真正约束君权的目的。\n这种畸形的体制一般来自于民主势力与专制势力的妥协，例如小马国城市代表大会：各个城市渴望民主，但他们对于塞拉斯蒂娅的英明统治并没什么意见，因此并不介意让议会成为一个装饰品。一个更加典型的例子来自于水晶帝国。在这里，民主势力从未有过推翻皇室的能力。在水晶帝国战败后，和煦光流与邪茧女王强行在这个国家建立了一个理事会，从而让“境外势力”可以乔装成为“民主势力”。起初，依仗着小马利亚帝国和幻形灵帝国，以及《停战协定》，理事会具有较大的权力，水晶帝国几乎可以说是成为了一个君主立宪制国家，只不过是被殖民的。而随着风雪之心逐渐长大，皇室支持者在内阁中的比例逐渐增加，理事会的权力也逐渐被削弱... 水晶帝国开始成为二元君主立宪制的典型代表。"
	despotic_monarchy:0 "绝对君主制"
	despotic_monarchy_desc:0 "绝对君主制：\n顾名思义，绝对君主制中君主掌管国家的一切大小权力，对国内的一切事物均具有决断权。对于中央大陆乃至小马利亚的其他地区来说，君主制可谓最古老和最持久的政府制度之一。在过去的千年，世界上绝大部分国家都采用君主制。但是，君主制随着时间推移所暴露出的问题越来越多。对于少部分种族来说，比如小马，天角兽的强大魔力和稀缺性天然成为了她们担任君主的合法性，但这种稀缺也同样成为权力交接年代的不稳定因素，比如现在。而更多其他种族的君主则来源于血脉、文化、制度传统、或是一些比如能感知矿脉等莫名其妙的天赋。\n随着科技的逐步发展，在小马利亚世界快速开荒和工业化的进程中，原有的君主受到稀缺或传统限制，使他们不能及时有效管理这些新兴的领域，便促成了无数地方团体组织和新兴社会阶层的孵化。在这些新兴势力和守旧贵族的争斗中，君主的权力也在逐步被蚕食。传统的君主制度遭遇了巨大挑战，君主制国家能否经受住时代考验开始变成一个愈发明显且迫在眉睫的问题。"
	despotic_oligarchy:0 "寡头政治"
	despotic_oligarchy_desc:0 "寡头政治：\n寡头制社会的特点是权力被高度集中在一小部分权贵之中。寡头形成的原因可能是财富，血统或者强大的魔力，总之他们因各种原因得以高高在上。少部分寡头制国家会打着民主的幌子，更多则干脆直接以文化或者法律方式合法化了自己的权力。虽然寡头群体之间也可能会内斗，掌权的寡头可能垮台，但取代他们的往往也不过是新的寡头。\n虽然寡头制国家可能有很多表现形式，但他们几乎都不约而同地实行差不多的政策 —— 刻意造成贫困，强力控制民众，管控言论与集会，甚至使用暴力方式来强行镇压所有可能威胁到他们统治的情形。在寡头制国家体制下，上升成为一种奢望，普通民众难有出头之日。"
	despotic_tribe:0 "酋长制"
	despotic_tribe_desc:0 "酋长制：\n酋长制是一种原始的政治制度，通常只出现在部落社会中。在酋长制部落中，酋长是部落的首领，他们的权力通常是血脉继承而来的，少数来自于某些原始信仰，更少数来自于禅让\n或抽签。虽然酋长的专制权力与专制城邦、元首制国家的领袖也许没什么太大区别，但在一个原始部落中，他们又能做什么恶行呢？"
	despotic_freestate:0 "专制城邦"
	despotic_freestate_desc:0 "专制城邦：\n一个专制城邦的市长也许和一个元首制国家的领袖没什么区别，但是他们的权力范围为他们分出了高下。更高的权力意味着更大的风险：在一个小城市中取得的绝对权力，往往比一个国家的领袖更加强大，但也往往更容易因为一件小事情就被推翻。在暮光闪闪时期，特丽克西·卢拉月曾经在成为过小马谷领袖 —— 虽然她的统治只持续了一个下午。另一方面，城邦中的独裁者也往往容易被外部力量推翻：古代安及，在阿努比斯与克骊欧佩特拉的子嗣膨胀为帝国之前，他们都是一群专制城邦；而当这些领袖消失时，他们的城邦也往往随之消亡。"
	despotic_organization:0 "野心集团"
	despotic_organization_desc:0 "野心集团：\n也许，这个国家刚刚建立；也许，这个国家正处于灾难与动乱之中；也许，这个国家的民主已经在名存实亡的边缘。总之，一小团野心家刚刚取得了权力，他们的目标是什么？是建立一个新的专制政权，还是推行他们的意识形态，还是为他们背后的势力谋取利益？又或者，他们只是想要一份薪水更高的工作？不管怎样，他们的行动都将对这个国家的未来产生深远的影响。"
	despotic_duchy:0 "领主封地"
	despotic_duchy_desc:0 "领主封地：\n领主封地是一种在小马利亚土地历史上从未出现过的新型政治体制，因为历史上无论是三族政权、天角兽政权或是其他种族比如狮鹫王国，都没有册封一个地区性领主的必要。而随着终末之战后，和煦光流取得权力，小马利亚皇家委员会无力控制各个充满反叛精神的地区，这种新颖的“分封制度”被和煦光流发明出来：他们将一些地区封给了一些忠诚的领主，让他们在这些地区中拥有绝对的权力。这种制度的优势在于，一方面一个领主可以帮助和煦光流镇压地区的叛乱，在必要时可以直接丢弃，从而避免让和煦光流留下恶名；另一方面这些领主如果比和煦光流更加讨喜，也会降低地区的反抗程度。中央无需为地区问题提供解决方案，而地区则需要支持和煦光流。然而，这种制度的缺点也很明显：如果领主不受欢迎，那么领主的作用也不大；而如果领主太受欢迎，一旦领主背叛，那么这个地区就会陷入混乱并迅速脱离帝国。因此，和煦光流只将领主封地看作是一种权宜之计，而不是一种长久的政治体制。"
	despotic_authoritarianism:0 "威权制"
	despotic_authoritarianism_desc:0 "威权制：\n在威权统治下，领导者的权力是绝对的，几乎没有任何异议或反对的余地。相比于元首制或绝对君主制，威权政体中的权力更加集中在中央政府和独裁者本身。\n也许可以说这种体制曾经在龙族领地存在过，因为前龙王火炬曾经持有绝对权力长达数百年。然而，随着余焰登基，龙族国家开始向更加温和的体制转变，回归到了火炬统治之前的普通君主制体制。"
	despotic_totalitarianism:0 "极权制"
	despotic_totalitarianism_desc:0 "极权制：\n极权制是威权制的升级版本，国家对于公民的控制可以深入到生活的各个角落，政府通常会通过宣传、教育、宗教、文化等手段来控制公民的思想，树立对领袖的个体崇拜。\n不过，纯粹的极权制在小马利亚非常少见，这并非因为小马利亚缺少野心家和独裁者，而是因为独裁者在进入极权后往往不会安于做一个平平淡淡的暴君：要么他们会成为一名征服者，在全世界扩张他们的国家、宣扬他们的意识形态；要么他们会追求绝对的力量来稳固自己的权座，最终摸到飞升的秘诀甚至成为神灵。"
	despotic_utopia:0 "理想国"
	despotic_utopia_desc:0 "理想国：\n在这里，对领导者的个体崇拜不再是虚假宣传，英明而温和的领导者做到了其所承诺和宣传的一切。这样的理想国度此前还只存在于一些君主主义者的假想之中，因为即使是塞拉斯蒂娅统治下最和平最繁荣的小马利亚，也远远没有达到理想国的标准。不过，如果这就否定理想国的存在未免太过武断，如果说从小马利亚的历史中能学到什么，那就是：一切皆有可能。每一位领袖，无论是野心家还是无私的圣者，都有实现其梦想的可能。"
	despotic_dystopia:0 "反乌托邦"
	despotic_dystopia_desc:0 "反乌托邦：\n很多自由斗士都下意识地误以为，专制政权是牺牲了大部分民众的利益为少部分的利益集团服务。但至少对于反乌托邦来说，这是一个完全的误解。因为在这里，专制政权可以牺牲全部民众的利益，而不为任何利益集团服务。权力本身的延续已经压倒了一切，无论是民众、基层官员、高层官员还是独裁者本身，对于系统来说都只是无关紧要可以随时丢弃的棋子。我们都被同一条锁链捆绑，上层和下层一样疲惫不堪。"
	despotic_theocracy:0 "神权制"
	despotic_theocracy_desc:0 "神权制：\n在神权制国家，领袖要么是真实存在的神灵，要么是自称神灵的代言者，要么是莫名其妙被捧上神坛的普通者。宗教信仰在小马利亚世界并非什么新鲜的理念，从信仰梦魇之月的夜骐族，到信仰黑晶王的暗影信徒，再到因为几本友谊日志就爆发内部争吵的M6追随者们... 小马们的大脑是如此简单而天真，以至于有时候让他们忘记一切逻辑与争吵，仅仅追随一个心目中的理想领袖或神灵，可能才是对他们最好的选择。如果思考过于困难，那么不如放弃思考，相信神灵的庇佑与命运的安排吧。"
	despotic_technocracy:0 "学阀治国"
	despotic_technocracy_desc:0 "学阀治国：\n魔法正在消失，风之魔正在侵吞我们赖以生存的家园。无论是自由主义者、专制主义者、平等主义者还是其他什么主义者，他们都无法解决这个问题。谐律主义者们声称“友谊是魔法”，但很显然他们也未能很好完成自己所声称的使命。意识形态的差异不再能解决现实中的问题，而要弥补魔法缺失带来的生产力下滑，普通陆马或是麻瓜生物的唯一选择就是诉诸科技。\n在这种情况下，学阀治国成为了唯一的选择：只有那些真正懂得未来的领袖和先锋能领导我们走出困境。权力与利益的公平分配？不过是一场闹剧罢了，只有蒸汽机与发电机才是小马们的真正救星。"
	despotic_militarism:0 "军政府"
	despotic_militarism_desc:0 "军政府：\n当那些眼看着国家陷入分崩离析的小马或是幻形灵们寻找要为这一切负责的对象时，有些会怪罪不作为的前君主，有些会怪罪这些在战争中崛起的篡权者，有些会怪罪广大沉默的民众。不过，有一部分小马认为：这一定是因为我们对于国防不对重视导致的。早在终末之战前，小马利亚王国的皇家卫队就已经是一套空壳；化茧后的幻形灵王国也失去了他们几乎全部的军事力量；水晶帝国在和平中沉睡过久；狮鹫中也缺少战士与尚武精神... 所以，这一切错误都源自于军队的缺位，唯有一支强大的军队才能终结一切，保卫千年的和平。\n问题在于，就像苹果派既可以食用，也可以被用于向你的敌军投掷，谁是军队的最终掌控者呢？对于军政府来说，这个问题不再需要回答。“政府来自士兵、依靠士兵、服务士兵”，这便是军政府的全部哲学。"
	despotic_dogmatism:0 "文官独裁"
	despotic_dogmatism_desc:0 "文官独裁：\n必须承认，无论来自于哪个国家哪个种族，所有的民众都已经反感了混乱与争斗。自从终末之战以来，暴乱似乎从未停止。法律与秩序，这是我们唯一的希望。\n但谁将成为秩序的执行者呢？小马们不希望看到军事独裁者，也不希望看到宗教徒或是野心家，他们只希望看到一个能够维护法律与秩序的平庸政府。为此，他们不惜选择拥抱官僚主义：只有那些能够严格遵守规则者才能成为领袖。无论谁是规则的制定者，已经运转上千年的制度绝不会出错，对么？平庸、臃肿、低效，但是稳定，稳定，稳定，而且，稳定。"
	despotic_federal:0 "君主制邦联"
	despotic_federal_desc:0 "君主制邦联：\n出于种族或历史原因，有些国家会同时拥有多个最高君主，例如分管白天的塞拉斯蒂娅公主与分管夜晚的露娜公主；有时候多个国家会拥戴同一个君主，例如梦魇之月时期的小马国与夜骐国；有时候一个君主国家可能与其他国家结成联盟，例如海马利亚的诺沃女皇对骏鹰菲亚的统治权。总之，通过不同形式形成的君主制邦联是小马利亚历史上比较常见的政治体制之一。不过这种联邦往往不会稳定长时间存在，在露娜公主登上月球候，塞拉斯蒂娅就接管了整个小马国，夜骐国也随之独立；而骏鹰菲亚与海马利亚轮流在邦联中占据统治地位，也使得他们并非总是生活在君主制中。"
	despotic_equatism:0 "音韵主义"
	despotic_equatism_desc:0 "音韵主义：\n作为负责“爱”的君主，音韵推崇平等的理念，认为每一只水晶帝国小马都应该得到平等的关爱。无论实在小马国生活期间、水晶帝国执政期间，还是如今的退休状态，音韵公主都受到小马们的热烈欢迎。即使是和煦光流已经将音韵公主与银甲定性为“水晶帝国的战争犯”，外国势力依然不敢在水晶帝国境内公开发表污蔑音韵公主的言论。正是音韵公主的博爱精神，让她受到了水晶帝国民众的忠实拥簇，让她和银甲得以避免被小马利亚帝国和幻形灵帝国处决的命运。"
	despotic_harmonicism:0 "开明君主制"
	despotic_harmonicism_desc:0 "开明君主制：\n仁慈的专制主义认为，如果一位领袖能够为国家带来繁荣与和谐，那么他/她的专制统治就是合理的。不少塞拉斯蒂娅的支持者将她视作开明君主的典范，但一些将其视作对君主制辩护的言论则并没有获得市场：塞拉斯蒂娅主义者们希望与这些开明君主主义者划清界限。他们的一个主要分歧就是：对于塞拉斯蒂娅主义者来说，谐律理念是小马利亚的根本，塞拉斯蒂娅是一名出色的领袖的原因正是因为她遵循了谐律的理念；而对于开明君主主义者来说，谐律理念只是一种工具，只要能够带来和谐与繁荣，那么就可以随意改变，正是因为塞拉斯蒂娅是一名出色的领袖，小马们才会歌颂她的谐律理念。这种分歧在塞拉斯蒂娅的统治下并未爆发，但如果要问其他君主是否算得上“开明”或“仁慈”，即使是最正统的开明君主主义者们内部也会立刻吵得天翻地覆。"
	despotic_neoharmonicism:0 "新谐律主义"
	despotic_neoharmonicism_desc:0 "新谐律主义：\n尽管和煦光流已经取得了小马利亚的统治权，但依然得不到大众的支持。她取得政权的方式完全是非法的，且所作所为也与传统的谐律主义“略有出入”。因此，从贵族到乞丐，每一匹小马都只是表面顺从，实际上背地里都各有心机，嘲笑着所谓的“帝国女皇”。\n想要改变这一切，需要从小马们的思想上动蹄。每一匹小马的脑子里都或多或少残留着前朝的余毒，他们过时的谐律思想干扰着帝国的正常治理，也为叛贼提供了法理。于是，和煦制定了她自己定义的“新谐律主义”，专注于个马崇拜。只要尊重女皇、假设女皇的绝对正确，那么谐律的具体定义就不再重要，和煦女皇曾经说谐律六元素是五件高领毛衣和一个奶酪刨丝器，那么她就是对的。尽管这一思想依旧不被大多数马所接受，但和煦已经下令改写教科书，管制出版和集会，在全国大范围不间断宣传，力图抹除掉一切旧谐律思想存在过的痕迹。只要政策持续下去，假以时日，五件高领毛衣和一个奶酪刨丝器将随着女皇之名被深深烙印在每一代小马的头脑中。"
