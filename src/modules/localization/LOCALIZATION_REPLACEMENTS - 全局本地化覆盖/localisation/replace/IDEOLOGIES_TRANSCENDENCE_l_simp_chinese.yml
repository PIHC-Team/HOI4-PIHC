l_simp_chinese:
	transcendence:0 "升华思潮"
	transcendence_noun:0 "升华思潮"
	transcendence_desc:0 "升华思潮"
	transcendence_drift:0 "升华思潮倾向"
	transcendence_acceptance:0 "升华思潮外交接纳度"
	transcendence_wiki_tooltip:0 "无论意识形态或者政治体制，都只不过是凡夫俗子们的低效工具罢了。\n对于精灵，神灵，抑或是那些不可被理解与直视的存在，他们从不需要这些无用的秩序。\n他们的意志，便是规则本身。\n\n'''升华思潮下的意识形态：'''"
	transcendence_spirit:0 "魔法生物"
	transcendence_spirit_desc:0 "魔法生物：\n他们是由魔法组成的生物，一般独自行动，不构成社会结构。他们有着神奇但不是特别强大的奇怪魔法，例如大熊、蜂熊、鸡蛇兽、三头犬等。诚然，会有学者小马质疑这个概念：任何生物体内都具有魔法，都可以算是魔法生物。但是就日常生活而言，这个定义还是足够清晰。"
	transcendence_deity:0 "神灵"
	transcendence_deity_desc:0 "神灵：\n神灵通常指那些具有更加强大力量的魔法生物，魔法学界普遍认为，黑晶王可以被看作是神灵的门槛：只有拥有同等或者更高等级的魔力的生物才能被称为神灵。如今，风之魔是当之无愧的神灵，还有传说中的格罗迦。谐律之神是否存在，学者们至今仍在争论。旧日的无序是神灵的争议并不大，但如今的无序是否还应该被称为神灵，学者们则大多持怀疑态度。邪茧女王、和煦光流等生物，仍然还不足以达到神灵的标准。当然，对于学者来说，不同的学术观点是正常的。他们唯一讨厌的是在讨论神灵标准时，被一群宗教徒甚至邪教徒打断。"
	transcendence_hive:0 "蜂巢思维"
	transcendence_hive_desc:0 "蜂巢思维：\n一个强大的中央主机个体控制着所有的个体，个体的自我意识被压制而完全服从于中央主机个体的调度，整个国家像一部机器一样，围绕着中枢的主机运转。很多小马并不理解这种社会结构的优点，相比于涌现意志与格式塔意识，蜂巢思维似乎有些过于依赖中枢了，无论是信息传输还是运算能力，这都不是一种很优秀的链接结构。但就像电影和小说中的反派所经常喜欢的那样：一个强大的机器，总要设置一个一碰就会崩溃的弱点，一个自毁开关，这样我们的主角才能在邪恶势力即将取胜的最后一秒拯救世界。"
	transcendence_gestalt:0 "格式塔意识"
	transcendence_gestalt_desc:0 "格式塔意识：\n实现了精神的完全统一，个体意识不复存在。整个国家只存在一个个体，而每个具体的肉身都只像是手指头一般的器官罢了。不同于涌现意志，格式塔意识的存在是客观的：祂可能是一套被保存的意识，可能是一段代码，也可能是某个概念的化身。有谐律主义学者认为谐律之神对谐律之树、谐律树屋和友谊地图的操控就是这种格式塔意识的体现。"
	transcendence_crisis:0 "天灾"
	transcendence_crisis_desc:0 "天灾：\n即使是神灵，在小马利亚世界也完全不罕见，而神灵之间亦有差别。黑晶王虽然也是一位强大的神灵，但相比于风之魔与格罗迦就显得渺小无比。因此，天灾的概念被提出：一种超越神灵的存在，一种生物本身的存在就足以对整个世界造成毁灭性的影响。"
