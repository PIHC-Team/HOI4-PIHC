l_simp_chinese:
	democratic:0 "自由思潮"
	democratic_noun:0 "自由思潮"
	democratic_desc:0 "自由思潮"
	democratic_drift:0 "自由思潮倾向"
	democratic_acceptance:0 "自由思潮外交接纳度"
	democratic_wiki_tooltip:0 "少数服从多数 —— 对于小马们来说似乎是非常朴实而自然的道理。天真无邪的小马们不需要依赖于什么复杂的体制，这也导致他们在过去很少思考”民主“这个朴素的概念，其下也隐藏着太多变数：选举领导还是议会？投票代表还是投票政策？多久选举一次？是否可以连任？选举权是否平等？选民们是否自由？...\n这些问题似乎都不是小马们需要考虑的，毕竟有个能包办一切的全能君主比什么都靠谱。但随着他们所生活的世界正在朝着一个他们不想要的方向疾速滑落，或许也该开始思考一下探索新制度的必要性了。\n\n'''自由思潮下的意识形态：'''"
	democratic_republic:0 "总统共和制"
	democratic_republic_desc:0 "总统共和制：\n民主投票选出的领导者负责处理国家事务。选出的领导者既是国家元首也是政府首脑。历史上，天角兽公主获得权力似乎是毋庸置疑的：天生强大的魔法，自然意味着主导地位。\n然而，在后天角时代，如何选择一名能够团结全国的领导者成为了一个问题。民主主义者认为，只有通过民主选举，才能选出最适合的领导者。在小马利亚的土地上，这一思想仍然存在着许多问题：每只独角兽、陆马、飞马应该拥有相同数量的选票和议员吗？其他种族呢？魔力强大的个体应该有更多的选票吗？总统，或者由于小马利亚的传统文化而被冠以其他名字的民选领导，可以连任吗？"
	democratic_democracy:0 "议会共和制"
	democratic_democracy_desc:0 "议会共和制：\n民主投票选出的若干议会成员共同负责处理国家事务。选出的国家领导者向议会负责。在小马利亚的历史上，曾存在过议会制度的雏形：例如小马国城市代表大会。但是由于天角兽在那个时代占据主导地位，类似的议会从未掌握过实权。\n直到终末之战后，天角兽公主的缺位给了各个地区的小马们获得实践民主权利的机会。同样的思潮也发生在小马利亚的其他种族中，天角兽的绝对统治权消失后，各个种族也不免开始怀疑君主或是一个唯一首脑的统治方式，在探索中发展出了类似议会制度的政治形式。"
	democratic_monarchy:0 "君主立宪制"
	democratic_monarchy_desc:0 "君主立宪制：\n在君主立宪制度下，国家的统治权由一个既有象征性职责的君主和一个规定权力分配的宪法共同分享。在历史上，小马国曾由塞拉斯蒂娅公主希望和露娜公主共同统治，她们既拥有强大的魔法能力，又具备领导才能。然而，后天角时代的过渡期引发了对中央集权的质疑。虽然民主理念比以往更受欢迎，但君主的观念仍然占据主导地位。\n君主立宪制度的出现则是传统与现代治理方式之间的一种妥协：君主仍然是团结和连续性的象征，而真正的权力则由议会或其他民主机构掌握。"
	democratic_oligarchy:0 "自由寡头制"
	democratic_oligarchy_desc:0 "自由寡头制：\n和一般的寡头政治一样，这类国家的最高权力被少数的寡头群体牢牢把控。尽管这些寡头之间可能会互相争权夺利，但这远不会撼动这坚不可摧的体系。而在某些地方，这类政权往往给自己包装上一层“民主”、“自由”的外衣，一些无关紧要的权力被授予大众，同时举行虚假的，受到操纵的选举。\n不同于寡头政治所强调的勤劳、服从、或是“为了公主”，自由寡头制度更强调个体的自由、平等和个体权利。可惜的是，这些口号大多是寡头间互相攻击时的工具，并只被他们享有。"
	democratic_tribe:0 "民粹主义"
	democratic_tribe_desc:0 "民粹主义：\n当多个个体出现矛盾的时候怎么办？在小马利亚的早期，回答这个问题的显然答案是吵一架，甚至决斗。不过自从风之魔向所有生物们展示了冲突的危险性后，小马们开始尝试寻找一种更加和平的解决办法。\n民粹主义既可以在现代的国家中找到，也可以在城邦、社群，甚至原始部落中找到：一个生物一票，多数决定。多数永远意味着正确，少数永远意味着错误，难道不是很自然吗？"
	democratic_freestate:0 "民主城邦"
	democratic_freestate_desc:0 "民主城邦：\n早在天角兽之前的时代 —— 当时的大地上还只存在一些松散的城邦 —— 就已经有一些独立城邦采取了一定的民主制度。大多数城邦的所谓“民主”都有着严格限制只允许贵族参与民主议政，大部分的平民依旧生活在专制甚至奴役中。不过随着友谊与谐律的思想传播，享有自由的群体也在逐渐扩大。在进入天角兽时代后，相当长的一段时间内，由于一个统一的中央政权存在，这些民主制度只能在文明地带的边缘地带存续。\n如今，已经很少有国家能符合传统的城邦定义了，取而代之的是在混乱的国际局势下形成的新兴城市。在中央政权瓦解后，各个地区开始抱团取暖。其中一些城市选择了民主制度，成为了现代的民主城邦。这些城市往往都发展成了庞大的都市圈，有些甚至能做到自成一个经济体系。但他们往往缺乏足够的军事力量自保，有时数个城邦会形成松散的联盟，而多数时候都只能选择依附甚至干脆融入一个更大的势力。"
	democratic_organization:0 "临时民主政府"
	democratic_organization_desc:0 "临时民主政府：\n有时，贸然在一个刚刚经历巨大动荡甚至是无政府地带实行完全的民主制是非常危险的，因为这很可能导致一些别有用心者利用尚未完善的制度漏洞而造成灾难。因此，民主的建立需要一个过程，就像种植一株植物一般。\n临时民主政府往往建立在废墟上，可能来自于一片战后的废土，也可能是一处革命的发源地。这一政府的目标是成立一个真正的民主政权，而现在所处的则是一个艰难的转型期。他们中的许多甚至不能称得上是一个政府，而更像是一个组织甚至有影响力的俱乐部。因此，政府的第一目标是维持自己的存在，不得不采取一定的管制措施，并小心翼翼地处理各个派别之间不断产生的冲突。当然，这一阶段终会结束，最理想的情况是一个民主且自由的新政权充满希望地建立起来。而最坏的情况则是来之不易的民主重新跌入混沌中去。"
	democratic_duchy:0 "民主领地"
	democratic_duchy_desc:0 "民主领地：\n民主的概念似乎与作为某个领主的封地相悖，但在某些情况下，这依然是可能的：如果这个领主对领地的事务似乎不怎么上心。\n小马利亚最典型的民主领地出现在小马利亚帝国的辖区内。尽管和煦光流加冕了所谓“女皇”，但经历了一场战争后，坎特洛特对小马利亚各地区的控制已经非常微弱。新生帝国内忧外患，反抗此起彼伏。和煦光流只能将权力下放，册封一批领主帮助自己统治小马利亚的广袤土地。而各个领地则享有一定的自治权，部分地区甚至可以实行一定程度上的民主制度：统治者如同民主国家的总统一般，可以由当地民众选举产生，同时在经济和军事方面都存在一定程度上的自主权。有些甚至直接获得了自治的承认。\n即使这些民主领地出现了“民选的公爵”这种奇怪的称谓，但必须注意的是，这些地方远远称不上真正的“民主”。坎特洛特依旧有着对当地包括选举结果在内的所有事务的否决权，帝国也能对当地的政治与经济施加相当大的影响。至于军事，更是被严格限制。在帝国刚刚建立之初，这些领地还比较兴盛，随着时间的推移，中央的集权在逐步加强，而这些民主领地也可能迎来在一次消亡..."
	democratic_authoritarianism:0 "威权自由主义"
	democratic_authoritarianism_desc:0 "威权自由主义：\n“自由是有边界的。绝对的自由，只会导致强者对弱者的剥削。” 这是威权自由主义者的信条。因此，相对于个体凭借自由意志做出的选择，他们更倾向于通过强制手段来保护个体的自由。在这种体制下，政府会对个体的行为进行严格的管制，以确保社会整体的自由最大化。例如，经济上反对垄断，文化上反对歧视，政治上反对官僚主义。\n不过，究竟谁能来定义“自由”？政府可以代表社会整体的“自由”吗？曾经这个问题是简单的，当被问及谁能成为“自由”的定义者时，他们总会回答：“比如露娜公主，她从来不像塞拉斯蒂娅那样管那么多事。” 无论这个答案能否说服异见者，如今这个答案已经不能再使用了，威权自由主义也不免陷入了自相矛盾的困境。"
	democratic_totalitarianism:0 "极权自由主义"
	democratic_totalitarianism_desc:0 "极权自由主义：\n“你无法强迫一只小马违背自己的意愿而快乐。但如果你强制给他们自由意志呢？如果你在他们心中安装一个单一的思想：‘从现在开始，你自己做决定，自己承担后果’？” 当极权自由主义者将他们对自由的解释强加于其他每一只小马时，有些小马可能会指责他们这么做恰恰违反了自由的基本原则。但他们从不争辩，因为拥有相反意见是自由的标志，他们非常乐于听到这些。当然，他们也有忽略这些意见的自由。\t\n不要误读极权自由主义为一种经过伪装的暴政，因为这个体制中没有暴君：军队、警察、官僚、资本家、领袖... 没有谁会免于怀疑。也不要将极权自由主义视为一种丛林社会，因为有一个强大的中央政府在监督着一切制造不自由的行为。\n如果你尝试理由这个体制获利，那么你是自由的，但你很可能会被抓住。如果你尝试反抗这个体制，那么你是自由的，但你很可能会被抓住。如果你尝试让自己不自由，你同样很可能会被抓住，让后在监狱里被迫接受自由。"
	democratic_utopia:0 "自由主义乌托邦"
	democratic_utopia_desc:0 "自由主义乌托邦：\n民主的实践在这里取得了空前的成功，以对个体权利、自由和法治的深刻承诺为标志。就像科幻小说中一样，社会获得了民主的所有优点，如自由、平等、多样性、繁荣、正义，避免了所有缺点，如低效、垄断和腐败。政府透明，经济繁荣，小马们幸福。没有小马知道他们是如何做到的，但在一个充满魔法和彩虹的国家，你觉得这还有什么奇怪的吗？"
	democratic_dystopia:0 "自由主义反乌托邦"
	democratic_dystopia_desc:0 "自由主义反乌托邦：\n民主的实践在这里失控了，在虚假的表象下隐藏着恐怖的现实。自由主义理念本身取得了成功，对个体权利的追求压倒了一切其他声音。很快，国家的概念被淡忘，每位公民活着的全部意义便是取悦自己，和其他独立、自主的个体。\n不同于安那其，自由主义反乌托邦尊重每个个体的权利。可惜的是，在精神世界获得无限自由后，物质世界却不会因此自然而然地变得更好：今天晚上吃什么，明天早上穿什么，它们该从哪里来，这些都是每个小马自己的事情。没有谁能为此负责，或者说，没有谁应该对任何事情负责，也没有谁应该因不同的理念互相攻伐 — 除了偶尔的被陶片放逐的“自由主义之敌”之外。"
	democratic_theocracy:0 "神权民主"
	democratic_theocracy_desc:0 "神权民主：\n对于一些奇怪的宗教信徒来说，民主不仅仅是一种政治制度，更是一种信仰。例如，一些小马相信，圣母劳伦创造了小马利亚，而她的意志应当是最高的法律。同时，他们认为，只有通过民主选举，才能让圣母的意志得以体现。在神话中，他们将圣母劳伦描述为一只天角兽的形象，是塞拉斯蒂娅与露娜公主的母亲，也是小马利亚的创造者。她当初剩下两位分别代表日月的公主统治小马利亚，正是因为她所遵从的平衡理念。\n当然，并非所有的神权民主主义者都信奉圣母劳伦，但无论他们心目中的神祇是谁，至少他们都相信“民主”概念本身。不同的方法，同样的目的，所以他们应该不会有太大的分歧，或者互相兵戎相见，对吧？... 额，对吧？"
	democratic_technocracy:0 "精英民主政治"
	democratic_technocracy_desc:0 "精英民主政治：\n精英民主政治选择继承来自塞拉斯蒂娅时期的优良传统（对于另一些小马来说，他们更愿意称之为“发扬和煦光流女皇的精神”）：魔力强大的个体将自然而然更有资格成为国家和军队的领袖，而更有知识的个体则自然而然成为政府的官员。虽然终末之战后，对于谁更适合取得权力的共识逐渐瓦解，但这并不意味着我们需要抛弃这一观念。只需要引入一些现代的元素，比如选举，就可以让小马利亚重新达成一致。\n精英民主政治强调只有有资格的个体才有参与选举的权利，包括选举和被选举的资格。有能力是获得被选举资格的基本要求，而获得资格之后... 争取民众支持的能力本身也是一种能力。"
	democratic_militarism:0 "民主输出者"
	democratic_militarism_desc:0 "民主输出者：\n就像暮光闪闪曾经认为谐律是一种优秀的理念应该被推向全世界一样，有些激进自由主义者认为“自由”也是需要被主动推广的理念。只不过，他们中的一些更加极端，认为仅仅通过和平手段是无法让那些习惯生活在公主、国王、贵族或是神灵统治下的种族接受自由的。当被问及这种行为是否违背了自由主义的基本原则时，他们总是会回答：“学习的过程总是痛苦的，但至少之后他们拥有自由的选择。如果他们选择了不自由，那说明还没有学习好。”"
	democratic_dogmatism:0 "教条自由主义"
	democratic_dogmatism_desc:0 "教条自由主义：\n“什么是自由？” 这是困扰着自由主义者的一个常见问题，不过有些经验丰富的小马利亚图书管理员也许会尝试找到一些权威的答案。他们总能翻出几本破旧的古书，声称其来自两姐妹的某个地下室。这些书中写着先祖们的智慧，他们详细定义了什么是“自由”以及如何实现“自由”。这些书记的年代甚至可以上溯到三族盟约时期，所以它们所说的一定是绝对真理。\n如果偷偷尝试去修改这些古书中的内容，那么成功后你很有可能会得到他们的支持，只不过这些老学者往往对古书的内容倒背如流，所以你很难做到这一点。"
	democratic_federal:0 "民主联邦"
	democratic_federal_desc:0 "民主联邦：\n相比于一个统一的政治实体，多个不同的国家和不同种族可能会选择联合在一起，以共同面对外部威胁，共同发展经济，共同解决问题。这种联邦制度往往会保留各个成员国的自治权，但在一些重要问题上，联邦政府会拥有最终决定权。这种体制下，每个成员国都会派出代表参与联邦政府的决策，而联邦政府则会负责维护整个联邦的利益。\n安及是民主联邦最典型的例子，自从古安及的历代王朝消亡后，安及就重新进入了城邦时代。而单个城邦很难在沙漠中生存，因此不同城邦在保留自治权的基础上组成了安及同盟大会，以协调城邦之间的事务。有时，一些城邦会对此大会的决定感到不满，威胁退出同盟，但多数时候，在没有外部干预的前提下，一个折中方案总会被找到。"
	democratic_equatism:0 "博爱主义"
	democratic_equatism_desc:0 "博爱主义：\n作为自由主义的另一支派别，他们不仅关注自由，还希望平衡自由与平等。这种意识形态强调平等和所有公民的福利的重要性，政府为所有公民提供医疗、教育和社会保障等社会服务。一方面，他们强调通过努力减小贫富差距；另一方面，他们也强调对个体的尊重和自由，以及民主程序的必要性。毫无疑问的是，博爱主义绝不会受到主张革命的平等派系的欢迎，后者经常批评前者的软弱与妥协，抛弃了阶级斗争的纲领，是对平等主义完完全全的背叛。但博爱主义依旧在许多地方得到了广泛的支持，尤其是在那些本就较为稳定，组织架构运转良好的国家里。\n小马们是天真的种族，当尝到博爱主义带来的甜头后，他们很快就会愿意为之真心付出，尽一切努力互帮互助；但同时，他们也是容易欺骗的种族，三言两语就可能会摧毁一套仅仅基于“互信”或“奉献”理念而运行的制度 —— 这在小马利亚的历史上并不少见。"
	democratic_harmonicism:0 "谐律自由主义"
	democratic_harmonicism_desc:0 "谐律自由主义：\n对于小马利亚来说，“自由主义”这个词是如此的陌生。这一新奇的意识形态并非本土产生，而是来自遥远的另一个次元。在那个叫“地球”的陌生地方，有那么一群“人类”信奉着维护个人思想自由，限制政府对权力的运用，保证生命权等等。另一方面，产生自小马利亚本土的谐律主义主张一个社会中的各个个体应当发扬谐律精神，以达到社会和谐的目的。与博爱主义不同，谐律理念并不强调平等，而强调美德：诚实，善良，欢笑，慷慨，忠诚，以及最重要的、那些使得谐律理念在小马利亚世界有着如此特殊的地位的东西：那些魔法彩虹激光是真实存在的。不过，不同于那些以谐律为首要目标的思潮，谐律自由主义非常强调达成谐律的方式。他们并不相信小马们可以轻而易举地实现谐律主义，曾经失败的M6就是很好的例子。相比于立即进入一个乌托邦，更现实的策略是在公平制度保障下缓慢向谐律社会迈进。\n余晖烁烁也在人类世界长久的耳熏目染之下，接受了“自由主义”理念：民主程序、私有财产、言论自由、自由市场... 她认为自由主义所推崇的理念与小马们长久以来的谐律思想不谋而合，甚至更加进步与高效。在来到风暴岛并初步取得了对当地的控制之后，余晖便迫不及待地在这里开展起自己所构想的理想社会来。但是，余晖烁烁只是个普通的，未成年的学生。因此自由谐律主义并没有完善的理论体系支撑，一切有关它的探讨只停留在几段聊天记录里。可以说，这一理论从诞生起就注定漏洞百出，远达不到可以用来治国的阶段。而余晖在风暴岛上的碰壁也印证了这一点。无论如何，这一思想总归得到了传播，并且开始在风暴岛以外的地方流行开来，或许未来，这一理念能被完善并得到广泛接受。但现在，它将在这陌生土地上的残酷斗争中经受考验。"
