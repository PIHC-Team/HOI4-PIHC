l_simp_chinese:
	old_order_welcome_doc_candidate:0 "血腥的新元年已经开始，在坎特洛特皇城周围，在繁忙的农场，在天空城。小马们看到了三巨头们建立了铁与血的新秩序。在终末之战的时候，其他种族并没有来帮助暮光闪闪，三巨头轻松地击败了M6等旧帝国成员，汲取了他们的魔法。随着《坎特洛特协定》的签署，世界的基本秩序已经建立。三巨头都得到了土地，他们的国家也变成了最为强大的。虽说世界秩序基本安定，但在看不见的地方，战争在每秒的爆发，小马们每秒都在死亡。\n用铁链和集权铸造的新秩序，能否通过时代的考验？"
	old_order_fancy_pants_desc:0 "旧日的残影\n如果你问新生的王朝有没有旧帝国时期的官员，是肯定有的。他们一般穿着破旧的衣裳，穿梭在权力的机关当中。和煦光流王朝没有一套熟练执政的班子，女皇便想寻找旧帝国时期的官员，渴望和他们建立合作，这一代表就是花花短裤，是现代贵族当中威望最高的，并且说服旧政府班子加入新政府的政治体系中，建立民主派。花花短裤也想让帝国长存，不过他的缺点是"
	old_order_svengallop_desc:0 "白手套\n在历史上，小马利亚千年来未曾变更过的制度，将要在1003年进行改变。和煦光流王朝影响大的官僚也挺多，但是像斯文盖略那样的却并不多见，斯文盖略外号“白手套”。正如他的外号一样，执行能力强，专干“脏活累活”。他原本是拉拉的经纪马，后来因为各种原因被辞退。而在新元年后，他被女皇赏识，又重新回到他的老岗位。但不同的是他管理的是这个国家，斯文盖略被女皇扶持，与民主派进行抗衡。他的政治集团与女皇深深绑定，成为了女皇的白手套。而斯文盖略也很享受这个生活。享受着随便判处别人死刑的快感。"
