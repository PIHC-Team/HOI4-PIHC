l_english:
	transcendence:0 "Transcendence"
	transcendence_noun:0 "Transcendence"
	transcendence_desc:0 "Transcendence ideology"
	transcendence_drift:0 "Transcendence drift"
	transcendence_acceptance:0 "Transcendence acceptance"
	transcendence_wiki_tooltip:0 "Ideologies or political systems are nothing more than inefficient tools for ordinaries.\nFor spirits, deities, or those incomprehensible existences, they never need these useless systems.\nTheir will is the rule itself.\n\n'''Ideologies under Transcendence Ethos:'''"
	transcendence_spirit:0 "Magic Creatures"
	transcendence_spirit_desc:0 "Magic Creatures:\nThey are creatures composed of magic, generally acting alone and not forming a social structure. They have strange magic that is magical but not particularly powerful, such as Ursa Major, Bugbears, Cockatrice, Cerberus, etc. Indeed, there will be pony scholars who question this concept: any creature has magic in its body and can be considered a magic creature. But in terms of daily life, this definition is clear enough."
	transcendence_deity:0 "Deity"
	transcendence_deity_desc:0 "Deity:\nDeity usually refers to magic creatures with more powerful powers. The magic academic community generally believes that the Black Crystal King can be regarded as the threshold of the deity: only creatures with the same or higher level of magic can be called deities. Today, the Wind Demon is undoubtedly a deity, as is the legendary Groja. Whether the god of harmony exists, scholars are still debating. The controversy of the deity of the old disorder is not great, but whether the deity of the current disorder should still be called a deity, scholars are mostly skeptical. Creatures such as the Evil Cocoon Queen and the Warm Light Flow are still not enough to meet the standards of deities. Of course, for scholars, different academic views are normal. The only thing they hate is being interrupted by a group of religious or even cultists when discussing the standards of deities."
	transcendence_hive:0 "Hive Mind"
	transcendence_hive_desc:0 "Hive Mind:\nA powerful central host individual controls all individuals, and individual self-consciousness is suppressed and completely subject to the central host individual’s scheduling. The entire country operates around the central host like a machine. Many ponies do not understand the advantages of this social structure. Compared with the emergence and the Gestalt Consciousness, the Hive Mind seems to rely too much on the central host. Whether it is information transmission or computing power, this is not a very good link structure. But this is just as the villains in movies and novels often like to do: a powerful machine always sets a weak point that will collapse when touched, a self-destruct switch, so that our protagonist can save the world in the last second when the evil forces are about to win."
	transcendence_gestalt:0 "Gestalt Consciousness"
	transcendence_gestalt_desc:0 "Gestalt Consciousness:\nAchieved complete unity of spirit, individual consciousness no longer exists. The entire country only exists as one individual, and each specific body is only an organ like a finger. Different from the emergence, the existence of the Gestalt Consciousness is objective: It may be a preserved consciousness, a piece of code, or an incarnation of a certain concept. Harmonic scholars believe that the control of the Deity of Harmony over the Tree of Harmony, the Treehouse of Harmony, and the Friendship Map is the embodiment of this Gestalt Consciousness."
	transcendence_crisis:0 "Crisis"
	transcendence_crisis_desc:0 "Crisis:\nEven deities are not uncommon in the world of Equestria, and there are differences between deities. Although the Black Crystal King is also a powerful deity, it is insignificant compared to the Wind Demon and Groja. Therefore, the concept of crisis is proposed: an existence beyond the deity, a creature’s existence is enough to cause catastrophic effects on the entire world."
