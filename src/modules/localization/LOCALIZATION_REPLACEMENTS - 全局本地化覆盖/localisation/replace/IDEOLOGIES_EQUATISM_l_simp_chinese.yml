l_simp_chinese:
	equatism:0 "平等思潮"
	equatism_noun:0 "平等思潮"
	equatism_desc:0 "平等思潮"
	equatism_drift:0 "平等思潮倾向"
	equatism_acceptance:0 "平等思潮外交接纳度"
	equatism_wiki_tooltip:0 "无论生活在一个多么开明的环境里，我们都必须承认小马利亚世界生来就存在着不平等 —— 有的小马能操控魔法，有的小马能飞，有的小马力大无穷，有的小马生来倒霉，还有的小马甚至得不到自己的可爱标志... 至于不同种族间的不平等，那更是一个充满争议以至于任何场合都要极力避免谈论的问题。\n但我们也必须知道，所有的这一切都不是特权或者被歧视的借口 —— 每一匹小马，以及任何生物都有着解放自己和平等发展的权力！全世界被压迫着的生物终有一日会团结起来，砸碎旧时代的锁链！\n\n'''平等思潮下的意识形态：'''"
	equatism_republic:0 "社会主义"
	equatism_republic_desc:0 "社会主义：\n社会主义强调生产资料，尤其是魔法的公有制，在实践中通常依靠一党制政府对经济进行干预、发展国营企业、实行计划经济和集体生产等方式，以确保资源的公平分配。在终末之战后，随着气候逐渐变冷，以及提雷克对于小马利亚魔法的掠夺，各个地区都开始出现魔法短缺的现象，农业生产与生活都受到了极大的影响。这期间，一些魔法平等化团体开始在小马利亚各地兴起，他们提议由一个中央委员会收集所有小马们的魔法统一分配，以确保每一位小马都能获得足够的魔法来维持生活、并且国家可以集中仅剩不多的魔法力量来完成一些重要的大规模建设项目。\n初期的平等化团体与平等主义政党思路非常粗糙，往往伴随着许多不切实际的魔法收缴方案，因此也没有得到广泛的支持。吸取失败的教训，一些平等主义政党开始强调一党制政府，和优先对魔法以外容易重分配的其他资源进行公有化，例如粮食与钢铁。这些经过改良的平等化举措现在被归类为“社会主义”，逐渐拥有了更高的知名度。而随着余晖烁烁的到来，来自人类世界的出版物与思想传播，“社会主义”有望进一步融合、发展。"
	equatism_democracy:0 "民主社会主义"
	equatism_democracy_desc:0 "民主社会主义：\n民主社会主义通常是由一个信奉平等思潮的政党或组织通过和平民主的方式取得执政地位，然后通过立法和行政手段实现平等主义的目标。\n历史上，天角兽公主们拥有着巨大的魔法和统治权力，确保着整个国土的稳定与和谐。然而，随着小马社会的逐渐工业化，以及民主思想的出现，关于财富、资源和机会的分配问题逐渐浮出水面。民主社会主义提倡实行一种全新的制度，重要工业由社会共同拥有和监管，为了集体利益，同时保留个体自由。重点转向确保教育、医疗保健和其他基本服务的普遍获得，无论一个小马的魔法能力强弱或种族是什么。诚然，这种历史上从未有过的制度，对于小马们来说是一次巨大的变革，但是甚至连“民主”的概念相对于传统君主制，本身都已经是一大步了，再多多迈出一小步又有何妨？"
	equatism_monarchy:0 "君主立宪社会主义"
	equatism_monarchy_desc:0 "君主立宪社会主义：\n一个国家提倡平等的同时尊敬一名至高无上的君主听上去是一种自相矛盾，但是任何理念的提出不得不考虑到现实的存在。在终末之战后的水晶帝国，政党如雨后春笋一般涌现，其中不少选择投入平等主义思潮的怀抱。众多平等主义政党中最具有凝聚力的政党便是音韵主义政党，他们认为终有一日水晶帝国将恢复音韵公主的统治，而音韵公主将会在帝国范围内推行平等主义。由于水晶帝国民众对皇室的好感，加上平等主义对于普通水晶小马利益的关怀，音韵主义政党很快就在水晶帝国具有了不小的影响力。\n不幸的是，此时正值和煦光流的加冕仪式前后，小马利亚帝国精神紧绷，帝国警察与官僚们时时刻刻注意着一切可能得不稳定因素 —— 殖民地水晶帝国的音韵主义政党很快成为了下一个清楚目标。在小马利亚帝国强迫水晶帝国理事会做出禁止音韵主义政党的立法决定后，许多音韵主义者不得不转投其他平等主义政党以自保。这些平等主义者不再强调某一位具体的君主，而只是在宣传平等主义思想时表达对皇室的尊重以换取民众的支持，这促成了君主立宪社会主义势力的崛起。时至今日，水晶帝国的众多平等主义政党已经整合成了红色水晶，君主立宪社会主义势力依然是红色水晶中最具影响力的派系。他们主张在水晶帝国继续保持立宪君主制的同时，以红色水晶一党制取代现有的水晶帝国理事会制度，以社会主义宪法取代现有的水晶帝国宪法，最终国家团结在立宪君主的名义下，实现平等主义的目标。"
	equatism_oligarchy:0 "国家资本主义"
	equatism_oligarchy_desc:0 "国家资本主义：\n尽管国家资本主义者声称自己所支持的政策大多与平等主义者类似，例如支持国营企业、对经济的干预调控、一定程度上的社会福利政策、甚至是中央政府对魔法的有限征收，但大部分平等主义派系都拒绝承认国家资本主义属于平等主义思潮的一部分。来自平等主义的批评者认为，国家资本主义者只是在表面上支持平等主义，实际上却是在维护一种新的特权阶层，这种特权阶层由国家资本主义者自己组成，他们通过国家的力量控制着整个社会的资源。在这里，国有化的目的不再是为了大众的平等服务，而只是打着平等的旗号为官僚中的少数寡头服务。虽然国家资本主义者对这种观点不予置评，但令他们最感到疑惑的是，专制主义者、自由主义者甚至是一些谐律主义者都会将“国家资本主义”当做一句用来攻击平等主义的脏话。"
	equatism_tribe:0 "部落公社"
	equatism_tribe_desc:0 "部落公社：\n在信奉原始平等主义思潮的部落中，部落成员会合作完成种植、采集与狩猎，随后将所得的粮食统一分配，优先供给部落中的小孩、青壮年以及待产的母亲。虽然他们没有魔法研究，不懂如何对魔法进行均分；他们没有工业化；他们也没有私有财产的概念。这种原始的部落公社可以说是平等主义的最原始形态，他们的生活方式甚至与一些谐律主义者的理想社会也有着异曲同工之处。不过，他们和小马利亚的其他地方又有多少区别呢？整个小马利亚的绝大部分地区，在数千年间都几乎没有发生任何变化，他们如今看似的“原始”生活方式，也不过是和其他地区一样继承数千年的传统而已。"
	equatism_freestate:0 "社会主义公社"
	equatism_freestate_desc:0 "社会主义公社：\n在终末之战后，随着气候逐渐变冷，以及提雷克对于小马利亚魔法的掠夺，各个地区都开始出现魔法短缺的现象，农业生产与生活都受到了极大的影响。这期间，一些魔法平等化团体开始在小马利亚各地兴起，他们提议由一个中央委员会收集所有小马们的魔法统一分配，以确保每一位小马都能获得足够的魔法来维持生活、并且国家可以集中仅剩不多的魔法力量来完成一些重要的大规模建设项目。\n多数这样的公社都失败了，要么被一个国家征服或统一，要么因为缺乏资源而逐渐衰败，要么因为内部矛盾而分裂。最主要的原因是，初期的平等化团体与平等主义政党思路非常粗糙，往往伴随着许多不切实际的魔法收缴方案，因此也没有得到广泛的支持。然而，随着数年的时间过去小马利亚正在完成工业化，除去魔法以外，更多的资源和机会的分配问题被摆上了台面。也许，在改进社会主义公社的设计理念后，这种公社将有机会在小马利亚的某个地方重新出现。"
	equatism_organization:0 "革命政权"
	equatism_organization_desc:0 "革命政权：\n一群或者不满于君主、或者不满于独裁者、或者不满于外国侵略者、或者不满于资本家的底层民众刚刚联合起来推翻了旧政权，建立了新兴的革命政权。接下来他们要去向何处？是组织独立的公社，还是建立一个全新的平等主义共和国？又或者是乘胜追击解放更多的地区，消灭更多的压迫者？眼前，他们所面对的是无数的选择，而他们的首要任务是要确保新生的脆弱政权的稳固。在小马利亚建立一个平等主义革命政权本身就是一种巨大的挑战，环顾四周，他们将面对各种反动势力的围困，而他们的内部也可能会因为权力的争夺，甚至仅仅是不同的理念而分崩离析。但无论火焰最终燃起还是熄灭，在寒风中，他们都将为历史留下一段温暖的记忆。"
	equatism_duchy:0 "解放区"
	equatism_duchy_desc:0 "解放区：\n在一个外部平等主义政权的帮助下，这里的压迫者政权刚刚被摧毁，这里的公民获得了自由。随后，解放者的意识形态快速涌入，解放区成为了平等主义思想的教育基地。这里的公民，无论自愿还是被强制，终于开始放弃寻找一个新的君主、领袖、民主议会或是神祇的想法，转而关心起身边的同胞。有的解放区以公社形式存在，有的直接成为了解放者国家的一部分，有的则尚未确定自己未来的道路。但就像刚从露娜公主的美梦中醒来小马，给他们多5分钟的恍惚机会吧，清醒总有一天会到来。"
	equatism_authoritarianism:0 "威权平等主义"
	equatism_authoritarianism_desc:0 "威权平等主义：\n威权平等主义者尝尝热衷于批判那些社会主义同僚过于温和，也许他们批评的没错：小马利亚无数的社会主义或温和平等主义政权，没有哪一个取得了成功。纵观小马利亚的历史，看到的只有君主、反派、野心家、独裁者，与那些默不作声的民众。威权平等主义者认为，只有通过强制力，才能实现平等。他们中的有些选择诉诸于一个中心领袖，也有些选择一个一党制专政政府或者一个专政委员会，但他们的目标都是一样的：让反动派噤声。在威权平等主义的指导下，国家将会不受干扰地建设平等主义的乌托邦，从国有化，到计划经济，到完全可控的集体化生产；从强制财产重分配，到强制魔法收缴，到完全消除私有化；从平等主义思想教育，到平等主义劳动改造，再到自觉的平等主义学习；从社会教育，到社会医疗，到社会保障。这个国家需要的只是时间。"
	equatism_totalitarianism:0 "平等镇主义"
	equatism_totalitarianism_desc:0 "平等镇主义：\n对于极权平等主义的拥簇者来说，他们最大的困难是尝试解释为什么首先提出极权平等主义的星光熠熠如今已经不再相信这一思想了。他们认为是M6的洗脑改变了星光熠熠，使得她不再相信自己曾经正确的理想。我们并不确定，这些极权平等主义者是否得知，星光熠熠在统治平等镇期间偷偷保留了自己的可爱标志，成为镇上唯一的特权阶级。总之，这些极权平等主义者并不会再过度关注星光熠熠了。他们的目标是继续推行平等主义，以一个更加强大的领导者为首，以更加严格的法律为基础，以更加严厉的惩罚为方法，以更严密的监视为保证。他们中也许有少数打着平等旗号的篡权者，但是更多发自真心相信自己将成为英明的平等主义领袖，或者已经在拥护某一位英明的平等主义领袖了。“不依靠支配性的强制力，是不可能实现平等的。” —— 这是平等镇主义者的核心信仰。"
	equatism_utopia:0 "理想共产主义"
	equatism_utopia_desc:0 "理想共产主义：\n平等主义的实践在这里取得了空前的成功，他们实现了他们设想中的场景：一个没有国家、没有阶级、没有私有财产的社会。在这里，物质丰富、魔法富足、友谊共享，小马们各取所需，各尽所能。极大发展的生产力保障了每一位小马的生活水平，而平等主义的思想则保障了每一位小马的尊严。不仅于此，他们着眼于国际：一个理想共产主义社会的图景正在逐步变为现实，他们的宣传吸引着世界各地的平等主义者和那些尚处在饥饿和压迫之中的生物们。他们的目标是将这种理想共产主义的社会扩展到整个整个世界。"
	equatism_dystopia:0 "红色恐怖"
	equatism_dystopia_desc:0 "红色恐怖：\n平等主义的实践在这里失控了，在虚假的表象下隐藏着恐怖的现实。对于反动派的关注改过了对国家自身建设的关注，对于敌人的追捕改过了对公民的保障，对于异议者的镇压改过了对平等主义的宣传。每天，无数的“平等主义的叛徒”被送进审讯室、送进劳改营、送上断头台，或是成为了“国家魔法库”的原料。一些平等主义者中的理想主义者似乎注意到了这个国家有所不太对劲，但是要么不敢说出来，要么就已经在“国家魔法库”中无法发声了。至于当初创立这个国家的那些平等主义者，他们是否还在管理这个国家都已经不得而知了。生活并没有一天天变好，但是至少确实如他们当初承诺一般，一天天变得平等。死亡是最平等的，从上到下，没有谁能够逃脱平等主义的审判。"
	equatism_theocracy:0 "解放神学"
	equatism_theocracy_desc:0 "解放神学：\n虽然一些激进的谐律教徒会将解放神学视作扭曲谐律意志的异端，但多数谐律主义者还是愿意接纳这些宗教徒中的平等主义者。解放神学认为谐律之树、谐律树屋和友谊地图所提倡的谐律主义中，已经包含了平等的思想：和谐之元的力量会消灭尝试成为特权阶级的反派，谐律树屋提倡着跨种族的平等友谊，而友谊地图让小马利亚派出使者去摧毁各个地区的专制独裁者，以及类似于洛马基的资本主义利益集团。因此，“如果谐律之神存在，那么祂一定是一位平等主义者” —— 这是解放神学的核心信仰。"
	equatism_technocracy:0 "远视主义"
	equatism_technocracy_desc:0 "远视主义：\n许多自由主义者会批判平等主义是一种低效的社会生产模式：魔法不该被集中和公平分配，而应该属于那些最优天赋的个体；同样，财富也应该属于那些最有能力赚钱的个体，这意味着一个自由市场的筛选。但是至少，自由主义者不敢使用同样的论调批判远视主义：在远视主义的理想国家中，整个国家都团结在一起，将资源集中用于科学和魔法技术的发展。他们将取得比任何自称有天赋的个体更大的进步，而他们进步也不仅仅是造福于那些有天赋的个体，而是造福于整个国家的每一位公民。\n然而，即使自由主义者较少从效率角度尝试批评远视主义理念，远视主义受到更多的批评来自于同为平等主义阵营的其他派系：他们认为远视主义过于强调科技和魔法的发展，而忽视了平等主义的核心理念。在他们看来，远视主义的理想国家是一个冷酷的机器，而不是一个温暖的家园。另外，实践中，又有谁能够指明国家资源倾斜的方向呢？塞拉斯蒂娅执政千年，将小马利亚的稳定全部押注在了友谊上，最终都没能取得成功，凭什么一个平庸的远视主义领袖能预测最有前景的科学技术与魔法的未来呢？即使是曾经同时擅长统治与研究的暮光闪闪，也很难说能够资格成为一个远视主义领袖。"
	equatism_militarism:0 "战时社会主义"
	equatism_militarism_desc:0 "战时社会主义：\n社会主义综合考虑全体公民的利益，但在战争时期，全体公民都不得不做出一些小小的牺牲，来确保政权的稳定与国家的安全。即使是最温和的社会主义政权，在战争期间也不得不采取一些相对强硬的政策，例如魔法的收集、资源的征用、义务兵役、军队接管政权、计划生产、新闻管制、举报制度等等。这些政策在战争结束后也许会被废除，但有时候没有谁可以预测战争的结果，也许这些政策会不幸成为永久的。"
	equatism_dogmatism:0 "极端平均主义"
	equatism_dogmatism_desc:0 "极端平均主义：\n极端平均主义拒绝承认其他的平等主义派系的合法性：如果不是所有生物都拥有完全相同的权利、完全相同的资源、完全相同的魔法、完全相同的财富、完全相同的机遇、完全相同的教育，那怎么能算“平等”呢？极端平均主义者采用一种端水的方式，永远将社会资源倾斜到整个社会的最弱势群体，直到所有的小马都拥有完全相同的一切。他们认为，只有这样，社会才能真正实现平等，只有这样，社会才能真正实现和谐。只不过，到目前为止，还没有任何一个平均主义政策达到它理想中的目标。更重要的是，对于其他国家来说呢？外国公民也应该与这里的公民保持相同的平均水平吗？"
	equatism_federal:0 "国际主义"
	equatism_federal_desc:0 "国际主义：\n国际主义者不仅在乎在自己的国家或种族内实行平等主义政策，他们还认为自己肩负着解放整个小马利亚世界的任务：小马、幻形灵、狮鹫等所有种族的社会底层劳动者应该团结起来，一同消灭那些反派、独裁者、资本家与怪物。然而，美好的理想总是在现实中饱受煎熬：如何说服本国的居民，在自己的生存与幸福还在危险的情况下，去关心其他国家的居民呢？如何说服其他国家的居民，去行动起来推翻他们的压迫者呢？如何说服其他国家的领导者，去接受自己的平等主义政策呢？国际主义者们一直在寻找答案，但至今为止，他们还没有找到一个能够让所有国家都接受的答案。"
