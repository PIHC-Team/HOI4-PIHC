l_english:
	corporation:0 "Commercialism"
	corporation_noun:0 "Commercialism"
	corporation_desc:0 "Commercialism"
	corporation_drift:0 "Commercialism drift"
	corporation_acceptance:0 "Commercialism acceptance"
	corporation_wiki_tooltip:0 "''“Have you ever thought of anything other than money?”''\n''“No, why?”''\n\n'''Ideologies under Commercialism Ethos:'''"
	corporation_republic:0 "Megacorp"
	corporation_republic_desc:0 "Megacorp:\nIn megacorp society, efficiency is paramount. A huge business group has integrated all aspects of this country, including the government, into their business. However, while profit is the primary consideration of the megacorp, it is not their only consideration: benefiting all employees and all customer is their slogan, allowing every employee to enjoy the benefits of the company’s stock price rise is their best way to stimulate employee enthusiasm. Good with low prices and high quality, not only benefit the residents of the country, but also benefit the residents of other countries. Admittedly, with the monopoly of the megacorp, market competition has decreased and the gap between rich and poor has increased, but the megacorp promises that these will be well-controlled. At least for now, they have been kepting their promises, at least barely."
	corporation_democracy:0 "Merchantilism"
	corporation_democracy_desc:0 "Merchantilism:\nThis country has almost become a huge exporter, almost every citizen in the country is engaged in foreign trade and high-end manufacturing, and agriculture and low-end industry have been compressed to a minimum. Trade surplus is the lifeline of this country, and the government does almost nothing except guaranteeing the lives of residents and free markets: they are not interested in international relations, climate change, ideology and other issues, and so are every citizen. Countless small and medium-sized enterprises are thriving in this country, and the status quo of the huge gap between rich and poor is diluted by the desire for the future, and the confidence of the citizens in the future is the greatest wealth of this country. As for the issue of war and turbulent international situation... they will only choose to turn the thousands of small and medium-sized enterprises into thousands of arms dealers."
	corporation_monarchy:0 "Commercial Imperium"
	corporation_monarchy_desc:0 "Commercial Imperium:\nAs the size of the company continues to expand, the top of the company is no longer satisfied with success within the country. In order to open up a larger international market, they choose to use the political and military power of their own country to knock on the doors of those ignorant countries. Soon, there are only two identities left in this country: company employees and non-company employees. Company employees enjoy unparalleled benefits, reasonable working hours and wages, and even dividends from the company’s stock; while non-company employees, including the lower class, aliens, and those colonies, can only face the high prices of monopolized goods in the market under the oppression of the company. The gap between rich and poor within the company is narrowing - because the poor do not belong to the company."
	corporation_oligarchy:0 "Commercial Oligarchy"
	corporation_oligarchy_desc:0 "Commercial Oligarchy:\nIf the megacorp claims to benefit both employees and customers, consumerism benefits customers, and the commercial imperium benefits employees, then the commercial oligarchy does not benefit any of them: here, all profits will eventually flow to the top of the company. Except for a few executives, the employees, producers, and consumers of the entire country are struggling in extreme poverty. If there is any market competition, or the intervention of external regimes, this business model that produces inferior but expensive goods while squeezing employees will quickly collapse. However, the maintainers of this system will not let this happen: they will use all means to maintain this unfair order, including the suppression and elimination of dissidents."
	corporation_tribe:0 "Mafia State"
	corporation_tribe_desc:0 "Mafia State:\nAll the ways to obtain profits through legal operations seem to have been fully explored, and to obtain higher profits, you can only choose to take more risks. Controlled goods, black market arms, addictive drugs, and even slave trade, the higher the risk, the higher the profit. For these excess profits, operators will have to evade the police, bribe officials, and engage in unlimited competition with their peers. But some companies seem to have found a special way to surpass all this: they have infiltrated this country, the army, the police, the government, the courts, and even the head of state are all under their control, or the leaders of the company themselves. Finally, they have obtained a zero-risk, high-profit business model, but this model is a disaster for the other residents of this country, and even for its neighboring countries."
	corporation_freestate:0 "Family Corp"
	corporation_freestate_desc:0 "Family Corp:\nIn the Equestria world, family and friendship are important connections, which are often more effective than laws and institutions. The influence of the Apple family and the Pie family has spread throughout the Equestria world, and more families such as the Pear family, the Cherry family, and the Rich family are trying to catch up with them. In contrast to commercial achievements and fame, the most successful place of the Pie family is to elevate the family business to the national level: they have obtained the highest decision-making power of the Rock Farm Autonomous Region, and the residents of the entire Rock Farm rely on the protection of the Pie family and make a living from working for the Pie family. Fortunately, the Pie family is willing to accept refugees and share the family wealth with poor ponies, and their family business is the most positive representative of Equestria family businesses. However, it is not possible to rely solely on the charity of all family businesses, as most of them will not be like the Pie family."
	corporation_organization:0 "Consumerism"
	corporation_organization_desc:0 "Consumerism:\nComparing to the usual commercial countries that hope to accumulate as much wealth as possible, a consumerism country hopes to have no wealth accumulation at all: their goal is to empty the last coin from the pockets of the citizens and the national treasury, and keep everything in circulation. A variety of goods are invented and sold at the most appropriate prices. So, what is the price? Debt. Employees are exploited to the extreme, to the extent that their wages are not enough to sustain their lives, but at the same time they cannot stop consuming, and almost all citizens are burdened with huge debts. The economic system of this consumerism country is so fragile that any slight economic turmoil will lead to the collapse of the entire country. However, close your eyes, continue to dance, as long as the music is still playing, everything is still beautiful. When the balloon explodes and the party ends, seize the last chance to drink a few cups of cider, and then forget everything in cigars and fireworks."
	corporation_duchy:0 "Economic Zone"
	corporation_duchy_desc:0 "Economic Zone:\nHere, efficiency and economy are still the top priority, but only for this region. As an economic zone, the local economic development must contribute to their suzerain country. Companies here enjoy the protection and trade encouragement policies of the suzerain country, and in exchange, they have to transfer a large part of the profits for transfer payments, or often lose large orders due to the intervention of the suzerain country."
	corporation_utopia:0 "Brave New World"
	corporation_utopia_desc:0 "Brave New World:\nHere, the practice of commercialism has achieved unprecedented success, as the company’s new generation of products - “Miracle Curative Tonic” is launched, the residents of this country finally find their true happiness. Taking the “Miracle Curative Tonic”, forget all worries and pains, eliminate hunger and fatigue, and focus on producing more products for the company, more “Miracle Curative Tonic”s. In this way, employees can get higher wages, have more savings, and buy more “Miracle Curative Tonic”s. Admittedly, this tonic is addictive, but it is absolutely harmless, and the price is so low that even the poorest employees can afford to enjoy it every day. The residents of this country are all enjoying this brave new world, and their sense of happiness is always at its highest. The company has achieved a miracle that has never been done in Equestria history: all citizens are enjoying eternal happiness at all times."
	corporation_dystopia:0 "Cyberpunk"
	corporation_dystopia_desc:0 "Cyberpunk:\nHere, the practice of democracy has gotten out of control, and under the false appearance hides a terrifying reality. The country, class, society, and system have gradually disappeared, but what has been replaced is not equality, but the company that have everything, the one and only one company. The company’s advertising has penetrated into the spirit and culture of the entire country, every citizen and every inch of their land, every grain of rice they eat, every breath of air they breathe, and every second of their time, are all the property of the company. Concepts such as “freedom” and “equality” are everywhere - they are put on the shelves for sale, of course, not the ownership of these rights, but only the temporary rental right to use them. The debt of every resident has been borne for hundreds of years, and their descendants will continue to bear these debts and serve the company for free. Spiritual drugs, mechanical police, and automated magic devices maintain the stability of this order, ensuring that no citizen dares to default on the company’s debt. Meanwhile, are the top executives of the company enjoying all this? Not sure, no resident has ever seen them."
	corporation_theocracy:0 "Theocratic Corp"
	corporation_theocracy_desc:0 "Theocratic Corp:\n“Brand loyalty” is a very important indicator for commercial companies, and in the society of the theocratic corp, this indicator has been raised to a new height. Buying the company’s goods is no longer based on better quality or lower prices, but on the fanaticism of the company’s brand itself, or the worship of the company’s leaders. The middle-level employees of the company have become the messengers of the gods, representing the supreme god to bring sacred goods to the residents of the country. The lower-level employees of the company promote in various shopping malls that have been transformed into churches, leading customers to recite the company’s business philosophy and propaganda slogans. From time to time, the top executives of the company will appear on TV to convey the company’s divine mission to the residents of the country and consolidate their loyalty to the company. Who buys the most goods is what every citizen cares about; “Monthly Best Customer” is the supreme honor of this country. Have any questions about the quality of the company’s products? Please rest assured, the company’s customer service will come to your home to answer your questions."
	corporation_technocracy:0 "High-tech Corp"
	corporation_technocracy_desc:0 "High-tech Corp:\nThe most profitable companies, sometimes even without producing any goods: thoughts, lighter than any crystal ore, but more precious than gold and silver jewelry. However, precious ideas need top brains to achieve, unfortunately, not all citizens have top brains. High-tech companies usually choose to rely on immigration policies to solve this problem. The remaining citizens of the country no longer have any value, their work, and even their roles in society will be replaced by machines and automation spells. Generation after generation of well-educated ponies or other creatures enter this country, and one by one design drawings and magic papers leave this country, while the citizens of this country can only leave rows of numbers in the history of this country."
	corporation_militarism:0 "Military Corp"
	corporation_militarism_desc:0 "Military Corp:\nAt first, they may just be some military factories, or arms dealers. Later, the business expanded to bodyguards, escorts, assassinations, mercenaries, magic training. Later, debt collection, peacekeeping, coups, proxy wars. Then, massacre, destruction, doomsday weapons. Everything, just for a good price."
	corporation_dogmatism:0 "Bankrupt State"
	corporation_dogmatism_desc:0 "Bankrupt State:\nThe economy of this country has fallen into an irreversible abyss, and their once proud state-owned companies have gone bankrupt, and other economies have lost the main pillar and are unable to bring hope to this country. The shadow of debt hangs over this country, the government changes daily, and protests and uprisings continue. In this country, every citizen is struggling to survive, and their government is unable to provide any help."
	corporation_federal:0 "Federal Corp"
	corporation_federal_desc:0 "Federal Corp:\nMultiple different companies, formed a trade alliance for common interests - sometimes also a giant parent company caused by acquisitions and mergers. For each branch, what they care about is the KPI of the parent company, how to make their performance stand out in the evaluation of the parent company. For the parent company, they don’t care about various regions at all, as long as profits continue to flow into the account, they don’t care whether they cooperate with countries, companies, or monsters."
