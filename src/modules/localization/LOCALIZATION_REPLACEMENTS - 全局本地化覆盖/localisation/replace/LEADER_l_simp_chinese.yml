	NETHERLANDS_BLITZKRIEG_DESC:0 "德国与其他欧洲大国间的战争似乎已不可避免，尽管荷兰再次寄希望于自己的中立立场不会遭到侵犯，但其领导马却正在考虑与南方邻国秘密制定参谋计划，以防备潜在的敌对行为。\n\n军队已被动员，防线的构筑工作也在快马加鞭，一切都旨在试图让荷兰国家做好准备，尽可能抵御任何侵犯其主权的行为。而就算这一切都失败了，再不济荷兰也还有殖民地呢……"
