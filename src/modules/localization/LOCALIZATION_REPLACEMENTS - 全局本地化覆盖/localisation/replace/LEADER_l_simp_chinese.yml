	establishing_vichy_tt:0 "§Y维希法国§!将在法国南部建立。\n§Y维希法国§!将获得所有§Y法国殖民地§!\n§Y法国§!的部分部队将转移给§Y维希法国§!\n（§Y维希法国§!）：\n§Y法兰西行动§!成为执政党\n§Y菲利浦·贝当§!成为§Y法西斯主义§!政党的领导马。\n获得民族精神§Y占领成本§!，相对（生活消费品工厂：§Y20%§!）\n移动主力舰到§Y奥弗涅§!"
