	RULE_OPTION_NOR_TROSTSKYIST_AI_DESC:0 "AI将试图让列夫·托洛茨基留在挪威，并遵循他的共产主义原则对抗由斯大林主义者控制的苏维埃联盟，并在托洛茨基成为苏联领导马时与之结盟。"
	BM_EXILE_LEADER_DIVISION:0 "流亡领导马协同"
