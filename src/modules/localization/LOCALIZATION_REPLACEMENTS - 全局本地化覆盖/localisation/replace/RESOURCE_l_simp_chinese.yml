l_simp_chinese:
	PRODUCTION_MATERIALS_OIL:0 "石油"
	oil_desc:0 "石油是燃油时代搭载内燃机的车辆、坦克、火炮、飞行器所需要的燃料。"
	country_resource_oil:0 "石油产量"
	country_resource_cost_oil:0 "石油消耗"
	PRODUCTION_MATERIALS_LOGS:0 "工业圆木"
	logs_desc:0 "工业圆木是一种高质量的木材，在早期广泛用于制造武器和大型木质设备。"
	country_resource_logs:0 "工业圆木产量"
	country_resource_cost_logs:0 "工业圆木消耗"
	PRODUCTION_MATERIALS_STEEL:0 "钢铁"
	steel_desc:0 "钢铁是大多数枪械、机械的主要材料，也广泛用于各类物品的制作。"
	country_resource_steel:0 "钢铁产量"
	country_resource_cost_steel:0 "钢铁消耗"
	PRODUCTION_MATERIALS_COAL:0 "煤炭"
