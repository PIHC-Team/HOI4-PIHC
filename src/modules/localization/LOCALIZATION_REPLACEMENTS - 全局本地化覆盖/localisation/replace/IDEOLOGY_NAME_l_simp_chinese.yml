	RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC:0 "不受思潮与全球紧张度的限制。"
	RULE_ALLOW_WARGOALS_LIMITED_DESC:0 "战争目标受限于思潮和全球紧张度。"
	RULE_ALLOW_WARGOALS_FREE_25_DESC:0 "在全球紧张度低于25%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于思潮规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_WARGOALS_FREE_50_DESC:0 "在全球紧张度低于50%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于思潮规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_WARGOALS_FREE_75_DESC:0 "在全球紧张度低于75%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于思潮规则，但仍然允许通过国策获得战争目标。"
	RULE_ALLOW_WARGOALS_FREE_100_DESC:0 "在全球紧张度低于100%时无法制造战争目标，但在这之后所有国家都可以制造战争目标。该设定的优先级高于思潮规则，但仍然允许通过国策获得战争目标。"
	RULE_OPTION_SAME_IDEOLOGY:0 "仅限相同的思潮"
	RULE_ALLOW_ACCESS_SAME_IDEOLOGY_DESC:0 "各国只能从思潮相同的国家获得军事通行权和驻港权。"
