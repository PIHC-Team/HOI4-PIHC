	RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC:0 "各国只能对相同思潮的国家保障独立。"
	RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_TOOLTIP:0 "游戏规则：§R各国只能给相同思潮的国家独立保障。§!"
	RULE_ALLOW_MILITARY_ACCESS_SAME_IDEOLOGY_TT:0 "游戏规则：§R各国只能从思潮相同的国家获得军事通行权和驻港权。§!"
	RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_TT:0 "游戏规则：§R各国只能向拥有相同思潮的国家提供租借法案。§!"
