	RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0 "佛朗哥将控制国民阵线，并将长枪党和卡洛斯派的思潮融合到一个新的统一的西班牙，除非是受到攻击，否则他将在世界大战中保持中立。"
	RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0 "马克思主义统一工人党及其无政府主义盟友将在内战后摆脱斯大林主义的枷锁，寻求自己独立的共产主义思潮。"
	RULE_COMMUNIST_ARG_AI_DESC:0 "AI会尝试转向共产主义，并加入共产国际，专注于在南美传播他们的思潮。"
	steel_wings_steel_hearts_spirit_desc:0 "在一万尺的高度进行作战需要非凡的勇气。\n\n§G由于我们的思潮，该精神可用。§!"
	best_of_the_best_naval_academy_spirit_desc:0 "激烈的竞争和严格的选拔培养出了我们想要的舰长。\n\n§G由于我们的思潮，该精神可用。§!"
	academy_scholarships_spirit_desc:0 "贫穷不应该阻碍人们为国效力。\n\n§G由于我们的思潮，该精神可用。§!"
	political_loyalty_spirit_desc:0 "一支不可靠的军队将威胁到它本应保护的国家。\n\n§G由于我们的思潮，该精神可用。§!"
	relief_of_command_spirit_desc:0 "军队之所以存在，可不是为了满足将领们的自负。\n\n§G由于我们的思潮，该精神可用。§!"
	ideological_loyalty_spirit:0 "忠于思潮"
	ideological_loyalty_spirit_desc:0 "一个思潮出了问题的人绝不可能在战斗中发挥理想的作用。\n\n§G由于我们的思潮，该精神可用。§!"
	state_serves_the_military_spirit_desc:0 "国家存在的目的就是与其他的国家开战。别的事情要么是对其开战的支持，要么就是无用的干扰。\n\n§G由于我们的思潮，该精神可用。§!"
	BALTIC_revolutionary_cabinet_desc:0 "既然我们现在重新成为了底层阶级坚定的哨兵，那我们便需要重组一个与新政权的思潮一致的内阁。"
	support_republican_spain_desc:0 "西班牙内战被很多人视为其内部对当今世界思潮的冲突。发送装备援助共和国，由此我们可以表明反对法西斯暴徒压制西班牙民众的立场。"
	support_nationalist_spain_desc:0 "西班牙内战被很多人视为其内部对当今世界思潮的冲突。发送装备援助国民军，由此我们可以表明反对无政府主义者和赤色分子摧毁西班牙的立场。"
	foreign_influence_desc:0 "我们保护下的国家只应得到最好和最公平的治理。必须减少外来思潮破坏稳定的影响。"
	propping_up_gustavo_ross_tt:0 "当§Y古斯塔沃·罗斯§!成为智利总统时，获得§G+75§!政治点数和§G+5%§!稳定度，并给予其§Y受人欢迎§!特质，其效果为：§G+2%§!顺从度增长速度系数、§G+25%§!思潮变化抵制力度和§G+10%§!稳定度。"
	marxism_desc:0 "马克思主义涵盖从经济学到历史观的辽阔领域，其根本上力图将卡尔·马克思的理论付诸政治实践。主张阶级斗争以及过渡至生产资料公有制社会是这种思潮的主要特征。"
	leninism_desc:0 "列宁主义是一种基于马克思主义的思潮流派，其旨在以党领导革命颠覆资本主义社会的方式建立社会主义国家。而在取得政权后，这种思潮下的政党会通过内部讨论决策的方式执政。"
	anti_revisionism_desc:0 "反修正主义是一种为反击众多自诩马克思主义继承人的思潮而产生的流派，提倡保持原始革命理论的核心要素。其主要反对将资本主义经济元素引入社会主义国家，这种思潮很大程度上通过“什么不是什么”而非“什么是什么”来定义。"
	falangism_desc:0 "长枪主义是一种兼具法西斯主义和保守主义特征的威权主义思潮，其非常重视民族和天主教的身份认同。"
	rexism_desc:0 "雷克斯主义是一种强烈反对自由主义及共产主义，同时提倡社团主义经济的坚定的保守民族主义思潮。鉴于其越来越多地使用民粹主义和威权主义的言辞，他们的理念正与其他法西斯运动相接近。"
	populism_desc:0 "没有明确的思潮框架的一种政治运动。民粹主义者主张实施在选民中流行或被认为与政治“精英”偏好相悖的各种政策。"
	indoctrination_focus:0 "思潮灌输"
	indoctrination_focus_desc:0 "既然我们的思潮是基于真理的，那么我们也可以将它当做真理来进行教育。媒体和教育系统必须要反映这一点。"
	internationalism_focus_desc:0 "思潮没有国界。其他国家也许可以称自己为主权国家，但我们的信念是远远高于这种主张的。"
	ideological_fanaticism:0 "思潮狂热主义"
	upgrade_psycho_warfare_desc:0 "§L宣传是在国家内确保我们思潮的有效工具，但没有任何工具比得上散播敌方政权可能给国家带来的恐惧更有效。通过把我们的特工与外国的反思潮运动相结合，我们必将更有效地在国际上传播我们的思潮……§!"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_TITLE:0 "加强思潮"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_ACTION:0 "正在加强思潮"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_ASSIGNMENT_DESC:0 "§G点击§!高亮合适的目标国家。再次§G点击§!这个国家来选择一个将要增强的思潮。"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_DESC:0 "§L增加某个当地政党支持度。§!\n§Y每日思潮支持增加：$BASE|1=$§!\n 基础值：$BASE|1G$"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_VALID_TARGET:0 "§G点击§!选择一种思潮并派遣$CODENAME|H$在$STATE|H$£operative_mission_icons_small|5£提升思潮支持度"
	OPERATIVE_MISSION_BOOST_IDEOLOGY_INVALID_TARGET:0 "无法派出特工在$STATE|H$增强思潮\n\n$REASON|R$"
	OPERATIVE_INVALID_MISSION_REASON_NO_IDEOLOGY_TO_BOOST:0 "没有可以用于增强的思潮"
	idea_group_political_reform_desc:0 "人民和潜在的思潮将会改变这个国家的政坛"
	ideological_fanaticism_focus:0 "思潮狂热主义"
	internationalism_desc:0 "我们坚定地相信，思潮不分国界，我们也不为国界所拘束。"
