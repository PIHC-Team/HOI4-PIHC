	COUP_STRENGTH_TOOLTIP:0 "§H政变力量§!取决于我们的思潮在该国的支持率。\n\n目标的£stability_texticon §Y稳定度§!越低则政变成功可能性越高，如果未能将全部所需装备送达则会降低成功率。"
