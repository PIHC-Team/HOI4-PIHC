l_english:
	human_wave_offensive:0 "Pony Wave Offensive"
	human_wave_offensive_desc:0 "A Pony Wave Offensive is an infantry tactic in which an attacker conducts a frontal assault with densely concentrated infantry formations against the enemy line, with the intent to overrun the defenders by engaging in melee combat."
	large_front_offensive_desc:0 "By conducting, or threatening, Pony Wave Offensives across multiple areas of the front we can prevent the enemy from concentrating his firepower against any single attack."
	flexible_line_desc:0 "As well-oiled a machine as the assembly line may be, it is still manned by ponys, which allows for adaptation when needed. We should make use of this in our industrial production."
	improved_computing_machine_desc:0 "Electronic digital computers can now be made which are programmable. Although still expensive and large, these machines allow for intelligence analysis far beyond pony capacity."
