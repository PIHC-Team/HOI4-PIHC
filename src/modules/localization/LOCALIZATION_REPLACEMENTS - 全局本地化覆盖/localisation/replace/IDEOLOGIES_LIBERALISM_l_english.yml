l_english:
	democratic:0 "Liberalism"
	democratic_noun:0 "Liberalism"
	democratic_desc:0 "Liberalism"
	democratic_drift:0 "Liberalism drift"
	democratic_acceptance:0 "Liberalism acceptance"
	democratic_wiki_tooltip:0 "Majority rule - seems to be a very simple and natural principle for ponies. Innocent ponies do not need to rely on any complex system, which also leads to the fact that they rarely think about the simple concept of “democracy” in the past, which hides too many variables: electing leaders or parliament? Voting representatives or voting policies? How often to elect? Can leaders be re-elected? Is the right to vote equal? Are voters free? ...\nThese questions seem to be not what ponies need to consider, after all, an omnipotent monarch who can take care of everything is more reliable than anything. But as the world they live in is rapidly slipping in a direction they don’t want, maybe it’s time to start thinking about the necessity of exploring new systems.\n\n'''Ideologies under Liberalism Ethos:'''"
	democratic_republic:0 "Presidential Republic"
	democratic_republic_desc:0 "Presidential Republic:\nLeaders are elected via democratic vote to handle national affairs. The elected leader is both the head of state and the head of government. Historically, the power of the Alicorn princesses seemed unquestionable: naturally powerful magic meant a dominant position.\nHowever, in the post-Alicorn era, how to choose a leader who could unite the country became a problem. Democrats believe that only through democratic elections can the most suitable leader be chosen. In the land of Equestria, this idea still has many problems: should each Unicorn, Earth Pony, and Pegasus have the same number of votes and parliament members? What about other species? Should individuals with powerful magic have more votes? Can the president, or the democratically elected leader given another title due to Equestria’s traditional culture, be re-elected?"
	democratic_democracy:0 "Parliamentary Republic"
	democratic_democracy_desc:0 "Parliamentary Republic:\nParliament members elected via democratic vote are jointly responsible for handling national affairs. The elected national leader is accountable to the parliament. In Equestria’s history, there was a rudimentary form of parliamentary system: for example, the Grand Equestria Pony Summit. However, because the Alicorns dominated that era, such parliament-like summits never held real power.\nIt wasn’t until after the Ultimate Battle that the absence of the Alicorn princesses gave rise to the opportunity for ponies in various regions to practice democracy. The same ethos also occurred among other species in Equestria. After the absolute rule of the Alicorns was gone, various species also began to question the rule of a monarch or a single leader, and in their exploration, developed political forms similar to a parliamentary system."
	democratic_monarchy:0 "Constitutional Monarchy"
	democratic_monarchy_desc:0 "Constitutional Monarchy:\nIn a Constitutional Monarchy system, governance is shared between a monarch with ceremonial duties and a constitution that outlines the distribution of power. Historically, Equestria was under the benevolent rule of Princesses Celestia and Luna, embodying both magical prowess and leadership. However, the transition post-Alicorn era brought forth questions about centralized power. While democratic ideals were more embraced than before, the idea of a monarch still held sway.\nThe idea of a Constitutional Monarchy emerged as a compromise between tradition and modern governance: the monarch remains as a symbol of unity and continuity, while the real power is held by the parliament or other democratic institutions."
	democratic_oligarchy:0 "Liberal Oligarchy"
	democratic_oligarchy_desc:0 "Liberal Oligarchy:\nLike normal oligarchies, the highest power of these countries is firmly controlled by a small group of oligarchs. Although these oligarchs may fight each other for power and profit, this will not shake the solid system itself. In some places, this type of regime often wraps itself in a layer of “democracy” and “freedom”, some irrelevant powers are granted to the public and fake, manipulated elections are held.\nDifferent from normal oligarchy that emphasizes diligence, obedience, or “for the princess\", the liberal oligarchy emphasizes individual freedom, equality, and individual rights. Unfortunately, these slogans are mostly tools for the oligarchs to attack each other, and are only enjoyed by them."
	democratic_tribe:0 "Populism"
	democratic_tribe_desc:0 "Populism:\nWhat to do when multiple individuals have conflicts? In the early days of Equestria, the obvious answer to this question was to have an argument, or even a duel. However, since Windigo showed all creatures the dangers of conflict, ponies began to try to find a more peaceful resolution.\nPopulism can be found in modern countries, city-states, communes, and even primitive tribes: one creature, one vote, majority decides. Majority always means correct, minority always means wrong, isn’t it natural?"
	democratic_freestate:0 "Democratic Freestate"
	democratic_freestate_desc:0 "Democratic Freestate:\nLong before the era of the Alicorns - when there were only a few loose city-states on the land - some independent city-states had adopted a certain democratic system. Most of the so-called “democracies” in the city-states have strict restrictions that only allow nobles to participate in democratic politics, and most commoners still live in despot and even slavery. However, due to the spread of the idea of friendship and harmony, the group enjoying freedom is gradually expanding. After entering the era of the Alicorns, for a considerable period of time, due to the existence of a unified central regime, these democratic systems could only survive on the edge of civilized areas.\nNowadays, there are few countries that can meet the traditional definition of city-states, and they have been replaced by emerging cities formed in chaotic international situations. After the collapse of the central regime, various regions began to huddle together. Some of these cities chose a democratic system and became modern democratic freestates. These cities have often developed into huge metropolitan areas, some of which can even form their own economic systems. However, they often lack sufficient military power to protect themselves. Sometimes several freestates form loose alliances, and most of the time they choose to attach or even integrate into a larger power."
	democratic_organization:0 "Interim Democratic Government"
	democratic_organization_desc:0 "Interim Democratic Government:\nSometimes, it is very dangerous to implement a complete democratic system in a place that has just experienced great turmoil or even an anarchic zone, as this may lead to some malicious ones taking advantage of the imperfect system and causing disasters. Therefore, the establishment of democracy requires a process, just like planting a plant.\nInterim democratic governments are often established on ruins, which may come from a post-war wasteland or a revolutionary birthplace. The goal of this government is to establish a truly democratic regime, and what they are in now is a difficult transition period. Many of them cannot even be called a government, but more like an organization or an influential club. Therefore, the government’s first goal is to maintain its own existence, and it has to take certain regulatory measures and carefully handle the conflicts that arise between various factions. Of course, this stage will eventually end, and the most ideal situation is that a democratic and free new regime is established full of hope. The worst situation is that the hard-won democracy falls back into chaos."
	democratic_duchy:0 "Democratic Duchy"
	democratic_duchy_desc:0 "Democratic Duchy:\nThe concept of democracy seems to contradict the idea of a duchy of a lord, but in some cases, this is still possible: if the lord seems to be indifferent to the affairs of the duchy.\nThe most typical democratic duchy in Equestria appeared in the jurisdiction of the Equestria Empire. Although Cozy Glow has been crowned the so-called “Empress”, after the war, her control over various regions of Equestria has become very weak. The newborn empire is facing internal and external troubles, and rebellions are emerging one after another. Cozy Glow can only decentralize power, enfeoff a group of dukes/duchesses to help her rule the vast land of Equestria. Each duchy enjoys a certain degree of autonomy, and some regions can even implement a certain degree of democratic system: rulers, like the president of a democratic country, can be elected by the local ponies, and there is a certain degree of autonomy in both economic and military aspects. Some even directly obtain recognition of autonomy.\nAlthough you can see weird titles like “elected duke/duchess” in these democratic duchies, it must be noted that these places are far from real “democracy”. Canterlot still has the right to veto all local affairs, including election results, and the empire can also have a considerable influence on local politics and economy. As for the military, it is even more strictly restricted. At the beginning of the establishment of the empire, these duchies were relatively prosperous. As time goes by, the centralization of power is gradually strengthening, and these democratic duchies may also face extinction..."
	democratic_authoritarianism:0 "Authoritarian Liberalism"
	democratic_authoritarianism_desc:0 "Authoritarian Liberalism:\n“Freedom has boundaries. Absolute freedom will only lead to the exploitation of the weak by the strong.” This is the creed of the authoritarian liberalists. Therefore, they tend to protect individual freedom through coercive means rather than choices made by individuals with free will. In this system, the government strictly controls the behavior of individuals to ensure the maximization of overall freedom in society. For example, they oppose monopolies economically, discrimination culturally, and bureaucracy politically.\nHowever, who can define “freedom”? Can the government represent the “freedom” of society as a whole? Once, this question was simple, when asked who could be the definer of “freedom”, they would always answer: “For example, Princess Luna, she never managed so many things like Princess Celestia.” Whether this answer can convince dissenters, this answer can no longer be used now, and authoritarian liberalism inevitably falls into a dilemma of self-contradiction."
	democratic_totalitarianism:0 "Totalitarian Liberalism"
	democratic_totalitarianism_desc:0 "Totalitarian Liberalism:\n“You can’t force a pony to be happy against their will. But what if you forcefully give them free will? What if you install in them a single thought: ‘From now on, you make your own decisions and take responsibility for your own actions’?” As the totalitarian liberalists force their interpretation of freedom on everypony else, some may accuse them of violating the fundamental principles of freedom themselves. But they never argue, since having opposing opinions is a sign of freedom which they are very happy to hear. Of course, they also have the freedom to ignore these opinions.\nDon’t misread totalitarian liberalism as a form of disguised tyranny as their is no tyrant in this system: the military, the police, the beurocracts, the capitalists, the leaders, ... no one is above suspicion. Also, don’t view totalitarian liberalism as an FFA society, as there is a powerful central government overseeing all actions that create unfreedom.\nIf you attempt to exploit the system, then you are free to do so and you are likely to be caught. If you attempt to resist the system, then you are free to do so and you are likely to be caught. If you attempt to make yourself unfree, you are also likely to be caught and forced to accept freedom in prison."
	democratic_utopia:0 "Liberalism Utopia"
	democratic_utopia_desc:0 "Liberalism Utopia:\nHere, the practice of democracy has achieved unprecedented success, marked by a deep commitment to individual rights, freedoms, and the rule of law. Like in a science fiction novel, the society has secured all pros of democracy, like freedom, equality, diversity, prosperity, justice, and avoided all cons, like inefficiency, monopoly and corruption. The government is transparent, the economy is prosperous, and the ponies are happy. Nopony knows how they did it, but what can you argue about a country on a land of magic and rainbows?"
	democratic_dystopia:0 "Liberalism Dystopia"
	democratic_dystopia_desc:0 "Liberalism Dystopia:\nHere, the practice of democracy has gotten out of control, and under the false appearance hides a terrifying reality. The liberalism ideology itself has succeeded, and the pursuit of individual rights has overwhelmed all other voices. Soon, the concept of the nation is forgotten, and the whole meaning of each citizen’s life is to please themselves, and other independent, autonomous individuals.\nUnlike anarchy, in liberalism dystopia respects the rights of each individual. Sadly, after gaining infinite freedom in the spiritual world, the material world will not naturally become better: what to eat tonight, what to wear tomorrow morning, where they should come from, these are all the business of each pony themselves. No one is responsible for this, or rather, no one should be responsible for anything, and no one should attack each other because of different ideas - except for the occasional Ostracism towards “The Enemies of Liberalism”."
	democratic_theocracy:0 "Theodemocracy"
	democratic_theocracy_desc:0 "Theodemocracy:\nFor some strange religious believers, democracy is not only a political system, but also a belief. For example, some ponies believe that the Holy Mother Lauren created Equestria, and her will should be the highest law. At the same time, they believe that only through democratic elections can the will of the Holy Mother be realized. In myths, they describe the Holy Mother Lauren as an Alicorn, the mother of Princesses Celestia and Luna, and the creator of Equestria. The two princesses of her creation, representing the sun and the moon respectively, ruled Equestria, precisely because of the balance concept she followed.\nOf course, not all theodemocrats worship the Holy Mother Lauren, but no matter who their worship, at least they all believe in the concept of “democracy” itself. Different methods, the same purpose, so they should not have too much disagreement, or fight each other, right? ... Emm, right?"
	democratic_technocracy:0 "Elite Democracy"
	democratic_technocracy_desc:0 "Elite Democracy:\nElite Democracy chooses to inherit the fine traditions from the Celestia era (for some ponies, they prefer to call it “in the spirit of Empress Cozy Glow”): individuals with powerful magic are naturally more qualified to become leaders of the country and the army, and individuals with more knowledge naturally become officials of the government. Although after the Ultimate Battle, the consensus on who is more suitable to gain power gradually collapsed, it does not mean that we need to abandon this idea. Just introduce some modern elements, such as elections, and Equestria can reach a consensus again.\nElite Democracy emphasizes that only qualified individuals have the right to participate in elections, including the right to vote and be elected. The ability is the basic requirement to obtain the qualification to be elected, and after qualified... the ability to win the support of the public itself is also an ability."
	democratic_militarism:0 "Liberalism Exporter"
	democratic_militarism_desc:0 "Liberalism Exporter:\nJust like Twilight Sparkle once thought that Harmonism was an excellent idea that should be promoted to the world, some radical liberals believe that “freedom” is also an idea that needs to be actively promoted. However, some of them are more extreme, believing that it is impossible to make those species who are accustomed to living under the rule of princesses, kings, nobles, or deity accept freedom only through peaceful means. When asked if this behavior violates the basic principles of liberalism, they always answer: “The learning process is always painful, but at least they have the freedom to choose afterwards. If they choose not to be free, it means they haven’t learned enough.”"
	democratic_dogmatism:0 "Dogmatic Liberalism"
	democratic_dogmatism_desc:0 "Dogmatic Liberalism:\n“What is freedom?” is a common question that troubles many liberals, but some experienced Equestrian librarians may try to find some authoritative answers. They can always dig out a few old ancient books, claiming that they come from a basement of the two sisters. These books contain the wisdom of the ancestors, who have detailed definitions of what “freedom” is and how to achieve “freedom”. The records in these books can even be traced back to the era of the Three Tribes Covenant, so what they say must be the absolute truth.\nIf you secretly try to modify the contents of these ancient books, then you are likely to get their support after success. But these old scholars are often too familiar with the contents of the ancient books, so it is difficult for you to do so."
	democratic_federal:0 "Democratic Federation"
	democratic_federal_desc:0 "Democratic Federation:\nCompared to a unified political entity, multiple different countries and different species may choose to unite together to jointly face external threats, develop the economy together, and solve problems together. This federal system often retains the autonomy of each member country, but on some important issues, the federal government has the final decision-making power. In this system, each member country will send representatives to participate in the decision-making of the federal government, and the federal government will be responsible for maintaining the interests of the entire federation.\nAnugypt is the most typical example of a democratic federation. Since the disappearance of the ancient Anugyptian dynasties, Anugypt has re-entered the city-state era. It is difficult for a single city-state to survive in the desert, so different city-states have formed the Anugypt League Conference on the basis of retaining autonomy to coordinate affairs between city-states. Sometimes, some city-states are dissatisfied with the decisions of this conference and threaten to withdraw from the League, but most of the time, without external intervention, a compromise will always be found."
	democratic_equatism:0 "Philanthropism"
	democratic_equatism_desc:0 "Philanthropism:\nAs another branch of liberalism, they not only focus on freedom, but also hope to balance freedom and equality. This ideology emphasizes the importance of equality and the welfare of all citizens, and the government provides social services such as medical care, education, and social security to all citizens. On the one hand, they emphasize efforts to reduce the gap between the rich and the poor; on the other hand, they also emphasize respect and freedom for individuals, as well as the necessity of democratic procedures. Undoubtedly, Philanthropism will never be welcomed by the factions advocating revolutionary equatism, who often criticize the former for its weakness and compromise and the abandonment of the agenda of class struggle. Though considered as a complete betrayal of equatism, Philanthropism still receives widespread support in many places, especially in countries that are already relatively stable and have well-functioning organizational structures. \nPonies are innocent species. When they taste the sweetness brought by philanthropism, they will soon be willing to pay for it sincerely and help each other with all their efforts; but at the same time, they are also gullible species. A few words may destroy a system that operates only based on the idea of “mutual-trust” or “dedication” — which is not uncommon in Equestria’s history."
	democratic_harmonicism:0 "Harmonic Liberalism"
	democratic_harmonicism_desc:0 "Harmonic Liberalism:\nFor Equestria, the word “liberalism” is so unfamiliar. This novel ideology is not native, but comes from a distant dimension. In that strange place called “Earth”, there is a group of “humans” who believe in maintaining personal freedom of thought, limiting the government’s use of power, and ensuring the right to life, etc. On the other hand, the Harmonism that originated from Equestria advocates that individuals in a society should promote Harmonism spirit to achieve social harmony. Unlike Philanthropism, Harmonism does not emphasize equality, but emphasizes virtues: honesty, kindness, laughter, generosity, loyalty, and the most important things that makes the ideas of Harmonism so special in Equestria: those magical rainbow lasers are real. However, unlike those ethos that take Harmonism as their primary goal, Harmonic Liberalism emphasizes the way to achieve harmony. They do not believe that ponies can easily achieve Harmonism, and the failed M6 is a good example. Instead of immediately entering a utopia, a more realistic strategy is to slowly move towards a Harmonic society under the protection of a fair system.\nSunset Shimmer has been exposed to “liberalism” for a long time as she lived in the human world: democratic procedures, private property, freedom of speech, free market... She believes that the ideas advocated by liberalism are in line with the long-standing Harmonism of ponies but only more progressive and efficient. After coming to Storm Island and initially gaining control of the local area, Sunset couldn’t wait to launch her ideal society here. However, Sunset Shimmer is just an ordinary, underage student. Therefore this liberal harmonism does not have a complete theoretical system to support it, and all discussions about it are only in a few chat messages. It can be said that this theory was born with many loopholes and far from being used to govern. And Sunset’s setbacks on Storm Island also confirmed this. In any case, this idea has been spread, and it is beginning to become popular outside of Storm Island, too. Perhaps in the future, this idea can be perfected and widely accepted. But now, it will be tested first in the cruel struggle on this strange land."
