l_english:
	equatism:0 "Equatism"
	equatism_noun:0 "Equatism"
	equatism_desc:0 "Equatism"
	equatism_drift:0 "Equatism drift"
	equatism_acceptance:0 "Equatism acceptance"
	equatism_wiki_tooltip:0 "No matter how enlightened the environment we live in, we must admit that Equestria is born with inequality — some ponies can control magic, some ponies can fly, some ponies are incredibly strong, some ponies are born unlucky, and some ponies can’t even get their cutie marks... As for the inequality between different species, it is even more controversial and should be avoided in any occasion.\nBut we must also know that all of this is not a privilege or an excuse for discrimination — every pony, and every creature has the right to liberate themselves and develop equally! All the oppressed creatures in the world will unite one day and smash the chains of the old era!\n\n'''Ideologies under Equatism Ethos:'''"
	equatism_republic:0 "Socialism"
	equatism_republic_desc:0 "Socialism:\nSocialism emphasizes the public ownership of the means of production, especially magic, and in practice usually relies on a one-party government to intervene in the economy, develop state-owned enterprises, implement planned economy, and collective production to ensure the fair distribution of resources. After the Ultimate Battle, as the climate gradually cooled and Tirek plundered Equestria’s magic, magic shortages began to appear in various regions, greatly affecting agricultural production and life. During this period, some magic egalitarian groups began to rise in various parts of Equestria, proposing that a central committee collect all ponies’ magic for unified distribution to ensure that every pony can obtain enough magic to sustain their lives, and the country can concentrate the remaining magic power to complete some large-scale important construction projects.\nThe early egalitarian groups and Equatism parties had very rough ideas, often accompanied by many unrealistic magic confiscation plans, so they did not receive widespread support. Learning from the lessons of failure, some Equatism parties began to emphasize one-party government and the public ownership of other resources that are easier to redistribute than magic, such as food and steel. These improved egalitarian measures are now classified as “socialism” and have gradually gained more popularity. With the arrival of Sunset Shimmer, publications and ideas from the human world, “socialism” is expected to further integrate and develop."
	equatism_democracy:0 "Democratic Socialism"
	equatism_democracy_desc:0 "Democratic Socialism:\nDemocratic Socialism is usually achieved by a party or organization that believes in Equatism gaining power through peaceful democratic means, and then achieving the goals of Equatism through legislation and administration.\nHistorically, the Alicorn princesses wielded immense magical and governing powers, ensuring stability and harmony across the land. However, as Equestrian society gradually industrialized with democratic ideas emerged, questions arose about the distribution of wealth, resources, and opportunities. Democratic Socialism advocates for a system where key industries are owned and regulated by the community for the collective good, while still preserving individual liberties. The focus shifted towards ensuring universal access to education, healthcare, and other essential services, regardless of one’s magical abilities or species. Indeed, this unprecedented system is a huge change for ponies, but even the concept of “democracy” itself is a big step compared to traditional monarchies, so what’s wrong with taking one more small step?"
	equatism_monarchy:0 "Monarcho-socialism"
	equatism_monarchy_desc:0 "Monarcho-socialism:\nA country advocating equality while respecting a supreme monarch sounds like a self-contradiction, but any ideology must consider the existence of reality. After the Ultimate Battle, political parties in the Crystal Empire emerged like mushrooms after rain, many of which chose to embrace the Equatism ethos. The most cohesive party among the many Equatism parties was the Cadencism party, which believed that one day the Crystal Empire would restore the rule of Princess Cadence, and Princess Cadence would promote Equatism within the empire. Due to the Crystal Empire’s public’s fondness for the royal family, coupled with Equatism’s concern for the interests of ordinary Crystal ponies, the Cadencism party quickly gained considerable influence in the Crystal Empire.\nUnfortunately, this was a time of high tension. With the coronation of Cozy Glow coming soon, police and bureaucrats in the Equestria Empire were on high alert for any possible destabilizing factors. The Cadencism party in the colonial Crystal Empire quickly became the next target on the list. After the Equestria Empire forced the Crystal Empire Council to pass legislation banning the Cadencism party, many Cadencists had to switch to other Equatism parties for self-preservation. Instead of promoting any specific monarch, now when promoting Equatism, they only express respect for the royal family in exchange for public support, which led to the rise of Monarcho-socialism. Today, many Equatism parties in the Crystal Empire have been integrated into the Red Crystal, while Monarcho-socialism remains the most influential faction in it. They suggest maintaining the constitutional monarchy in the Crystal Empire while replacing the existing Crystal Empire Council system with the Red Crystal single-party system and the existing Crystal Empire constitution with a socialism constitution, ultimately uniting the country under the name of the constitutional monarch to achieve the goals of Equatism."
	equatism_oligarchy:0 "State Capitalism"
	equatism_oligarchy_desc:0 "State Capitalism:\nAlthough state capitalists claim that most of the policies they support are similar to those of Equatists, such as supporting state-owned enterprises, intervening in and regulating the economy, implementing social welfare policies to some extent, and even limited magic confiscation by the central government, most Equatism factions still refuse to recognize state capitalism as part of the Equatism ethos. Critics from Equatism believe that state capitalists only superficially support Equatism, but in reality, they are maintaining a new privileged class, which is composed of state capitalists themselves, who control the resources of the entire society through the power of the state. Here, the purpose of nationalization is no longer to serve the public equally, but only to serve the few oligarchs in the bureaucracy under the guise of equality. Although state capitalists do not comment on this evaluation, what confuses them the most is that depotists, liberals, and even some Harmonists will use “state capitalism” as a swear word to attack Equatism."
	equatism_tribe:0 "Tribal Commune"
	equatism_tribe_desc:0 "Tribal Commune:\nIn tribes that believe in primitive Equatism, tribe members cooperate to complete planting, gathering, and hunting, and then distribute the food they obtain uniformly, prioritizing children, young adults, and expectant mothers in the tribe. Although they do not have magic research, do not know how to distribute magic equally; they do not have industrialization; they do not even have the concept of private property. This primitive tribal commune can be said to be the most primitive form of Equatism, and their way of life even has similarities with the ideal society of some Harmonists. However, how different are they from other places in Equestria? Most of Equestria has hardly changed in thousands of years, and their seemingly “primitive” way of life is just an inheritance of traditions that have lasted for thousands of years."
	equatism_freestate:0 "Socialism Commune"
	equatism_freestate_desc:0 "Socialism Commune:\nAfter the Ultimate Battle, as the climate gradually cooled and Tirek plundered Equestria’s magic, magic shortages began to appear in various regions, greatly affecting agricultural production and life. During this period, some magic egalitarian groups began to rise in various parts of Equestria, proposing that a central committee collect all ponies’ magic for unified distribution to ensure that every pony can obtain enough magic to sustain their lives, and the country can concentrate the remaining magic power to complete some large-scale important construction projects.\nMost of these communes failed, either conquered or annexed by a country, or gradually declined due to lack of resources, or split due to internal conflicts. The main reason is that the early egalitarian groups and Equatism parties had very rough ideas, often accompanied by many unrealistic magic confiscation plans, so they did not receive widespread support. However, as years passed, Equestria is completing its industrialization, and more resource and opportunity distribution issues were put on the table. Perhaps, after improving the design concept of the socialism commune, this type of commune will have the opportunity to reappear in some part of Equestria."
	equatism_organization:0 "Revolutionary Regime"
	equatism_organization_desc:0 "Revolutionary Regime:\nA group of public who are dissatisfied with the monarch, or dissatisfied with the dictator, or dissatisfied with the foreign aggressor, or dissatisfied with the capitalist, have just united to overthrow the old regime and establish a new revolutionary regime. Where will they go next? Will they organize independent communes, or establish a brand new Equatism republic? Or will they take advantage of their victory to liberate more areas and eliminate more oppressors? Before them, they face countless choices, and their primary task is to ensure the stability of the new fragile regime. Establishing an Equatism revolutionary regime in Equestria itself is a huge challenge. Looking around, they will face the siege of various reactionary forces, and their internal may also disintegrate due to power struggles, or even just different ideas. But whether the flames eventually ignite or extinguish, in the cold wind, they will leave a warm memory in history."
	equatism_duchy:0 "Liberated Zone"
	equatism_duchy_desc:0 "Liberated Zone:\nWith the help of an external Equatism regime, the oppressive regime here has just been destroyed, and the citizens here have gained freedom. Subsequently, the ideology of the liberators quickly poured in, and the liberated zone became an educational base for Equatism. The citizens here, whether voluntarily or forcibly, finally began to abandon the idea of finding a new monarch, leader, democratic parliament, or deity, and began to care about their compatriots. Some liberated zones exist in the form of communes, some directly become part of the liberator’s country, and some have not yet determined their future path. But like a pony who has just awakened from Princess Luna’s beautiful dream, give them five more minutes of wake-up confusion, and the day of awakening will come."
	equatism_authoritarianism:0 "Authoritarian Equatism"
	equatism_authoritarianism_desc:0 "Authoritarian Equatism:\nAuthoritarian Equatists are keen to criticize their socialism colleagues for being too gentle, and perhaps they are right: none of the countless socialism or mild Equatism regimes in Equestria have succeeded. Throughout Equestria’s history, all we see are monarchs, villains, ambitious ponies, dictators, and the silent masses. Authoritarian Equatists believe that only through coercion can equality be achieved. Some of them choose to resort to a central figure, and some choose a one-party dictatorship government or a committee dictatorship, but their goals are the same: to silence the reactionaries. Under the guidance of Authoritarian Equatism, the country will be able to build an Equatist utopia undisturbed, from nationalization, to planned economy, to completely controllable collective production; from compulsory property redistribution, to compulsory magic confiscation, to complete elimination of privatization; from Equatism ideological education, to Equatism labor reform camp, to conscious Equatism learning; from social education, to social medical care, to social security. All this country needs is time."
	equatism_totalitarianism:0 "Our-Townism"
	equatism_totalitarianism_desc:0 "Our-Townism:\nFor the supporters of totalitarian Equatism, their biggest difficulty is trying to explain why Starlight Glimmer, who first proposed totalitarian Equatism, no longer believes in this idea. They believe that M6’s brainwashing has changed Starlight Glimmer, making her no longer believe in her once correct ideals. We are not sure whether these totalitarian Equatists know that Starlight Glimmer secretly retained her cutie mark during her rule of Our Town, becoming the only privileged class in the town. In any case, these totalitarian Equatists will no longer pay excessive attention to Starlight Glimmer. Their goal is to continue to promote Equatism, with a more powerful leader at the helm, based on stricter laws, more severe punishments and more rigorous surveillance. There may be a few of them are usurpers who use the banner of equality, but more of them sincerely believe that they will become wise Equatist leaders, or have already supported a wise Equatist leader. “Equality cannot be achieved without dominant coercion.” — this is the core belief of Our-Townists."
	equatism_utopia:0 "Ideal Communism"
	equatism_utopia_desc:0 "Ideal Communism:\nHere, the practice of Equatism has achieved unprecedented success, and they have realized the scene they envisioned: a society without a state, without classes, without private property. Here, material is abundant, magic is abundant, friendship is shared, and ponies take what they need and do what they can. The greatly developed productive forces guarantee the living standards of every pony, while the idea of Equatism guarantees the dignity of every pony. Not only that, they focus on the international: the vision of an ideal communism society is gradually becoming a reality, and their propaganda attracts Equatists from all over the world and those creatures who are still hungry and oppressed. Their goal is to expand this ideal communism society to the entire world."
	equatism_dystopia:0 "Red Terror"
	equatism_dystopia_desc:0 "Red Terror:\nHere, the practice of Equatism has gotten out of control, and under the false appearance hides a terrifying reality. Attention to the reactionaries has changed the focus on the construction of the state itself, the pursuit of enemies has changed the protection of citizens, and the suppression of dissenters has changed the propaganda of Equatism. Every day, countless “Traitors of Equatism” are sent to the interrogation room, sent to labor camps, sent to the guillotine, or become the ingredients of the “National Magic Repository”. Some idealists among the Equatists seem to notice that something is wrong with this country, but either dare not speak out, or have been unable to speak out in the “National Magic Repository”. As for those Equatists who founded this country, it is even unknown whether they are still managing this country. Life is in no way getting better day by day, but at least, as promised at the very beginning, it is getting more and more equal day by day. Death is the most equal, from top to bottom, no one can escape the judgment of Equatism."
	equatism_theocracy:0 "Liberation Theology"
	equatism_theocracy_desc:0 "Liberation Theology:\nAlthough some radical Harmonic theists regard Liberation Theology as a heresy that distorts the will of Harmony, most Harmonists are still willing to accept these Equatists among the believers. Liberation Theology believes that the Harmonism advocated by the Tree of Harmony, the Treehouse of Harmony, and the Friendship Map already contains the idea of equality: the power of the Elements of Harmony will eliminate the villains who try to become a privileged class, the Treehouse of Harmony advocates cross-racial friendship with equality, and the Friendship Map sends Equestria’s envoys to destroy the dictators in various regions, as well as capitalist groups similar to the ones in Las Pegasus. Therefore, “if the deity of Harmony exists, then it must be an Equatist” — this is the core belief of Liberation Theology."
	equatism_technocracy:0 "Ultravisionary"
	equatism_technocracy_desc:0 "Ultravisionary:\nMany liberals criticize Equatism as an inefficient social production model: magic should not be concentrated and distributed fairly, but should belong to those with the best talents; similarly, wealth should belong to those who are most capable of making money, which means a free market selection. But at least, those liberls can not use the same argument to criticize Ultravisionary: in the ideal country of Ultravisionary, the entire country is united and resources are concentrated on the development of science and magic technology. They will make greater progress than any individual who claims to have talent, and their progress will not only benefit those talented individuals, but also benefit every citizen of the entire country.\nHowever, even though liberls are less likely to criticize Ultravisionary from an efficiency perspective, Ultravisionary receives a lot criticism from other factions within the Equatism ethos: they believe that Ultravisionary place too much emphasis on the development of technology and magic, and neglect the core idea of equality. In their view, the ideal country of Ultravisionary is a cold machine, not a warm home. By the way, in practice, who can point out the direction of the country’s resource tilt? Celestia ruled for a thousand years, betting all of Equestria’s stability on friendship, and ultimately failed. Why should an ordinary Ultravisionary leader be able to predict the future of the most promising scientific technology and magic then? Even Twilight Sparkle, who was good at both ruling and researching, would find it difficult to qualify as an Ultravisionary leader."
	equatism_militarism:0 "War Socialism"
	equatism_militarism_desc:0 "War Socialism:\nSocialism takes into account the interests of all citizens, but during wartime, all citizens have to make small sacrifices to ensure the stability of the regime and the security of the country. Even the most moderate socialism regime has to adopt some relatively tough policies during wartime, such as magic confiscation, resource requisition, compulsory military service, military takeover of the regime, planned production, news censorship, reporting system, and so on. These policies may be abolished after the war ends, but sometimes no one can predict the outcome of the war, and these policies may unfortunately become permanent."
	equatism_dogmatism:0 "Extreme Egalitarianism"
	equatism_dogmatism_desc:0 "Extreme Egalitarianism:\nExtreme Egalitarianism refuses to recognize the legitimacy of other Equatism factions: if not all creatures have exactly the same rights, exactly the same resources, exactly the same magic, exactly the same wealth, exactly the same opportunities, exactly the same education, how can it be called “equality”? Extreme Egalitarianists use an extreme way to always tilt social resources to the most disadvantaged groups in society until all ponies have exactly the same everything. They believe that only in this way can society truly achieve equality, and only in this way can society truly achieve harmony. However, so far, no egalitarian policy has achieved its ideal goal. More importantly, what about other countries? Should foreign citizens also maintain the same average level as the citizens here?"
	equatism_federal:0 "Internationalism"
	equatism_federal_desc:0 "Internationalism:\nInternationalists not only care about implementing Equatism policies within their own country or species, but they also believe that they have the task of liberating the entire Equestria world: ponies, changelings, griffons, etc., all the workers from the bottom of their society should unite and eliminate the villains, dictators, capitalists, and monsters together. However, beautiful ideals always suffer in reality: how to persuade the residents of their own country to care about the residents of other countries when their own survival and happiness are still in danger? How to persuade the residents of other countries to take action to overthrow their oppressors? How to persuade the leaders of other countries to accept their Equatism policies? Internationalists have been looking for answers, but so far, they have not found an answer that all countries can accept."
