l_simp_chinese:
	corporation:0 "重商思潮"
	corporation_noun:0 "重商思潮"
	corporation_desc:0 "重商思潮"
	corporation_drift:0 "重商思潮倾向"
	corporation_acceptance:0 "重商思潮外交接纳度"
	corporation_wiki_tooltip:0 "''“除了钱之外你就没想过别的吗？”''\n''“没有，为什么要去想别的？”''\n\n'''重商思潮下的意识形态：'''"
	corporation_republic:0 "巨型企业"
	corporation_republic_desc:0 "巨型企业：\n在巨型企业社会，效率至关重要。一个巨大的商业集团已经整合了这个国家的方方面面，甚至包括政府也是他们的经营业务。不过，利润虽然是企业的首要考虑，却不是他们的唯一考虑：造福全体员工与客户是他们的广告词，让每一位员工都能够享受到企业的股价上涨红利，是激发他们的员工工作积极性的最好方式。商品价格低廉、质量上乘，不仅让本国居民受益，也让其他国家的居民受益。诚然，随着巨型企业的垄断，市场竞争有所减少，贫富差距有所增大，但巨型企业承诺这些都将得到控制。起码目前为止，他们暂时算是勉强履行了他们的承诺。"
	corporation_democracy:0 "重商主义"
	corporation_democracy_desc:0 "重商主义：\n这个国家几乎已经变成了一个巨大的出口商，国家中的几乎每一位公民都在从事对外贸易和高端制造业，农业和低端工业被压缩到最低限度。贸易顺差是这个国家的生命线，政府除了保障居民的生活与自由市场外，几乎不会做任何事情：他们对于国际关系、气候变化、意识形态等议题毫不关心，他们的每一位公民也是如此。无数的中小型企业在这个国家中蓬勃发展，巨大贫富差距的现状在对未来的渴望中被淡化，公民们对于未来的信心是这个国家的最大财富。至于面临战争和动荡国际局势的问题... 他们只会选择将那成千上万的中小型企业转成成千上万的军火商。"
	corporation_monarchy:0 "商业帝国"
	corporation_monarchy_desc:0 "商业帝国：\n随着公司的规模不断扩大，公司的高层已经不再满足于在本国范围内的成功，为了开拓更大的国际市场，他们选择借助本国的政治与军事力量叩开那些懵懂国家的大门。很快，这个国家只剩下了两种身份：公司员工，与非公司员工。公司员工享受着无与伦比的福利，合理的工作时长与工资，甚至公司的股票分红；而非公司员工，其中包括底层、异族与那些殖民地，则只能在公司的压迫下面对着垄断市场上高昂的商品价格。贫富差距在公司内部正在不断缩小 —— 因为贫穷者不属于公司的一部分。"
	corporation_oligarchy:0 "商业寡头制"
	corporation_oligarchy_desc:0 "商业寡头制：\n如果说巨型企业声称他们同时造福员工与顾客，重商主义造福顾客，消费主义造福员工，那么商业寡头制则没有造福他们中的任何：在这里，一切利润最终都会流向公司高层。除去少数几位高管，整个国家的员工、生产者、消费者都在极端的贫穷中挣扎。倘若存在任何市场竞争，又或是外部政权的干涉，这种制造低劣而高价商品同时压榨员工的商业模式将会迅速崩溃。然而，这种制度的维持者们并不会让这种事情发生：他们会用尽一切手段来维持这种不公平的秩序，包括对于异见者的镇压与消灭。"
	corporation_tribe:0 "黑社会国家"
	corporation_tribe_desc:0 "黑社会国家：\n通过合法经营获取利润的全部方式似乎都已经被探索殆尽，想要获取更高的利润只能选择铤而走险。管制品、黑市军火、成瘾药物、甚至奴隶贸易，越高的风险意味着越高的收益。为了这些超额利润，经营者将不得不躲避警察、贿赂官员、与自己的同行开展无下限的竞争。但有些公司似乎摸到了特殊的门道，从而超越了这一切：他们渗透了这个国家，军队、警察、政府、法院，甚至是国家元首，都在他们的掌控之中，又或者就是公司的领导本身。终于，他们获得了一种零风险高利润的经营方式，只不过这种方式对于这个国家的其他居民来说，却是一种灾难，甚至于对于它的邻国也是。"
	corporation_freestate:0 "家族企业"
	corporation_freestate_desc:0 "家族企业：\n在小马利亚世界中，家族与友谊是重要的连接纽带，相对于法律与制度，往往更加有效。苹果家族和派家族的影响力就已经传遍了整个小马利亚世界，梨家族、樱桃家族、钱家族等更多的家族正在尝试追赶他们。相对于商业成就和知名度，派家族最成功的地方在于将家族企业上升到了国家的层面：他们取得了采石农场自治区的最高决策权，整个采石农场的居民都依赖于派家族的庇护，并从派家族这里获取生计。幸运的是，派家族愿意接纳难民、与贫穷的小马分享家族的财富，他们的家族企业也是小马利亚家族企业中最正面的代表。不过，不能寄希望于所有家族企业的慈善，因为他们中的大多数并不会像派家族那样。"
	corporation_organization:0 "消费主义"
	corporation_organization_desc:0 "消费主义：\n相比于通常商业国家希望积累尽可能多的财富，一个消费主义国家却希望没有任何财富积累：他们的目标是从国民的口袋与国家的国库中掏空最后一个金币，让一切都保持在流通中。琳琅满目的商品被发明出来，被以看上去最合适的价格销售。那么，代价是什么？债务。员工被极致地剥削，以至于他们的工资不足以维持生活，但与此同时他们却无法停止消费，几乎所有国民身上都背负着巨额的债务。这种消费主义国家的经济体系是如此的脆弱，以至于任何一点点的经济动荡都会导致整个国家的崩溃。不过，闭上眼，继续起舞吧，只要音乐还在响，一切都还是美好的。当气球爆炸，派对结束之时，抓紧最后的机会灌下几杯苹果酒，然后在雪茄与焰火中忘记一切。"
	corporation_duchy:0 "经济特区"
	corporation_duchy_desc:0 "经济特区：\n在这里，效率与经济依然是头等大事，不过也仅仅是对于这个地区而言。身为经济特区，当地的经济发展必须要为他们的宗主国做出贡献。这里的企业享受着宗主国的保护与贸易鼓励政策，作为交换，他们不得不将利润中的一大部分用于转移支付，或者经常因为宗主国的干预丢掉大笔订单。"
	corporation_utopia:0 "美丽新世界"
	corporation_utopia_desc:0 "美丽新世界：\n重商主义的实践在这里取得了空前的成功，随着公司的新一代产品 —— “奇迹疗法药水”上市，这个国家的居民们终于找到了他们真正的幸福。服用“奇迹疗法药水”，忘记一切烦恼与痛苦，消除饥饿与疲倦，专心为公司生产更多的产品，更多的“奇迹疗法药水”。这样员工们就能获得更高的工资，拥有更多的积蓄，购买更多的“奇迹疗法药水”。诚然，这种药水具有成瘾性，但是它绝对无害，而且价格是如此低廉以至于即使是最贫穷的员工都足以保证每天都能享用到。这个国家的居民们都在享受着这种美好的新世界，他们的幸福感永远处于最高点。公司实现了小马利亚历史上从未做到过的奇迹：所有公民无时无刻不在享受着永恒不止的幸福。"
	corporation_dystopia:0 "赛博朋克"
	corporation_dystopia_desc:0 "赛博朋克：\n重商主义的实践在这里失控了，在虚假的表象下隐藏着恐怖的现实。国家、阶层、社会、制度，逐渐消失了，但取而代之的不是平等，而是拥有一切的公司，那个唯一的公司。\n公司的广告宣传已经深入到整个国家的精神与文化中，每一个公民和他们的每一寸土地，他们食用的每一粒米，他们呼吸的每一口空气，和他们的每一秒钟时间，都只是公司的财产。“自由” “平等” 等理念随处可得 —— 他们被放在货架上售卖，当然，不是这些权利的所有权，而仅仅是临时租借来的使用权。每一位居民的债务都已经背负到了几百年之后，他们的子孙后代也将继续背负这些债务无偿为公司服务。精神药物、机械警察与自动化魔法设备保持着这个秩序的稳定，从而确保没有任何公民敢于拖欠公司的债务。而公司的高层管理在享用这一切么？不确定，没有居民见过他们。"
	corporation_theocracy:0 "神权企业"
	corporation_theocracy_desc:0 "神权企业：\n“品牌忠诚度” 是商业公司非常看重的一个指标，而在神权企业的社会中，这个指标被提升到了一个新的高度。购买公司的商品不再是出于更优秀的质量或是更低廉的价格，而是对公司品牌本身的狂热，或是对公司领导者的崇拜。公司的中层员工们成为了神的使者，代表至高之神为全国的居民带来了神圣的商品。公司的底层员工则在各个已经被改造成教会的商场推销，带领着顾客们诵读公司的经营理念与宣传口号。时不时，公司的高层员工会出现在电视上，向全国的居民传达公司的神圣使命，巩固他们对于公司的忠诚。谁购买了最多的商品，是每一位公民都关心的事情；“月度最佳顾客”，是这个国家的至高荣誉。对公司的产品质量有任何疑问？请放心，公司客服会来到您的家中，为您解答。"
	corporation_technocracy:0 "高科技企业"
	corporation_technocracy_desc:0 "高科技企业：\n利润率最高的企业，有时甚至可以不生产任何商品：思想，比任何水晶矿石都轻盈，却比金银珠宝更加珍贵。然而，宝贵的创意需要顶级的大脑来实现，可惜的是，并非所有公民都拥有顶级的大脑。高科技企业通常选择依靠移民政策，解决这个问题。而剩余的本国国民，则不再有任何价值，他们的工作、甚至是他们在社会中的角色都将被机器与自动化咒语所取代。一代代经过良好教育的小马或是其他生物进入这个国家，一张张设计图纸和魔法论文离开这个国家，而这个国家的本国国民，只能在这个国家的历史中留下一行行的数字。"
	corporation_militarism:0 "军事企业"
	corporation_militarism_desc:0 "军事企业：\n起初，他们也许只是一些军工厂，或者军火商。后来，业务拓展到了保镖、护送、刺杀、雇佣军、魔法训练。再后来，催债、维和、政变、代理战争。接着是，屠杀、毁灭、末日武器。一切，都只是为了一个好价钱。"
	corporation_dogmatism:0 "破产国家"
	corporation_dogmatism_desc:0 "破产国家：\n这个国家的经济已经坠入了不可逆转的深渊，他们曾经最引以为傲的国营公司已经破产，而失去了最主要支柱后其他经济也无力再给这个国家带来希望。债务的阴影笼罩着这个国家，政府日日轮换，游行与起义不断。在这个国家中，每一位公民都在为了生存而挣扎，而他们的政府却无力为他们提供任何帮助。"
	corporation_federal:0 "加盟企业"
	corporation_federal_desc:0 "加盟企业：\n多家不同的公司，出于共同的利益，结成的贸易联盟 —— 有时也是收购与并购导致的巨型母公司。对于各个分公司来说，他们所关心的是母公司的KPI，如何让自己的业绩在母公司的评估中国脱颖而出。而对于母公司来说，他们则对各个地区毫不关心，只要利润源源不断地流入账户，与他们合作的是国家、企业还是什么怪物，他们都不在乎。"
