	tut_12_text_1:0 "Ethiopia has surrendered! You have won!\nYou can now make demands during the §YPeace Conference§!. We recommend that you choose to §YTake All States§!.\n\nEach demand you make will increase £world_disharmony_icon  §YDisharmony§! by a certain amount. The higher the §YDisharmony§! is, the closer you are to a World War.\n\nSome countries have certain §YDiplomatic Actions§! locked until Disharmony is high enough. Read more in the hint below."
	BUTTON_WIKI_WORLD_TENSION:0 "Read about §HDisharmony§! on HOI4 Wiki!"
	BUTTON_HINT_WORLD_TENSION:0 "Read the hint on §HDisharmony§!"
	HINT_WORLD_TENSION:0 "Hint: Disharmony"
	HINT_WORLD_TENSION_TEXT:0 "This is the £world_disharmony_icon  §YDisharmony§! screen. All events that affect the Disharmony somehow, will be shown in the list here.\n\nDisharmony is a measurement of how heated the game has become. Certain countries may have certain §YDiplomatic Actions§! locked until Disharmony is high enough.\n\nGenerally speaking, Axis powers want the Disharmony to stay low to prevent Democratic countries from intervening, while Democratic countries want Disharmony to be high so that they can intervene.\n\nDeclaring War, justifying claims, annexing territory, completing certain §YNational Focuses§! are all examples of action that might increase Disharmony.\n\nThe higher the Disharmony is, the closer you are to a World War."
	HINT_WORLD_TENSION_TEXT_2:0 "£world_disharmony_icon  §YDisharmony§! is a measurement of how heated the game has become. Certain countries may have certain §YDiplomatic Actions§! locked until Disharmony is high enough.\n\nGenerally speaking, Fascist and Communist powers want the Disharmony to stay low to prevent Democratic countries from intervening, while Democratic countries want Disharmony to be high so that they can intervene.\n\nDeclaring War, justifying claims, annexing territory, completing certain §YNational Focuses§! are all examples of action that might increase Disharmony.\n\nThe higher the Disharmony is, the closer you are to a World War."
