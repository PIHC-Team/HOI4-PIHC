	rising_tension:0 "Rising Disharmony"
	test_the_chinese_focus_desc:0 "The Chinese still refuse to acknowledge our liberation of Manchuria, and disharmonys along the border near Beijing have resulted in several skirmishes. If we manufacture an incident, we can escalate the conflict into full-scale war. This will give us the excuse we need to deal with the Chinese once and for all!"
	NORDIC_first_joint_institution_desc_dem:0 "one where the cabinet members of the different countries in our supranational organization can discuss how to better combine our efforts to lead our people through the disharmonys rising in Europe."
	chinese_war_focus_desc:0 "The Marco Polo Bridge incident proved that the Chinese are not interested in cooperation. With increasing disharmony threatening the ensuing ceasefire, war may be the only means to bring the order to the Chinese nation."
	northern_expansion_focus_desc:0 "The Northern Expansion Doctrine, which has the support of the Imperial Army, recognizes that the Soviet Union poses the greatest threat to Japanese ambitions. With disharmonys rising in Europe, a favorable moment to attack the Russian Far East is bound to present itself. We must strike quickly."
	OPERATIVE_MISSION_DIPLOMATIC_PRESSURE_DESC:0 "§LInfluence an AI controlled nation to prefer your Faction and Non-Aggression Pacts. Player nations will get tightened restrictions to join other Factions.§!\n§HDaily Diplomatic Pressure: $BASE_ACCEPTANCE$§!\n  Base: $BASE_ACCEPTANCE|G$\n§HDaily Disharmony requirements: -$BASE_TENSION|%$§!\n  Base: §G-§!$BASE_TENSION|%G$"
