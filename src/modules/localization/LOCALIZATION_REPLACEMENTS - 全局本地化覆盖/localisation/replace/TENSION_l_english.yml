	NETHERLANDS_GATHERING_STORM_DESC:0 "The Dutch government eyes the mounting global disharmonys with concern. Between an ailing economy, a powerful pacifist movement, and a firm belief in neutrality to the point of driving potential allies away, they are unable to properly prepare their defenses.\n\nAt the same time, the importance of the Netherlands as a gateway of trade into the continent means that both the British and the Germans desire Dutch ‘cooperation’ to thwart the other, and may take rejection as a reason for hostility. Perhaps withdrawal to the colonies is the only possible means to resist such an invasion..."
	PORTUGAL_GATHERING_STORM_DESC:0 "Since Salazar’s rise to power in 1932, Portugal has been gradually distancing herself from the unstable period of the First Republic. Fiscal Autonomy and Political Independence from the major powers led to the creation of the Estado Novo, laying the foundations for the development of the Portuguese industry and the modernization of the army. \n\nNow, Portugal must decide the way forward as political and social instability increases in neighboring Spain and international disharmonys are hopelessly worsening..."
