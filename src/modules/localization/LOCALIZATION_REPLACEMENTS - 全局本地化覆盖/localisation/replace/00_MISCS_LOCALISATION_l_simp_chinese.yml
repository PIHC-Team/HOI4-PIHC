	PIHC_NAME:0 "高堡奇驹"
	PIHC_DESC:0 "§g“我们曾经拥有魔法，和友谊，但现在，我们失去了一切。”§!\n\n假若，和煦光流、邪茧和提雷克取得了终末之战的胜利...那会是一个怎样的世界？\n在这样一个架空世界中，世界线从G4第9季第24集开始发生了变动..."
	PIHC_WS_HEADER:0 "高堡奇驹"
	PIHC_WS_TAB_1:0 "剧情介绍"
	PIHC_WS_TAB_1_HEADER:0 "高堡奇驹世界观"
	PIHC_WS_TAB_1_TXT:0 "§g“我们曾经拥有魔法，和友谊，但现在，我们失去了一切。”§!\n\n假若，和煦光流、邪茧和提雷克取得了终末之战的胜利...那会是一个怎样的世界？\n在这样一个架空世界中，世界线从G4第9季第24集开始发生了变动...在决定小马利亚命运的终末之战中，没有来自各个地区的小马和各个其他种族的帮助，M6在战斗中落败。999年，“三巨头”——和煦光流、邪茧女王和提雷克大王组成的反派军团，取得了终末之战的胜利。\n1001年，“三巨头”在坎特洛特签署了瓜分小马利亚的协议：\n和煦光流为小马国的正统统治者，自封为“友谊女皇”，使用天角兽的绝对力量和充满蛊惑力的花言巧语，在小马利亚的废墟之上，建立了一个松散的分封制国家；在武力征服幻形灵王国后，邪茧女王肃清了所有反对者，重新恢复了她不容置疑的、至高无上的领导地位，并将整个幻形灵族群变回了原来的未化茧状态；提雷克大王则对权力并不痴迷，他更加痴迷于力量——他使用格罗迦之铃取走了小马利亚一半的魔法，回到了他的半人马家乡，并顺路奴役了周边的所有生物。\nM6和两位前公主被关押在塔尔塔洛斯监狱——那个曾经关押提雷克与和煦的地方。而且，她们是被分开关押的。\n无序、星光等小马虽然失去了魔法，但在终末之战的混乱中逃脱，他们联合不满于“三巨头”统治的小马们，在小马利亚各地组织着抵抗力量；大多数生物则接受了他们的失败，和他们悲惨的命运..."
	PIHC_WS_TAB_2:0 "国家介绍 ([Root.GetNameWithFlag])"
	PIHC_WS_TAB_2_HEADER:0 "[Root.GetNameWithFlag]"
	PIHC_WS_TAB_2_TXT:0 "[Root.GetCountryIntro]"
	PIHC_WS_TAB_3:0 "模组信息"
	PIHC_WS_TAB_3_HEADER:0 "高堡奇驹模组介绍"
	PIHC_WS_TAB_3_TXT:0 "1. 高堡奇驹模组主要为剧情向模组，游戏中仅允许通过国策、事件和决议进行外交，不允许正当化战争目标和进行一些结盟行为。通过国策进行的剧情向外交是游戏的重要内容。不过，玩家可以选择通过使用控制台或战犯决议进行宣战。\n2. 高堡奇驹模组对武器科技树进行了完全的重做，在模组中，科技的发展是非常迅速的（两三年的科技可以产生巨大的代差），同时也是缓慢的（所有国家的科学研究速度都被减缓了），这意味着通过事件、国策、决议等方式进行科研更加高效。\n3. 模组主要关注于小马利亚中央大陆（小马利亚），其次为幻形灵大陆（幻形灵尼亚），对于狮鹫大陆（狮鹫尼加）和麒麟大陆（麒麟索尔）的关注较少。\n4. 高堡奇驹模组中的建筑价格存在小幅调整；资源种类、分布和使用方式相对于钢4本体存在较大调整，玩家可以通过查看资源的说明来了解各类资源的使用方式。\n5. 整合了地主模组：在地块视图右上角，可以展开菜单，支付政治点来取得一个地区的核心。制造宣称是不允许的。\n6. 在屏幕右侧可以打开国家的物品栏，其中可能含有可以使用的物品、装备、剧情文本、关键道具等。"
	PIHC_WS_TAB_4:0 "版本信息"
	PIHC_WS_TAB_4_HEADER:0 "当前版本 §Yv0.2.3§!"
	PIHC_WS_TAB_4_TXT:0 "0. 当前版本为测试版，可能存在大量的bug和不完善内容，欢迎反馈。本模组将保持积极的更新。\n1. 版本开发过程中在MackBook Pro M1 macOS Monterey上测试，使用最新游戏本体。在其他游戏环境中有可能出现不兼容。\n2. 请各位玩家注意检查政治平衡。"
