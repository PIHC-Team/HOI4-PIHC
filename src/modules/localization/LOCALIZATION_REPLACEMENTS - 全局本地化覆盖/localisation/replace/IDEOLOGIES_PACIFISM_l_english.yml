l_english:
	peacism:0 "Pacifism"
	peacism_noun:0 "Pacifism"
	peacism_desc:0 "Pacifism ideology"
	peacism_drift:0 "Pacifism drift"
	peacism_acceptance:0 "Pacifism acceptance"
	peacism_wiki_tooltip:0 "War is a terrible thing for the creatures of Equestria.\nSo whether you are a Harmonism supporter, or a radical Equatist; whether you want to be an ursurper to control the world, or lead a revolution to return power to the public; whether you want to seize benefits through war, or just watch the world burn - we advise you to think twice.\n''War, war never changes.''\n\n'''Ideologies under Pacifism Ethos:'''"
	peacism_republic:0 "Neutralism"
	peacism_republic_desc:0 "Neutralism:\n“I miss the part where that’s my problem.” Neutralists believe that if every pony just minds their own business, the world will naturally achieve peace. Not only from an individual perspective, but also from a national perspective, they resolutely refuse to be involved in any war. Unfortunately, this attitude often makes them the victims of war. Neutralists are not afraid of war, and when faced with a necessary war, they will bravely stand up. However, when they try to ask “Who’s with me?” they will find that the surrounding countries are more willing to reply: “I miss the part where that’s my problem.”"
	peacism_democracy:0 "Xenophile"
	peacism_democracy_desc:0 "Xenophile:\nA xenophile country often has a curiosity and friendly attitude towards foreign cultures, political systems, and even foreign species, so that their voters will actively vote to support foreign aid and closer cooperation with foreign countries. Maybe they rely on tourism to earn foreign exchange, maybe they rely on foreign technical support to develop their economy, maybe they just like foreign food. In any case, the public of a xenophile country are always happy to accept foreign cultures and settlers, and this attitude makes it easier for them to obtain support from other countries in diplomacy. However, when two foreign countries are in conflict, and this xenophile country happens to be an ally of both sides at the same time, they often find themselves in a rather awkward situation."
	peacism_monarchy:0 "Deterrentism"
	peacism_monarchy_desc:0 "Deterrentism:\nSome interesting pacifist countries will choose a powerful war leader to rule them, just like the gentle Celestia can use the powerful power of the Harmony Element, or turn into the terrifying Sun of Destruction. Deterrentists believe that if you have enough power, you can avoid war. They never initiate wars, but they are always ready for war. This is like a game of the brave: the side that hates war the most must show the greatest determination to prepare for war, only in this way can ensure the long-term peace."
	peacism_oligarchy:0 "Financial Neutralism"
	peacism_oligarchy_desc:0 "Financial Neutralism:\nBecome the World Bank, let all countries in the world become bodyguards, let the world economy become a hostage, this is the way to achieve neutralism through financial status. More interestingly, financial neutralism not only brings peace, but also prosperity. They will obtain deposits from those warring countries, and obtain high custody fees from the deposits. However, when the financial neutralism country loses its financial center status, or when they are close to a war country that intends to break the pot, they often find themselves in a rather awkward situation. In addition, the biggest threat to these gold-filled treasuries is not pirates or looters, but inflation, financial crises, and the rise of new financial instruments such as development bonds, magic credits, and rare crystal mines."
	peacism_tribe:0 "Pacifism Tribe"
	peacism_tribe_desc:0 "Pacifism Tribe:\nMost tribes have a tradition of war and martial arts, but pacifist tribes are not. Many such tribes have ancestors from Three Tribes Covenant period, they may have been separated from the pegasi, earth ponies, and unicorns, or they may not be ponies at all. In the cold isolation without help, most of the warlike tribes around them have perished, but they miraculously survived, and fortunately (or unfortunately) kept away from civilization until now. Members of pacifist tribes usually remain vigilant against outsiders, but they do not initiate attacks. If conflicts are inevitable, they would rather move the entire tribe away. This extreme desire for peace does not come from kindness or weakness, but from the fear of the wind magic engraved in their bones."
	peacism_freestate:0 "Pacifism Commune"
	peacism_freestate_desc:0 "Pacifism Commune:\nKirins are one of the few pacifist communes that have developed into modern countries. Most pacifist communes will gradually abandon the pacifism ideology during the process of civilization development, or abandon the commune form to become a neutralism or xenophile country. But Kirins have their own special features — they cannot wage war, or at least not large ones. Because war brings anger, anger brings Niriks, Niriks bring destruction, and then everything will turn into ashes in the flames. Therefore, the pacifism ideology of Kirins is a curse that they are forced to accept and cannot escape, affecting all aspects of their social structure design and foreign policy. Meanwhile this curse is also a blessing, keeping them to be safe and sound for thousands of years, whether the external world is chaotic or stable, whether the Kirins are chaotic or stable, it is just a dream by the fire for them."
	peacism_duchy:0 "Demilitarized Zone"
	peacism_duchy_desc:0 "Demilitarized Zone:\nAfter being controlled, the suzerain chooses to turn this place into a permanent demilitarized zone: maybe because the suzerain itself believes in the pacifism ideology, or more likely because the suzerain wants to completely destroy the probability of this area rising again and seeking revenge. Some countries even choose to actively abandon military power and rely on a strong country to ensure their own safety. In any case, the residents of this area will enjoy the benefits of pacifism under the control of the suzerain, but they will also lose some freedom, and will always be begging their suzerain to protect them."
	peacism_theocracy:0 "Pacifism Papal State"
	peacism_theocracy_desc:0 "Pacifism Papal State:\nWhat if a country does not participate in any political or economic activities, but simply focuses on being a huge church? No one will actively attack a church that has no wealth, no industry, no labor, but only a large number of fanatical believers. Of course, the Papal State will not fail to establish enemies: usually they will work hard to spread their religion, after all, more believers mean more protection and more offerings. In this process, pagans and atheistic countries are often offended."
	peacism_technocracy:0 "Creative Pacifism"
	peacism_technocracy_desc:0 "Creative Pacifism:\nA country is sometimes invaded because of hatred or culture, but more often because of resources, wealth, industry, and geographical location. And if the only wealth of a country is the brain in this country, then this country will become extremely valuable. Creative pacifists believe that as long as their technology is leading and continues to output technological innovations and cultural creativity that can improve everything to the world, they can avoid war. They never worry about the conditions of being militarily attacked, they only eliminate the motivation of the military attack."
	peacism_militarism:0 "Active Pacifism"
	peacism_militarism_desc:0 "Active Pacifism:\n“As long as all the risks of war disappear from this world, peace can be achieved.” The name of active pacifists is deceptive: not only deceiving their enemy countries, but also themselves. They will actively initiate wars, but they firmly believe that everything they do is for peace. It is the usual strategy of active pacifists to de-escalate the situation through escalating the situation, while the countries defeated by a pacifist country are often ruthlessly ridiculed. The only thing that can live up to their name is that after the active pacifists win the war, they will hardly exploit the resources of the defeated countries, but will help them recover as soon as possible. They will provide aid on everything, except the military."
	peacism_dogmatism:0 "Absolute Pacifism"
	peacism_dogmatism_desc:0 "Absolute Pacifism:\nAbsolute pacifists oppose any form of war. “When another pony kicks you in the face for no reason, an absolute pacifist will turn the other cheek.” They would rather give up their territory or even their lives than pick up weapons. Their pacifism ideology is their faith, their life, their everything. But they are not miserable victims, but the lucky ones in this world: the luckiest thing for them is that they are still alive."
	peacism_federal:0 "Joint Deterrentism"
	peacism_federal_desc:0 "Joint Deterrentism:\nThe basis for avoiding war is the deterrence of war. Joint Deterrentists believe that when multiple pacifism countries form alliances, their huge size is enough to help them avoid war. But the enemies of the deterrentists are never the aggressors, but the weak in the peace alliance. Those xenophiles and absolute pacifists will choose to evade when a real war comes, which will weaken the deterrence of the entire alliance. This is like a game of the brave: the side that hates war the most must show the greatest determination to prepare for war, only in this way can ensure the long-term peace. And the game of multiple braves is the most difficult-to-play variant in this game."
	peacism_spirit:0 "Peaceful Spirit"
	peacism_spirit_desc:0 "Peaceful Spirit:\nThis is a society composed of spirits. They do not need political structures, they only need to live together and maintain the concept of peace together. They have the most primitive cognition of peace, the purest and uncontaminated, closer to the essence of peace than the creatures in those primitive tribes."
