l_english:
	harmonicism:0 "Harmonism"
	harmonicism_noun:0 "Harmonism"
	harmonicism_desc:0 "Harmonism"
	harmonicism_drift:0 "Harmonism drift"
	harmonicism_acceptance:0 "Harmonism acceptance"
	harmonicism_wiki_tooltip:0 "“Friendship is Magic!” I think this is not a question that needs to be discussed too much in Equestria — until those pioneers and definers of friendship have gradually gone away. The concept of harmony is becoming increasingly blurred in the hearts of ponies, different factions are beginning to form, and an Ethos that advocates harmony itself has ultimately become the source of quite a lot of disagreements.\nSometimes, maybe all we need to do is look back, remember why we started, remember those friendships, remember those harmonies.\n\n'''Ideologies under Harmonism Ethos:'''"
	harmonicism_republic:0 "Conservative Harmonism"
	harmonicism_republic_desc:0 "Conservative Harmonism:\n“Friendship IS Magic”, and it is a foolish act to argue with each other because of different interpretations of the idea of harmony. Generosity, honesty, laughter, kindness, loyalty, magic... These beautiful virtues that allow ponies to get along with each other in a friendly and harmonious way are naturally harmony, just as certified by the Tree of Harmony, the Treehouse of Harmony, and the Friendship Map. From Star Swirl, to Princess Celestia, to Twilight Sparkle, generations of great ponies have interpreted the meaning of harmony with their own actions, and we should also remember them all.\nNo matter how distorted this world is today, whether the idea of harmony is misinterpreted or demonized, every pony’s heart naturally has a balance: every pony has the ability to measure whether their behavior conforms to harmony, without any government or leader telling them what is harmony or what is not. Because Harmonism is not a political idea, but a simple value, a natural way of life."
	harmonicism_democracy:0 "Democratic Harmonism"
	harmonicism_democracy_desc:0 "Democratic Harmonism:\nEverypony may have their own understanding of harmony, and most of the time, their understanding is consistent, but sometimes they may have differences. At this time, the simplest solution is naturally to decide by voting. To satisfy as many ponies as possible, this is the meaning of democracy, and this is the way to maximize social harmony.\nHarmony is hidden in the heart of every pony, and every pony together forms harmony, which is also applicable to creatures of other species."
	harmonicism_monarchy:0 "Celestiaism"
	harmonicism_monarchy_desc:0 "Celestiaism:\nAfter Princess Celestia sent her sister Nightmare Moon to the moon for the well-being of the ponies, under her rule, Equestria has enjoyed a millennium of peace and prosperity. A well-recognized Harmonic monarch leads the country —— this is the core of Celestiaism. In this political system, although the monarch has almost absolute power, the idea of harmony itself constrains the monarch’s behavior. Indeed, even the near-perfect Princess Celestia cannot avoid making mistakes, but it is difficult to say that her rule is unsuccessful over a millennium.\nHowever, it is worth noting that Celestiaism has never been able to solve the problem of power transfer: no monarch can rule forever, and in the issue of finding a successor, Celestia failed. This is also the reason why Equestria has entered the current situation, so how to ensure the continuity of the Harmonic monarch is a problem worth thinking about. Another more realistic problem faced by Celestiaism is that this name is no longer allowed to be mentioned. Some ponies want to rename it “Harmonic Monarchy”, but this name has not been popularized yet."
	harmonicism_oligarchy:0 "Twilightism"
	harmonicism_oligarchy_desc:0 "Twilightism:\nGenerosity, honesty, laughter, kindness, loyalty, and magic. Six ponies together formed the Friendship Committee, each in charge of her own spirit of harmony, jointly maintaining the harmony of Equestria. Members of the Friendship Committee may retire, but the ideas they represent will be passed down from generation to generation; old ideas of harmony may be replaced by new ideas of harmony, and the leader will also cultivate her own apprentices, but the core of Harmonism will never change ——\nSo sad that none of this has happened. But does it matter? Twilight Sparkle’s apprentices are still active in every corner of Equestria, and her “Friendship Journals” are still published in underground publishing houses. Someday, a new Friendship Committee will appear again and continue to maintain the harmony of Equestria —— even if the members are no longer the original six ponies. But does it matter?"
	harmonicism_tribe:0 "Harmonic Tribe"
	harmonicism_tribe_desc:0 "Harmonic Tribe:\nThe idea of harmony is so common in Equestria that even primitive tribes that have not yet entered the civilized era may adopt harmony as their guiding ideology. Such a society is to some extent in a rather primitive state, with social members generally linked by blood relationships, living a life of farming and hunting in the vast natural environment, and living a life of peace. Sometimes, several tribes form a loose alliance, barely ruling a fairly empty area. The members of these tribes all recognize Harmonism to some extent, although their Harmonic ideas are still quite primitive and rudimentary, and they are not even clear about what harmony is. All that matters is that they often live in unity and mutual assistance, equal cooperation, and some scholars believe that this is the prototype of modern Harmonism.\nFor example, the Buffalo Tribe once had a long-standing conflict with the Apple Family: the Buffalo Tribe believed that the settled Apple Family colonists had destroyed their environment and taken away their homeland. But in the end, with the mediation of ponies such as Twilight Sparkle, the Buffalo Tribe and the Apple Family reached a reconciliation and lived mutually beneficially on the same land. Since then, Chief Thunderhooves has become the Harmonic chief of the tribe, and the buffalo gradually moved towards civilization with the help of the Apple Family."
	harmonicism_freestate:0 "Harmonic Freestate"
	harmonicism_freestate_desc:0 "Harmonic Freestate:\nThe Harmonic freestates first appeared in the pre-Pillars era, when pegasi, earth ponies, and unicorns had reached a reconciliation and established many freestates throughout Equestria where different species coexisted. Due to the long-term coexistence and the inconvenience of ancient communication caused by the remnants of the Windigos, the original single-species countries such as the Pegasi Empire slowly disintegrated, so various regions existed in the form of Harmonic freestates for quite a long time until the two princesses gained control.\nThe rise of Harmonic freestates again was after the Ultimate Battle. In the first year after the war, the Royal Council did not have time to restore contact with the whole country, and many cities lost contact with Canterlot, forming independent Harmonic freestates. For example, the early Ponyville led by Mayor Mare, and Manehattan before the gang wars."
	harmonicism_organization:0 "Harmonic Corporatism"
	harmonicism_organization_desc:0 "Harmonic Corporatism:\nCorporatists believe that different classes can resolve their differences through representative negotiations, which coincides with the idea of Harmonists: there is nothing that cannot be calmly discussed. However, traditional corporatism usually resorts to authoritarianism or a leader to preside over negotiations between various interest groups, while Harmonists believe that such negotiations can occur spontaneously without any external coercion —— as long as all classes agree with the idea of Harmonism.\nThere have been a few political commentators who criticized Twilight Sparkle for taking a Harmonic corporatist stance in resolving many friendship issues, not being entangled in the beginning of the conflicts but only seeking the resolution of the conflicts. However, due to the success of Twilight Sparkle’s mediation in all cases, although violence may be used in the mediation process, the result does not involve forcing one party to make concessions. That’s why the criticism, by Harmonic corporatists’ perspective, is considered rather an affirmation of Twilight Sparkle’s behavior. Corporatists also often like to use Twilight’s behavior to endorse and defend themselves. Because of Twilight Sparkle’s 100% success rate, Harmonic corporatists have never tried to answer: what to do if the negotiation mechanism fails and a consensus cannot be reached?"
	harmonicism_duchy:0 "Harmonism Apprentice"
	harmonicism_duchy_desc:0 "Harmonism Apprentice:\nIn the thousand-year history of Equestria, the thing that is least lacking is the conqueror villains who invaded Equestria and were defeated. Usually, they will establish evil empires in areas outside central Equestria and enslave the local residents for several years or even hundreds of years without being noticed by Princess Celestia or Twilight Sparkle. After that, for some reason, they always let their inflated ambitions blind their rational eyes, choose to invade Equestria, and then be defeated by the rainbow laser. At this time, how should the evil empire without the villain leader be handled? Most of the time, the active resistors among the local residents will be supported as the new leader, and the entire region will rebuild civilization and learn from the Equestria that liberated them, thus becoming Harmonism apprentices.\nCountries that become Harmonism apprentices are often greatly influenced by Equestria in terms of culture, politics, economy, etc., and sometimes are mistakenly regarded as vassal states of Equestria. However, the only link between the suzerain state and the vassal state is the common belief in Harmonism, not political control, nor mass destruction weapons like the rainbow laser."
	harmonicism_authoritarianism:0 "Authoritarian Harmonism"
	harmonicism_authoritarianism_desc:0 "Authoritarian Harmonism:\nAlthough this has never happened in history, the Swanifying Committee had long ago formulated a plan for this situation. Several years before the return of Nightmare Moon, the first student of Princess Celestia, Sunset Shimmer, fleeing had caused a great blow to Princess Celestia. It is said that she did not appear in public for two or three weeks and did not handle government affairs. During this period, the Swanifying Committee once assumed the worst case: if Princess Celestia’s personality changed from a loving leader to a ruthless iron-fisted ruler, how should Equestria respond? This plan is considered the first hypothetical of an authoritarian Harmonism country: the leader is still a Harmonist, but her code of conduct is no longer constrained by Harmonism. Compared to promoting harmony through cultivating students, propagating ideas, and practicing it, this political system that relies more on the coercive power of the government is considered to be a variant of Harmonism rather than despotism. Based on this conclusion, the plan unanimously decided that the government would continue to support Princess Celestia’s rule until her behavior completely deviated from Harmonism."
	harmonicism_totalitarianism:0 "Totalitarian Harmonism"
	harmonicism_totalitarianism_desc:0 "Totalitarian Harmonism:\nTotalitarian Harmonism sounds like a political system that is unlikely to exist, but it is not difficult to imagine: here, the Harmonism leader will impose the harshest punishment on all enemies of harmony. “The end justifies the means” is the motto of this political system: as long as it is for the sake of harmony, any means can be used. Surveillance, censorship, arrest, execution, if all disharmonious forces disappear from society or at least cannot make a sound, then this society can only be harmonious forever. Of course, honest Harmonists may ponder the definition of “disharmonious forces”, but the leaders of this political system do not care about these."
	harmonicism_utopia:0 "Harmonism Utopia"
	harmonicism_utopia_desc:0 "Harmonism Utopia:\nHere, the practice of Harmonism has achieved unprecedented success, and all creatures live in a harmonious environment, happy and satisfied. Perhaps the food production or economic development here is not the best, but the residents here must be the happiest. Every citizen has friends who care about him/her, and at the same time, they all have a heart that loves other ponies.\nThis is where the magic happens, this is where the magic lives. Our friendships weave together stronger, the bonds grow deeper, lasting longer. And the greatest spell you'll know, is how the magic of friendship grows."
	harmonicism_dystopia:0 "Harmonism Dystopia"
	harmonicism_dystopia_desc:0 "Harmonism Dystopia:\nHere, the practice of Harmonism has gotten out of control, and under the false appearance hides a terrifying reality. Even without any coercive machine forcing the residents, “do not become a disharmonious force” is ironed into the minds of every resident. Friendship is not without effort: here, every word and deed of all residents is like walking on thin ice. A casual curse may plunge you into an abyss of no return. A hypocritical praise may also expose you to the attack of the entire society. If your belief in harmony is not sincere, then your trembling disguise cannot escape the scrutiny of all residents.\nCompared to those oppressive police states, there is no tyranny here, no surveillance, but it is more terrifying than tyranny, more suffocating than surveillance: every resident here is a watcher, and every resident here is a judge. Perhaps, lowering your own presence is the only creed to survive in this society: as long as you are not noticed, you will not be accused of disharmony. Every resident is trying to hide their existence, and privacy is the most precious luxury in this country. In fact, though there is no law here, it is already difficult to find any “legal” behavior. And even if you do nothing, it will be something that only a passive disharmonious force will do."
	harmonicism_theocracy:0 "Harmonic Theocracy"
	harmonicism_theocracy_desc:0 "Harmonic Theocracy:\nOn the stage of ideology, there are always ponies endlessly arguing about “what is Harmonism”, but Harmonic theists can give a very clear answer: Harmony is not an elusive value, but a physical force. The Tree of Harmony, the Treehouse of Harmony, and the Friendship Map are the agents of this deity, and Princess Twilight Sparkle and other princesses are the messengers of this deity. “The Tree of Harmony has its own will and can express itself through spoken language.” This argument kills all disputes: if everyone agrees that “friendship is magic”, then friendship that has been certified by magic is naturally the most standard harmony. If your friendship has not brought you magic, then you must have done something wrong.\nBut on the other hoof, it has been several years since the last time the Tree of Harmony transformed, that time into the image of Twilight Sparkle. No Harmonic theist can answer why the Tree of Harmony has remained silent for so long. Some dissenters believe that the deity of harmony is dead now and the world will no longer be protected; some extremists believe that Judgment Day is coming, and the deity of harmony will kill all of us in silence; more moderates believe that this is just a test, and the deity of harmony is testing our faith when it is tested the most. However, as the Windigos approach day by day, the pessimists among the Harmonic theists are increasing: perhaps the deity they believe in has already been defeated in the war of the deities."
	harmonicism_technocracy:0 "Harmonic Rationalism"
	harmonicism_technocracy_desc:0 "Harmonic Rationalism:\n“Friendship is magic”, a very attractive and catchy slogan. But the rationalists in Harmonism often don’t buy it: it’s already bad enough that we don’t know what magic is, and we have to introduce the vague concept of “friendship”? Therefore, the Harmonic rationalists advocate solving the mystery of friendship thoroughly through scientific methods. First, what is the principle of magic? How does energy transfer? How does matter act? Then, how does friendship affect magic? Can it be between any creatures? Can rocks produce friendship magic? How good a relationship can be called “friendship”?...\nHarmonic rationalists emphasize that controlled experiments are necessary, but their research always seems to encounter some “friendship phantoms”: whether conducting experimental observations seems to affect the generation of friendship, and the same event will produce different results in repeated experiments depending on whether it is observed. “friendship magic does not play dice”, some of them firmly believe this, but in fact, several years ago, Discord and Twilight Sparkle had already denied Harmonic rationalism. With the advancement of technology, these rationalists seem to have new research directions and they just want to try again."
	harmonicism_militarism:0 "Harmonism Exporter"
	harmonicism_militarism_desc:0 "Harmonism Exporter:\nHarmonism discourage conflict, but Harmonism cannot prevent conflict. In the spirit of “preventing conflict”, the militarists among the Harmonists believe that overthrowing some disharmonious regimes or controlling some disharmonious masses through small-scale wars to avoid larger conflicts, is a price worth paying. The most typical Harmonism exporter is the Knights of Harmony of Cunabula: they understood the idea of “friendship is magic, magic is power, so friendship is power” way earlier than Cozy Glow in Equestria, and in order to prevent the powerful force of Harmony from falling into the hands of dangerous users, the Knights of Harmony will monitor the users of Harmony magic and those disharmonious threats worldwide, and stop all behaviors that do not conform to their definition of Harmony. If they determine that some disharmonious behaviors have reached an intolerable level, they will immediately take action to eliminate these disharmonious forces or Harmonism deviants in the bud. As for why they have not taken action yet, we should not ask, because the ponies who have witnessed the Knights of Harmony’s crusade will know that it is a bless that they have not taken action yet."
	harmonicism_dogmatism:0 "Dogmatic Harmonism"
	harmonicism_dogmatism_desc:0 "Dogmatic Harmonism:\n“Friendship is magic”, this is what every pony will hear from birth, and it is the essence of Harmonism. However, there are many differences in the interpretation of this sentence, which has led to quite a few factions. Each of these factions looks very reasonable, and can be logically consistent, and as time goes by, more and more ponies claim to have a unique interpretation of Harmony. Princess Twilight Sparkle may try to make an official interpretation of Harmony, but even this can only represent her individual opinion.\nDogmatists believe that the definition of Harmony must be strictly recorded in writing and must be strictly adhered to. Diversity is a curse, and different, ambiguous interpretations will only lead to factional conflicts, chaos, and the fade of Harmony. So they choose to compile the concept of Harmony into a rigorous series of encyclopedias, establish the Harmony Standard Association, and interpret Harmony word by word to ensure that every pony has a unified understanding of Harmony. Today, the initial standards have been established under the management of the EEA led by Neighsay. However, as the power of Cozy Glow gradually consolidates, more ponies are just worried about the neutrality of the EEA and this standard: can the association truly be neutral? Of course, the association responded to this concern officially, but when they started to cite a passage from a page of an ancient book that is older than Celestia, you might not want to listen anymore."
	harmonicism_federal:0 "Friendshipism"
	harmonicism_federal_desc:0 "Friendshipism:\nFriend, the most important concept in friendship, the most indispensable part. But Princess of Friendship and Princess of Love are not the same alicorn, so “friendship” and “love” are also two completely different concepts. Different from the intimate relationship expressed by “love”, “friendship” has boundaries: if you can reach out to help each other when needed, then you can be called friends. In this way of thinking, a unified political entity may not be necessary in a Harmonism country. Faced with crises and threats, members of an alliance can help each other; but in daily life, all friends are just independent countries, each maintaining their own Harmony.\nOf course, whether this loose alliance can withstand the test is a very questionable question: a long time ago, the southern countries formed a Friendshipism alliance, but eventually disintegrated under the invasion of the Storm Empire. Now, the Storm Empire has been defeated, but whether the Friendshipism alliance has a chance to revive is still unknown. At least after the lessons of history, more countries still maintain distrust and vigilance."
	harmonicism_spirit:0 "Harmonic Spirit"
	harmonicism_spirit_desc:0 "Harmonic Spirit:\nThis is a society composed of spirits. They do not need political structures, they only need to live together and maintain the concept of Harmony together. They have the most primitive cognition of Harmony, the purest and uncontaminated, closer to the essence of Harmony than the creatures in those primitive tribes. Many may even doubt whether they really exist, but at least, the reindeer are proof that such spirits exist: they live on the snowy mountains, never participate in any disputes, and even help creatures send gifts on Hearth’s Warming Eve. However, the physical existence of spirits is also a danger: as long as there is a physical entity, it can be killed. Therfore, some changelings may question, how long these spirits can remain “uncontaminated”."
	harmonicism_revengeism:0 "Revengeful Harmonism"
	harmonicism_revengeism_desc:0 "Revengeful Harmonism:\nAn eye for an eye, a tooth for a tooth. This is almost a natural concept. For the revengeful Harmonists, their dignity has been ruthlessly trampled, their homes have become ruins, they crawled out of the corpses of the old era, claiming to rebuild what they believe to be the orthodox Harmonious thoughts. In troubled times, heavy codes must be enforced. Harmony is dead, and they will avenge it in their own way. Therefore, what the revengeful Harmonists do is often unrelated to the Harmonious advocacy — power is highly concentrated, rulers often act arbitrarily, and they use various means to strike against the opposition, even at the cost of cruel repression. They often maintain a huge army for conquest or self-defense, and a terrible war frenzy spreads throughout the country. All suffering is worth it, because in the end, they will pull those villains who caused the current situation down from their thrones, and let them burn to ashes together with the world that they once destroyed.\nThe demands of the revengeful Harmonists often make even the most radical militarists afraid, and their legends make every foal too scared to sleep at night. But for those poor creatures who have lost their loved ones, can you really blame them for this?"
	harmonicism_equatism:0 "Ocellusism"
	harmonicism_equatism_desc:0 "Ocellusism:\nAfter the Ultimate Battle, Ocellus, the changeling apprentice of Twilight Sparkle, continued to promote Harmonism in accordance with the will of her teacher. She refused to revert to an unmetamorphosed changeling and was thus imprisoned by Queen Chrysalis. In eastern Changelinia, she witnessed the hungry changelings who had to contribute their last bit of love under the oppression of the army. Ocellus noticed the strict hierarchy within the changelings and decided to fight for the rights of these poor changelings at the bottom of the hierarchy. She continued to write secretly in prison, further developing the thoughts of Twilight Sparkle, integrating them with her own observations, and eventually forming Ocellusism.\nOcellusism can be seen as a mixture of Harmonism and Equatism. Twilight Sparkle often uses a reconciliatory way to achieve a perfect society by temporarily relinquishing interests from all parties to ease conflicts. However, in Ocellus’s view, just as the unmetamorphosed changelings are always starving for love, class conflicts can never be truly alleviated, and ultimately one side must be eliminated or both sides will perish together. Therefore, Ocellus no longer hopes to correct those villains through friendship, but to overthrow the oppressors via violent means and eliminate class oppression by force. Only by eliminating these inequalities can the soil for the emergence of new villains be fundamentally eradicated, and true, permanent harmony can be truly achieved."
